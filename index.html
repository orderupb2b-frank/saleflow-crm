async function deleteDealFile(fileId, ctId, accId) {
  const f = (dealFilesCache[ctId] || []).find(function (x) { return x.id === fileId; });
  if (!f) return;
  openConfirm('刪除檔案', '確定刪除「' + esc(f.file_name) + '」？', async function () {
    closeModal();
    const d = await db.from('deal_files').delete().eq('id', fileId);
    if (d.error) { toast('刪除失敗：' + d.error.message, 'error'); return; }

  }, closeModal, '刪除', '取消');
}

async function runLostReport() {
  const el = document.getElementById('lostResult'); if (!el) return;
  const rg = document.getElementById('lostRange').value;
  let qy = db.from('leads').select('id,name,user_id,user_name,lost_reason,lost_at').not('lost_reason', 'is', null);
  if (rg === '90') qy = qy.gte('lost_at', new Date(Date.now() - 90 * 86400000).toISOString());
  else if (rg === 'year') qy = qy.gte('lost_at', new Date(new Date().getFullYear(), 0, 1).toISOString());
  const { data, error } = await qy.order('lost_at', { ascending: false });
  if (error) { el.innerHTML = '<div style="color:var(--red);font-size:13px">讀取失敗：' + esc(error.message) + '（需要先執行 v4 SQL）</div>'; return; }
  let rows = data || [];
  if (!window.isAdmin) rows = rows.filter(function (r) { return r.user_id === currentUser.id; });
  if (!rows.length) { el.innerHTML = '<div class="empty-state" style="padding:24px"><div class="empty-text">這段期間沒有記錄結案原因的線索</div></div>'; return; }
  const cnt = {};
  rows.forEach(function (r) { const k = String(r.lost_reason).split('：')[0]; cnt[k] = (cnt[k] || 0) + 1; });
  const max = Math.max.apply(null, Object.values(cnt));
  let h = '<div style="margin-bottom:16px">';
  Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).forEach(function (k) {
    h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="width:84px;font-size:12.5px">' + esc(k) + '</div>'
      + '<div style="flex:1;height:16px;background:var(--bg4);border-radius:4px;overflow:hidden"><div style="height:100%;width:' + Math.round(cnt[k] / max * 100) + '%;background:var(--red);opacity:.7"></div></div>'
      + '<div style="width:70px;text-align:right;font-size:12.5px;font-family:var(--mono)">' + cnt[k] + '（' + Math.round(cnt[k] / rows.length * 100) + '%）</div></div>';
  });
  h += '</div><div class="form-label" style="margin-bottom:6px">明細（' + rows.length + ' 筆）</div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>公司</th><th>原因</th><th>業務</th><th>結案日</th></tr></thead><tbody>';
  rows.forEach(function (r) { h += '<tr style="cursor:pointer" onclick="openCompany(\'' + r.id + '\')"><td>' + esc(r.name) + '</td><td style="font-size:12.5px">' + esc(r.lost_reason) + '</td><td style="font-size:12px">' + esc(r.user_name || '') + '</td><td style="font-size:12px">' + fmtDate(r.lost_at) + '</td></tr>'; });
  el.innerHTML = h + '</tbody></table></div>';
}

  const { data: accounts } = await db.from('accounts').select('lead_id').not('lead_id', 'is', null);
  convertedLeadIds = new Set((accounts||[]).map(a => a.lead_id));

  // usersData already loaded from loadGlobalData() above - don't overwrite!
  // But add any users from leads that aren't in usersData yet (edge case)
  const seenIds = new Set(usersData.map(u => u.id));
  leadsData.filter(l=>l.user_id&&l.user_name&&!seenIds.has(l.user_id)).forEach(l => {
    usersData.push({ id: l.user_id, full_name: l.user_name, role: 'sales', email: '' });
    seenIds.add(l.user_id);
  });

  if (!isLeadsPage()) return;
  document.getElementById('topbarActions').innerHTML = `
    <div class="action-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="form-input search-input" id="leadSearch" placeholder="搜尋..." style="width:150px" oninput="filterLeads()">
      </div>
      <button class="btn btn-secondary btn-sm ${showConvertedLeads?'btn-primary':''}" onclick="toggleShowConverted()" data-tip="顯示/隱藏已轉客戶的 Lead" style="font-size:11px">🏢 ${showConvertedLeads?'含已轉':'僅進行中'}</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadImportTemplate()">📋</button>
      <button class="btn btn-secondary btn-sm" onclick="importLeadsExcel()">📥</button>
      <button class="btn btn-secondary btn-sm" onclick="exportLeadsExcel()">📤</button>
      <button class="btn btn-primary btn-sm" onclick="openNewLeadModal()">＋ Lead</button>
    </div>
  `;

  // Auto list-mode on mobile
  const isMobile = window.innerWidth <= 768;
  if (isMobile) { renderLeadsMobile(); return; }
  leadsViewMode = currentPage === 'leadlist' ? 'list' : 'kanban';
  if (leadsViewMode === 'list') renderLeadsList();
  else renderKanban();
}

function renderKanban(searchStr = '') {
  if (!isLeadsPage()) return;
  const content = document.getElementById('content');
  content.style.padding = '16px';
  content.style.overflowX = 'auto';

  // Build filter bar
  const srcOptions = [{val:'all', label:'全部來源'}, ...sourcesData.map(s=>({val:s.id, label:s.name}))];
  const stageOptions = [{val:'all', label:'全部階段'}, ...stagesData.map(s=>({val:s.id, label:s.name}))];

  // Build user options from leads data
  const userMap = {};
  leadsData.forEach(l => { if (l.user_id && l.user_name) userMap[l.user_id] = l.user_name; });
  const userOptions = [{val:'all', label:'全部業務'}, ...Object.entries(userMap).map(([id,name])=>({val:id, label:name}))];

  content.innerHTML = `
    <div class="kanban-filters">
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('stage',this.value)">
        ${stageOptions.map(o=>`<option value="${o.val}"${kanbanFilterStage===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('user',this.value)">
        ${userOptions.map(o=>`<option value="${o.val}"${kanbanFilterUser===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('src',this.value)">
        ${srcOptions.map(o=>`<option value="${o.val}"${kanbanFilterSrc===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>
    <div id="kanban-board"></div>`;

  const board = document.getElementById('kanban-board');
  if (stagesData.length === 0) {
    board.innerHTML = '<div class="empty-state"><div>請先在設定中建立階段</div></div>';
    return;
  }

  const stagesToShow = kanbanFilterStage === 'all' ? stagesData : stagesData.filter(s => s.id === kanbanFilterStage);
  stagesToShow.forEach((stage, si) => {
    const stageIdx = stagesData.indexOf(stage);
    const stageleads = leadsData.filter(l => {
      if (l.stage_id !== stage.id) return false;
      if (!showConvertedLeads && !searchStr && convertedLeadIds.has(l.id)) return false;
      if (searchStr && !leadMatches(l, searchStr)) return false;
      if (kanbanFilterSrc !== 'all' && (l.source_id||'') !== kanbanFilterSrc) return false;
      if (kanbanFilterUser !== 'all' && (l.user_id||'') !== kanbanFilterUser) return false;
      return true;
    }).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    si = stageIdx;

    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.dataset.stageId = stage.id;
    col.innerHTML = `
      <div class="kanban-col-header">
        <div style="display:flex;align-items:center;gap:7px">
          <div class="col-accent" style="background:${stage.color||STAGE_COLORS[stageIdx]||'var(--accent)'}"></div>
          <div class="kanban-col-title">${stage.name}</div>
        </div>
        <div class="kanban-col-count">${stageleads.length}</div>
      </div>
      <div class="kanban-cards" id="col-${stage.id}"
        ondragover="colDragOver(event,this)"
        ondrop="colDrop(event,'${stage.id}')"
        ondragleave="colDragLeave(event,this)">
      </div>
      <button class="add-card-btn" onclick="openNewLeadModal('${stage.id}')">＋ 新增</button>
    `;
    board.appendChild(col);

    const cardsEl = col.querySelector('.kanban-cards');
    if (stageleads.length === 0) {
      cardsEl.innerHTML = '<div style="height:40px"></div>';
    } else {
      stageleads.forEach(lead => {
        const card = createKanbanCard(lead);
        cardsEl.appendChild(card);
      });
    }
  });
}

function setKanbanFilter(type, val) {
  if (type === 'prio') kanbanFilterPrio = val;
  else if (type === 'src') kanbanFilterSrc = val;
  else if (type === 'stage') kanbanFilterStage = val;
  else if (type === 'user') kanbanFilterUser = val;
  renderKanban(document.getElementById('leadSearch')?.value || '');
}

function createKanbanCard(lead) {
  const card = document.createElement('div');
  card.className = 'kanban-card';
  card.dataset.id = lead.id;
  card.draggable = true;
  const src = sourcesData.find(s => s.id === lead.source_id);
  card.innerHTML = `
    <div class="kc-name">${esc(lead.name)}${convertedLeadIds.has(lead.id) ? ' <span class="badge badge-green" style="font-size:10px;padding:1px 6px">已成交</span>' : ''}</div>
    ${lead.company ? `<div class="kc-company">👤 ${esc(lead.company)}</div>` : ''}
    ${lead.tax_id ? `<div style="font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">🏷 ${esc(lead.tax_id)}</div>` : ''}
    <div class="kc-meta">
      ${src ? `<div class="kc-tag">${esc(src.name)}</div>` : ''}
    </div>
    <div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:4px">
      ${ownerSelectHtml(lead)}
      <span style="font-size:10.5px;color:var(--text3)">${fmtDate(lead.created_at)}</span>
    </div>
  `;
  const ownSel = card.querySelector('.owner-sel');
  if (ownSel) { ownSel.draggable = false; ownSel.addEventListener('dragstart', e => { e.preventDefault(); e.stopPropagation(); }); }
  card.addEventListener('dragstart', e => {
    dragSrcId = lead.id;
    dragSrcEl = card;
    setTimeout(() => card.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    dragSrcId = null;
    dragSrcEl = null;
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    if (!dragSrcEl || dragSrcEl === card) return;
    const srcStage = dragSrcEl.closest('.kanban-col')?.dataset.stageId;
    const tgtStage = card.closest('.kanban-col')?.dataset.stageId;
    if (srcStage !== tgtStage) return;
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    const ph = document.createElement('div');
    ph.className = 'drag-placeholder';
    ph.style.cssText = 'height:3px;background:var(--accent);border-radius:2px;margin:2px 0;pointer-events:none';
    const rect = card.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) card.parentElement.insertBefore(ph, card);
    else card.parentElement.insertBefore(ph, card.nextSibling);
  });
  card.addEventListener('drop', async e => {
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    if (!dragSrcEl) return;
    const srcStage = dragSrcEl.closest('.kanban-col')?.dataset.stageId;
    const tgtStage = card.closest('.kanban-col')?.dataset.stageId;
    if (!tgtStage) return;
    if (srcStage === tgtStage && dragSrcEl !== card) {
      // Same col: insert based on mouse Y position
      const rect = card.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) card.parentElement.insertBefore(dragSrcEl, card);
      else card.parentElement.insertBefore(dragSrcEl, card.nextSibling);
      await saveColOrder(tgtStage);
    } else if (srcStage !== tgtStage) {
      // Cross-col: change stage
      const lead = leadsData.find(l => l.id === dragSrcId);
      if (lead) {
        lead.stage_id = tgtStage;
        await db.from('leads').update({ stage_id: tgtStage, updated_at: new Date().toISOString() }).eq('id', dragSrcId);
        toast('已移至「' + (stagesData.find(s=>s.id===tgtStage)?.name||'') + '」', 'success');
        afterStageChanged(lead.id, tgtStage);
        dragSrcId = null; dragSrcEl = null;
        renderKanban(document.getElementById('leadSearch')?.value || '');
        return;
      }
    }
    dragSrcId = null; dragSrcEl = null;
  });
  card.addEventListener('click', e => { if (e.target.closest('select,button,a,input')) return; openLeadDrawer(lead.id); });
  return card;
}

async function saveColOrder(stageId) {
  const colEl = document.getElementById('col-' + stageId);
  if (!colEl) return;
  const cards = colEl.querySelectorAll('.kanban-card');
  const updates = [];
  cards.forEach((c, i) => {
    const lead = leadsData.find(l => l.id === c.dataset.id);
    if (lead) { lead.sort_order = i; updates.push({id: c.dataset.id, sort_order: i}); }
  });
  for (const u of updates) {
    await db.from('leads').update({ sort_order: u.sort_order }).eq('id', u.id);
  }
}

let listSelectedIds = new Set();

function buildSelectHtml(opts, currentVal, onchangeFn) {
  let s = '<select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="' + onchangeFn + '">';
  opts.forEach(o => { s += '<option value="' + o.val + '"' + (o.val === currentVal ? ' selected' : '') + '>' + o.label + '</option>'; });
  s += '</select>';
  return s;
}

function renderLeadsList(searchStr) {
  if (!isLeadsPage()) return;
  if (searchStr === undefined) searchStr = '';
  const content = document.getElementById('content');
  content.style.padding = '16px';
  content.style.overflowX = 'auto';

  // Build filter options
  const srcOpts = [{val:'all',label:'全部來源'}].concat(sourcesData.map(s => ({val:s.id, label:s.name})));
  const stageOpts = [{val:'all',label:'全部階段'}].concat(stagesData.map(s => ({val:s.id, label:s.name})));
  const userMap2 = {};
  leadsData.forEach(function(l) { if (l.user_id && l.user_name) userMap2[l.user_id] = l.user_name; });
  const userOpts = [{val:'all',label:'全部業務'}].concat(Object.entries(userMap2).map(function(e) { return {val:e[0], label:e[1]}; }));

  // Always rebuild the full content (filter bar + table)
  const sortOpts = [
    {val:'default',      label:'排序：看板順序'},
    {val:'updated_desc', label:'最近更新（新→舊）'},
    {val:'created_desc', label:'建立日（新→舊）'},
    {val:'created_asc',  label:'建立日（舊→新）'},
  ];
  const stageSelectHtml = buildSelectHtml(stageOpts, listFilterStage, "setListFilter('stage',this.value)");
  const userSelectHtml  = buildSelectHtml(userOpts,  listFilterUser,  "setListFilter('user',this.value)");
  const srcSelectHtml   = buildSelectHtml(srcOpts,   listFilterSrc,   "setListFilter('src',this.value)");
  const sortSelectHtml  = buildSelectHtml(sortOpts,  listSortMode,    "setListSort(this.value)");

  const filtered = leadsData.filter(function(l) {
    if (!showConvertedLeads && !searchStr && convertedLeadIds.has(l.id)) return false;
    if (listFilterStage !== 'all' && l.stage_id !== listFilterStage) return false;
    if (listFilterSrc   !== 'all' && (l.source_id||'') !== listFilterSrc) return false;
    if (listFilterUser  !== 'all' && (l.user_id||'')   !== listFilterUser) return false;
    if (searchStr) return leadMatches(l, searchStr);
    return true;
  });
  if (listSortMode === 'updated_desc') filtered.sort(function(a,b){ return new Date(b.updated_at||b.created_at) - new Date(a.updated_at||a.created_at); });
  else if (listSortMode === 'created_desc') filtered.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
  else if (listSortMode === 'created_asc') filtered.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });
  window._listFiltered = filtered;
  const rows = filtered.map(l => {
    const stage = stagesData.find(s => s.id === l.stage_id);
    const src = sourcesData.find(s => s.id === l.source_id);
    const checked = listSelectedIds.has(l.id) ? 'checked' : '';
    return `<tr data-id="${l.id}" class="${listSelectedIds.has(l.id)?'list-row-selected':''}">
      <td onclick="event.stopPropagation()" style="width:36px;text-align:center;padding:0 8px">
        <input type="checkbox" ${checked} onchange="toggleListSelect('${l.id}',this.checked)" style="width:15px;height:15px;cursor:pointer">
      </td>
      <td style="cursor:pointer;font-weight:500" onclick="openLeadDrawer('${l.id}')">${esc(l.name)}${convertedLeadIds.has(l.id) ? ' <span class="badge badge-green" style="font-size:10px;padding:1px 6px">已成交</span>' : ''}</td>
      <td style="font-size:12px;color:var(--text3)">${esc(l.company||'—')}</td>
      <td style="font-size:12px;font-family:var(--mono);color:var(--text3)">${esc(l.tax_id||'—')}</td>
      <td onclick="event.stopPropagation()">
        <select class="form-select" style="padding:2px 4px;height:26px;font-size:11.5px;width:auto;max-width:120px" onchange="inlineUpdateLead('${l.id}','stage_id',this.value)">
          ${stagesData.map(s=>`<option value="${s.id}"${s.id===l.stage_id?' selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </td>
      <td onclick="event.stopPropagation()">
        <select class="form-select" style="padding:2px 4px;height:26px;font-size:11.5px;width:auto;max-width:100px" onchange="inlineUpdateLead('${l.id}','source_id',this.value)">
          <option value="">—</option>
          ${sourcesData.map(s=>`<option value="${s.id}"${s.id===l.source_id?' selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </td>
      <td onclick="event.stopPropagation()">${ownerSelectHtml(l)}</td>
      <td style="font-size:12px;color:var(--text3);cursor:pointer" onclick="openSetNextContact('${l.id}','${l.next_contact_date||''}')">${l.next_contact_date?new Date(l.next_contact_date).toLocaleDateString('zh-TW'):'<span style=\'color:var(--text3);font-size:11px\'>設定</span>'}</td>
      <td style="font-size:11px;color:var(--text3)">${fmtDate(l.updated_at || l.created_at)}</td>
      <td style="font-size:11px;color:var(--text3)">${fmtDate(l.created_at)}</td>
    </tr>`;
  });

  const batchBar = listSelectedIds.size ? `
    <div id="listBatchBar" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--accent-glow);border-radius:8px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:500">已選 ${listSelectedIds.size} 筆</span>
      <select class="form-select" id="batchStageSelect" style="width:auto;height:28px;font-size:12px">
        <option value="">批次改階段...</option>
        ${stagesData.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" onclick="batchUpdateField('stage_id','batchStageSelect')">套用</button>
      <select class="form-select" id="batchSrcSelect" style="width:auto;height:28px;font-size:12px">
        <option value="">批次改來源...</option>
        ${sourcesData.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" onclick="batchUpdateField('source_id','batchSrcSelect')">套用</button>
      <button class="btn btn-secondary btn-sm" onclick="listSelectedIds.clear();renderLeadsList(document.getElementById('leadSearch')?.value||'')">取消</button>
    </div>` : '';

  const filterBar = '<div class="kanban-filters" style="margin-bottom:10px">' + stageSelectHtml + userSelectHtml + srcSelectHtml + sortSelectHtml + '</div>';
  if (filtered.length === 0) {
    content.innerHTML = filterBar + '<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">沒有符合的 Lead</div></div>';
    return;
  }
  content.innerHTML = filterBar + batchBar + '<div class="panel" style="overflow:auto"><table class="leads-list-table" style="min-width:860px"><thead><tr><th style="width:36px"><input type="checkbox" onchange="toggleSelectAll(this)" style="width:15px;height:15px;cursor:pointer"></th><th>公司名稱</th><th>聯絡人</th><th>統編</th><th>階段</th><th>來源</th><th>業務</th><th>下次聯絡</th><th>最後更新</th><th>建立時間</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}

function setListFilter(type, val) {
  if (type === 'src') listFilterSrc = val;
  else if (type === 'stage') listFilterStage = val;
  else if (type === 'user') listFilterUser = val;
  // Clear the filter bar so it re-renders with correct selections
  const bar = document.getElementById('listFilterBar');
  if (bar) bar.remove();
  const tbl = document.getElementById('listTableContainer');
  if (tbl) tbl.remove();
  renderLeadsList(document.getElementById('leadSearch')?.value || '');
}

function setListSort(val) {
  listSortMode = val;
  renderLeadsList(document.getElementById('leadSearch')?.value || '');
}

function toggleListSelect(id, checked) {
  if (checked) listSelectedIds.add(id); else listSelectedIds.delete(id);
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}
function toggleSelectAll(cb) {
  const filtered = window._listFiltered || [];
  if (cb.checked) filtered.forEach(l => listSelectedIds.add(l.id));
  else listSelectedIds.clear();
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}
async function inlineUpdateLead(leadId, field, value) {
  const update = { updated_at: new Date().toISOString() };
  update[field] = value || null;
  await db.from('leads').update(update).eq('id', leadId);
  const lead = leadsData.find(l => l.id === leadId);
  if (lead) lead[field] = value || null;
  if (field === 'stage_id' && value) afterStageChanged(leadId, value);
}
async function batchUpdateField(field, selectId) {
  const val = document.getElementById(selectId)?.value;
  if (!val || !listSelectedIds.size) { toast('請先選擇選項', 'error'); return; }
  for (const id of listSelectedIds) {
    await db.from('leads').update({ [field]: val, updated_at: new Date().toISOString() }).eq('id', id);
    const l = leadsData.find(l=>l.id===id); if (l) l[field] = val;
  }
  toast('已批次更新 ' + listSelectedIds.size + ' 筆', 'success');
  listSelectedIds.clear();
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}


function colDragOver(e, el) {
  e.preventDefault();
  el.closest('.kanban-col').classList.add('drag-over-col');
}
function colDragLeave(e, el) {
  if (!el.contains(e.relatedTarget)) el.closest('.kanban-col').classList.remove('drag-over-col');
}
async function colDrop(e, stageId) {
  e.preventDefault();
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over-col'));
  if (!dragSrcId) return;
  const lead = leadsData.find(l => l.id == dragSrcId);
  if (!lead) return;
  const oldStage = stagesData.find(s => s.id === lead.stage_id);
  const newStage = stagesData.find(s => s.id === stageId);
  if (lead.stage_id === stageId) return;

  // Auto-convert check
  if (newStage?.name === '簽約進件' && !convertedLeadIds.has(lead.id)) {
    await updateLeadStage(lead, stageId);
    navigate('leads');
    openConvertModal(lead.id);
  } else {
    await updateLeadStage(lead, stageId);
    navigate('leads');
  }
}

async function updateLeadStage(lead, stageId) {
  await db.from('leads').update({ stage_id: stageId, updated_at: new Date().toISOString() }).eq('id', lead.id);
  lead.stage_id = stageId;
  toast(`已移至「${stagesData.find(s=>s.id===stageId)?.name}」`, 'success');
  if (getStageName(stageId) === '結案') setTimeout(function () { askLostReason(lead.id); }, 300);
}

async function convertToAccount(lead) {
  // 只負責建立 Account（不刪、不隱藏 Lead）；已存在就直接回傳既有的
  const { data: existing } = await db.from('accounts').select('*').eq('lead_id', lead.id).maybeSingle();
  if (existing) return existing;
  const { data: acc, error } = await db.from('accounts').insert({
    name: lead.name, company: lead.company || null, lead_id: lead.id,
    user_id: lead.user_id || currentUser.id,
    user_name: lead.user_name || currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '',
    created_at: new Date().toISOString()
  }).select().single();
  if (error) { toast('轉換失敗：' + error.message, 'error'); return null; }
  convertedLeadIds.add(lead.id);
  return acc;
}

let _pendingAccountId = null;

function dfPreset(kind) {

  const t = dfTotals();
  if (!t.items) { toast('先填成交明細的金額', 'error'); return; }
  const signed = document.getElementById('dfSigned')?.value || nowDateStr();
  const later = addDaysStr(signed, 30);
  const row = function (label, amount, due, alloc) { return { label: label, amount: amount, due_date: due, alloc: alloc || 'prorata', paid_date: null }; };
  if (kind === 'once') _df.inst = [row('全額', t.items, signed)];
  else if (kind === 'half') { const a = Math.round(t.items / 2); _df.inst = [row('簽約款', a, signed), row('尾款', t.items - a, later)]; }
  else if (kind === 'split') {
    if (!t.bt.custom) { toast('明細中沒有「客製案件」項目', 'error'); return; }
    const other = t.items - t.bt.custom, c1 = Math.round(t.bt.custom / 2);

  }
  renderDfInst();
}

  }
  const el = document.getElementById('dfSum'); if (!el) return;

    + (Math.abs(diff) > 0.5

// 只有一期且未收款時，金額自動等於明細合計（最常見的一次付清不用另外填）
function dfSyncSingleInst() {
  if (_df.inst.length !== 1 || _df.inst[0].paid_date) return;
  _df.inst[0].amount = dfTotals().items;
  renderDfInst();
}
function dfAddItem() { _df.items.push({ name: '', amount: '', bonus_type: '' }); renderDfItems(); }
function dfAddInst() {
  const t = dfTotals();
  _df.inst.push({ label: '第 ' + (_df.inst.length + 1) + ' 期', amount: Math.max(0, t.items - t.inst) || '', due_date: '', alloc: 'prorata', paid_date: null });
  renderDfInst();
}
function dfFixInst() {
  const t = dfTotals();
  const open = _df.inst.filter(function (p) { return !p.paid_date; });
  if (!open.length) { dfAddInst(); return; }
  const last = open[open.length - 1];
  last.amount = Math.max(0, (Number(last.amount) || 0) + (t.items - t.inst));
  renderDfInst();
}
function onDealCatChange() {
  const isRen = document.getElementById('dfCat').value === '續約';
  _df.items.forEach(function (it) { if (it.src === 'sub' && (it.bonus_type === 'standard' || it.bonus_type === 'renewal')) it.bonus_type = isRen ? 'renewal' : 'standard'; });
  renderDfItems();
}
function applyQuoteToDeal(noteId) {
  _df.quoteNoteId = noteId || null;
  renderDfQuotes();
  if (!noteId) return;
  const rec = _df.quotes.find(function (r) { return r.noteId === noteId; });
  if (!rec) return;
  const S = rec.snapshot || {}, sm = rec.summary || {};
  if (S.quote && S.quote.kind === 'renewal') document.getElementById('dfCat').value = '續約';
  _df.items = itemsFromQuote(rec, document.getElementById('dfCat').value === '續約');
  const total = _df.items.reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0);
  if (!_df.inst.some(function (p) { return p.paid_date; })) {
    _df.inst = [{ label: '全額', amount: total, due_date: document.getElementById('dfSigned').value || nowDateStr(), alloc: 'prorata', paid_date: null }];
  } else { toast('已有收款紀錄，付款排程未變動，請手動調整', 'error'); }
  const plan = dealTypesData.find(function (d) { return d.name === (sm.planName || (S.plan && S.plan.name)); });
  if (plan) { document.getElementById('dfPlan').value = plan.id; applyDealTemplate(false); }
  if (S.plan && S.plan.start && !document.getElementById('dfLive').value) document.getElementById('dfLive').value = S.plan.start;
  if (S.plan && S.plan.end && !document.getElementById('dfRenew').value) document.getElementById('dfRenew').value = S.plan.end;
  renderDfItems(); renderDfInst();
  const unset = _df.items.filter(function (it) { return !it.bonus_type; }).length;
  if (unset) toast('有 ' + unset + ' 項明細需要選擇獎金類別（標準／客製）', 'error');
}

function applyDealTemplate(force) {

function readDealForm() {
  const cat = document.getElementById('dfCat').value || '主約';
  const planId = document.getElementById('dfPlan').value;
  const plan = dealTypesData.find(d => d.id === planId);
  const salesId = document.getElementById('dfSales').value;
  const signed = document.getElementById('dfSigned').value;
  if (_df.isNew && !_df.quoteNoteId) { toast('成交要選一張報價單', 'error'); return null; }
  if (!salesId) { toast('請選擇業績歸屬業務', 'error'); return null; }
  if (!signed) { toast('請填寫簽約日', 'error'); return null; }
  const items = [];
  for (let i = 0; i < _df.items.length; i++) {
    const it = _df.items[i];
    const nm = String(it.name || '').trim(), amt = numLoose(it.amount);
    if (!nm && amt == null) continue;
    if (!nm) { toast('第 ' + (i + 1) + ' 項明細缺少名稱', 'error'); return null; }
    if (amt == null || amt < 0) { toast('「' + nm + '」請填金額（贈送填 0）', 'error'); return null; }
    if (!it.bonus_type) { toast('「' + nm + '」請選擇獎金類別', 'error'); return null; }
    const o = { name: nm, amount: amt, bonus_type: it.bonus_type }; if (it.src) o.src = it.src;
    items.push(o);
  }
  if (!items.length) { toast('請至少填一項成交明細', 'error'); return null; }
  const total = items.reduce(function (s, it) { return s + it.amount; }, 0);
  const inst = [];
  for (let i = 0; i < _df.inst.length; i++) {
    const p = Object.assign({}, _df.inst[i]);
    const amt = numLoose(p.amount);
    if (amt == null && !p.paid_date) continue;
    p.amount = amt || 0;
    p.label = String(p.label || '').trim() || ('第 ' + (inst.length + 1) + ' 期');
    p.due_date = p.due_date || signed;
    p.alloc = p.alloc || 'prorata';
    inst.push(p);
  }
  if (!inst.length) inst.push({ label: '全額', amount: total, due_date: signed, alloc: 'prorata', paid_date: null });
  const instTotal = inst.reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
  if (Math.abs(instTotal - total) > 0.5) { toast('付款合計 $' + fmtNum(instTotal) + ' ≠ 明細合計 $' + fmtNum(total) + '，請調整（可按「補到最後一期」）', 'error'); return null; }
  const salesSel = document.getElementById('dfSales');
  const remindRaw = document.getElementById('dfRemind').value;
  return {
    name: document.getElementById('dfName').value.trim() || (plan ? plan.name : '') || items[0].name || cat,
    deal_category: cat,
    plan_content: document.getElementById('dfContent').value.trim() || null,
    amount: total,
    monthly_fee: (function () { const v = numLoose(document.getElementById('dfMonthly')?.value); if (v != null) return v; return ctMonthly({ plan_content: document.getElementById('dfContent').value }) || null; })(),
    items: items,
    installments: inst,
    quote_note_id: _df.quoteNoteId || null,
    sales_user_id: salesId,
    sales_user_name: salesSel.options[salesSel.selectedIndex]?.text || '',
    signed_date: signed,
    start_date: document.getElementById('dfLive').value || null,
    end_date: document.getElementById('dfRenew').value || null,
    remind_days: remindRaw === '' ? 30 : (parseInt(remindRaw) || 0),
    note: document.getElementById('dfNote').value.trim() || null
  };
}

// 線索 → 成交客戶
async function openConvertModal(leadId, preNoteId) {
  if (!preNoteId) { startDealFromQuote(leadId); return; }
  const { data: lead } = await db.from('leads').select('*').eq('id', leadId).maybeSingle();
  if (!lead) { toast('找不到此 Lead', 'error'); return; }
  const { data: existing } = await db.from('accounts').select('id').eq('lead_id', leadId).maybeSingle();
  if (existing) {
    if (preNoteId) { openDealModal(existing.id, null, { leadId: leadId, quoteNoteId: preNoteId }); return; }
    toast('此 Lead 已是成交客戶，直接開啟客戶頁', 'success'); goToAccount(existing.id); return;
  }
  if (!dealTypesData.length || !usersData.length) await loadGlobalData();
  _lastDealTpl = '';
  const quotes = await loadQuoteNotesForLead(leadId);
  preNoteId = preNoteId || pickDefaultQuote(quotes);
  initDealForm(null, quotes, preNoteId);
  const def = { plan_id: lead.deal_type_id || '', sales_user_id: lead.user_id || currentUser.id, deal_category: '主約' };
  openModal('🤝 轉為成交客戶：' + (lead.name || ''), ''
    + '<div style="font-size:12px;color:var(--text3);margin-bottom:12px">線索與開發紀錄都會保留，轉換後直接進客戶頁。</div>'
    + buildDealFormHtml(null, def), [
    { label: '取消', cls: 'btn-secondary', action: closeModal },
    { label: '✅ 轉為成交客戶', cls: 'btn-primary', action: function () { doConvertLead(lead, true); } }
  ]);
  document.getElementById('modalBox').style.maxWidth = '820px';
  afterDealFormOpen(preNoteId);
}

async function doConvertLead(lead, withDeal) {
  if (_dealBusy) return;
  let payload = null;
  if (withDeal) { payload = readDealForm(); if (!payload) return; }
  _dealBusy = true;
  try {
    const acc = await convertToAccount(lead);
    if (!acc) return;
    if (payload) {
      payload.account_id = acc.id;
      payload.user_id = currentUser.id;
      payload.created_at = new Date().toISOString();
      const { error } = await db.from('contracts').insert(payload);
      if (error) { toast('客戶已建立，但成交紀錄儲存失敗：' + error.message, 'error'); }
    }
    // 線索同步移到「簽約進件」（若有此階段），線索本身保留
    const wonStage = stagesData.find(s => s.name === '簽約進件');
    if (wonStage && lead.stage_id !== wonStage.id) {
      await db.from('leads').update({ stage_id: wonStage.id, updated_at: new Date().toISOString() }).eq('id', lead.id);
      const ld = leadsData.find(l => l.id === lead.id); if (ld) ld.stage_id = wonStage.id;
    }
    closeModal();
    toast('✅ 已轉為成交客戶：' + (lead.name || ''), 'success');
    goToAccount(acc.id);
  } finally { _dealBusy = false; }
}

async function goToAccount(accId) {
  let acc = accountsData.find(a => a.id === accId);
  if (!acc) { const r = await db.from('accounts').select('id,lead_id').eq('id', accId).maybeSingle(); acc = r.data; }
  if (acc && acc.lead_id) { openCompany(acc.lead_id); return; }
  _pendingAccountId = accId;
  navigate('accounts');
}
async function openAccountByLead(leadId) {
  const { data: acc } = await db.from('accounts').select('id').eq('lead_id', leadId).maybeSingle();
  if (!acc) { toast('找不到對應客戶', 'error'); return; }
  goToAccount(acc.id);
}

function parseContactsText(text) {
  const rows = [];
  text.split('\n').forEach(line => {
    const sep = line.includes('\t') ? '\t' : ',';
    const cols = line.split(sep).map(s => s.trim());
    if (!cols[0]) return;
    rows.push({ name: cols[0], role: cols[1]||'', email: cols[2]||'', phone: cols[3]||'', line_id: cols[4]||'' });
  });
  return rows;
}

function previewNewLeadContacts() {
  const text = document.getElementById('lContactsText')?.value || '';
  const rows = parseContactsText(text);
  const el = document.getElementById('lContactsPreview');
  if (!el) return;
  if (!rows.length) { el.innerHTML = ''; return; }
  el.innerHTML = '已解析 ' + rows.length + ' 位：' + rows.map(r => '<strong>' + esc(r.name) + '</strong>' + (r.email ? ' (' + esc(r.email) + ')' : '')).join('、');
}

async function saveLead() {
  const name = document.getElementById('lName').value.trim();
  if (!name) { toast('請填寫名稱', 'error'); return; }
  const taxId = document.getElementById('lTaxId')?.value.trim() || null;
  // 統編唯一性驗證（只在有填寫時才檢查）
  if (taxId) {
    if (taxId.length !== 8) { toast('統一編號須為 8 碼數字', 'error'); return; }
    const { data: dup } = await db.from('leads').select('id,name').eq('tax_id', taxId).limit(1);
    if (dup && dup.length > 0) { toast(`統編 ${taxId} 已存在於「${dup[0].name}」`, 'error'); return; }
  }
  const selectedNeedTypes = getSelectedNeedTypes('lNeedTypes');
  let userId = currentUser.id;
  let userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '';
  const userSelect = document.getElementById('lUserSelect');
  if (userSelect && userSelect.value) {
    const [selId, selName] = userSelect.value.split('|');
    userId = selId; userName = selName;
  } else {
    const nameInput = document.getElementById('lUserName');
    if (nameInput) userName = nameInput.value.trim() || userName;
  }
  const payload = {
    name,
    stage_id: document.getElementById('lStage').value || stagesData[0]?.id,
    source_id: document.getElementById('lSource').value || null,
    tax_id: taxId || null,
    need_types: selectedNeedTypes.length ? selectedNeedTypes : null,
    product_type: document.getElementById('lProductType')?.value.trim() || null,
    deal_type_id: document.getElementById('lDealType')?.value || null,
    user_id: userId, user_name: userName, created_at: new Date().toISOString()
  };
  const note = document.getElementById('lNote').value.trim();
  const { data: lead, error } = await db.from('leads').insert(payload).select().single();
  if (error) {
    toast('建立失敗：' + error.message, 'error');
    console.error('saveLead error:', error);
    return;
  }
  if (note) await db.from('notes').insert({ content: note, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
  const contactsText = document.getElementById('lContactsText')?.value || '';
  const contacts = parseContactsText(contactsText);
  for (const c of contacts) {
    await db.from('contacts').insert({ name: c.name, role: c.role, email: c.email, phone: c.phone, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
  }
  closeModal();
  toast('Lead 建立成功' + (contacts.length ? '，已新增 ' + contacts.length + ' 位聯絡人' : ''), 'success');
  if (userId && userId !== currentUser.id) crmApi('POST', '/api/leads/' + lead.id + '/announce').catch(function () {});
  navigate('leads');
}

async function refreshCompany() {
  const leadId = currentLeadId;
  if (!leadId || currentPage !== 'company') return;
  if (!usersData.length || !stagesData.length) await loadGlobalData();
  const [ldR, accR] = await Promise.all([
    db.from('leads').select('*').eq('id', leadId).maybeSingle(),
    db.from('accounts').select('*').eq('lead_id', leadId).maybeSingle()
  ]);
  if (currentPage !== 'company' || currentLeadId !== leadId) return;
  const lead = ldR.data;
  if (!lead) { toast('找不到此公司，可能已被刪除', 'error'); navigate('leads'); return; }
  const acc = accR.data || null;
  let contracts = [];
  if (acc) {
    convertedLeadIds.add(leadId);
    const i = accountsData.findIndex(a => a.id === acc.id);
    if (i >= 0) accountsData[i] = acc; else accountsData.push(acc);
    const r = await db.from('contracts').select('*').eq('account_id', acc.id);
    contracts = (r.data || []).sort(function (a, b) { return dealDate(b).localeCompare(dealDate(a)); });
    await loadDealFiles(contracts.map(function (c) { return c.id; }));
  }
  const li = leadsData.findIndex(l => l.id === leadId);
  if (li >= 0) leadsData[li] = Object.assign(leadsData[li], lead);
  const [qcR, ccR] = await Promise.all([
    db.from('notes').select('id').eq('lead_id', leadId).like('content', QUOTE_NOTE_PREFIX + '%'),
    db.from('contacts').select('id').eq('lead_id', leadId)
  ]);
  window._cp = { lead: lead, acc: acc, contracts: contracts };
  if (currentPage !== 'company' || currentLeadId !== leadId) return;
  if (_cpTab === 'deals' && !acc) _cpTab = 'timeline';
  const tabs = [['timeline', '時間軸', ''], acc ? ['deals', '合約', contracts.length] : null, ['quotes', '報價', (qcR.data || []).length], ['contacts', '聯絡人', (ccR.data || []).length], ['info', '基本資料', '']].filter(Boolean);

async function renderCompanyTimeline(leadId) {
  const cp = window._cp || {};

  const [aR, nR, cR, anR] = await Promise.all([
    db.from('activities').select('*').eq('lead_id', leadId).order('created_at', { ascending: false }),
    db.from('notes').select('*').eq('lead_id', leadId),
    db.from('contacts').select('id,name').eq('lead_id', leadId),
    acc ? db.from('notes').select('*').eq('account_id', acc.id) : Promise.resolve({ data: [] })
  ]);
  if (currentPage !== 'company' || currentLeadId !== leadId) return;
  const el = document.getElementById('drawerPanel-activities'); if (!el) return;
  const contacts = cR.data || [];
  const who = function (uid) { const u = usersData.find(x => x.id === uid); return u ? (u.full_name || u.email || '') : ''; };
  const at = function (d) { return d && String(d).length <= 10 ? d + 'T12:00:00' : d; };
  const items = [];
  (aR.data || []).forEach(function (a) {
    const t = ACTIVITY_TYPES[a.type] || ACTIVITY_TYPES['note'];
    const ct = contacts.find(c => c.id === a.contact_id);
    items.push({ k: 'act', at: a.created_at, ico: t.icon, color: t.color, title: t.label + (ct ? ' · ' + esc(ct.name) : ''), text: a.content || '', who: who(a.user_id),
      acts: '<button class="btn btn-ghost btn-sm btn-icon" onclick="openEditActivity(\'' + a.id + '\',\'' + leadId + '\')">✏️</button><button class="btn btn-ghost btn-sm btn-icon" onclick="deleteActivity(\'' + a.id + '\',\'' + leadId + '\')">🗑</button>' });
  });
  const seen = {};
  (nR.data || []).concat(anR.data || []).forEach(function (n) {
    if (seen[n.id]) return; seen[n.id] = 1;
    const q = parseQuoteNote(n);
    if (q) {
      const sm = q.summary || {};

function leadUrl(leadId) {

// ── 瀏覽器「上一頁／下一頁」──
// 每換一頁就推一筆紀錄：#/today、#/leads…；公司頁是 #lead=<id>
const PAGE_KEYS = ['today', 'dashboard', 'leads', 'leadlist', 'bonus', 'quotes', 'accounts', 'onboard', 'performance', 'coldcall', 'decks', 'contacts', 'settings', 'feed'];
let _histRouting = false;
function histPush(hash, opt) {
  if (_histRouting) return;
  try {
    const st = history.state && typeof history.state.sf === 'number' ? history.state.sf : 0;
    if (opt && opt.replace) history.replaceState({ sf: st }, '', hash);
    else if (location.hash !== hash) history.pushState({ sf: st + 1 }, '', hash);
  } catch (e) {}
}
function goBack() {
  if (history.state && history.state.sf > 0) history.back();
  else navigate(_cpBack || 'leads', { replace: true });
}
window.addEventListener('popstate', function () {
  if (!currentUser) return;
  if (document.getElementById('modalOverlay')?.style.display === 'flex' || document.getElementById('modalOverlay')?.style.display === 'block') closeModal();
  const m = location.hash.match(/^#lead=([\w-]+)/);
  const p = location.hash.match(/^#\/([a-z]+)/);
  _histRouting = true;
  try {
    if (m) { if (!(currentPage === 'company' && currentLeadId === m[1])) openCompany(m[1]); }
    else navigate(p && PAGE_KEYS.includes(p[1]) ? p[1] : 'today');
  } finally { _histRouting = false; }
});

    ta.remove();
  }
}

function containerHasTypedContent(rootEl) {
  if (!rootEl) return false;
  const els = rootEl.querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=time]):not([type=color]), textarea');
  for (const el of els) {
    const v = (el.value || '').trim();

}

function parseBatchContacts() {
  const text = document.getElementById('batchContactsText')?.value || '';
  const rows = [];
  text.split('\n').forEach(line => {
    const parts = line.split('\t').map(s => s.trim());
    const cols = parts.length >= 2 ? parts : line.split(',').map(s => s.trim());
    const name = cols[0];
    if (!name) return;
    rows.push({ name, role: cols[1]||'', email: cols[2]||'', phone: cols[3]||'' });
  });
  return rows;
}

function previewBatchContacts() {
  const rows = parseBatchContacts();
  const el = document.getElementById('batchPreview');
  if (!el) return;
  if (!rows.length) { el.innerHTML = ''; return; }
  let html2 = '<div style="margin-bottom:4px;font-weight:500">預覽（共 ' + rows.length + ' 筆）：</div>';
  rows.forEach(r => {
    html2 += '<div style="padding:3px 0;border-bottom:1px solid var(--border)">';
    html2 += '<span style="font-weight:500">' + esc(r.name) + '</span>';
    if (r.role)  html2 += ' · ' + esc(r.role);
    if (r.email) html2 += ' · ' + esc(r.email);
    if (r.phone) html2 += ' · ' + esc(r.phone);
    html2 += '</div>';
  });
  el.innerHTML = html2;
}

// ── Activity time helpers ──
function _pad2(n){ return String(n).padStart(2,'0'); }
function nowDateStr(){ const d=new Date(); return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function nowTimeStr(){ const d=new Date(); return _pad2(d.getHours())+':'+_pad2(d.getMinutes()); }
function isoToLocalDate(iso){ if(!iso) return nowDateStr(); const d=new Date(iso); if(isNaN(d.getTime())) return nowDateStr(); return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function isoToLocalTime(iso){ if(!iso) return nowTimeStr(); const d=new Date(iso); if(isNaN(d.getTime())) return nowTimeStr(); return _pad2(d.getHours())+':'+_pad2(d.getMinutes()); }
// Combine local date + time inputs into a correct UTC ISO timestamp
function localToISO(dateStr, timeStr){
  if(!dateStr) return new Date().toISOString();
  const t = timeStr || '00:00';
  const dt = new Date(dateStr + 'T' + t + ':00'); // parsed as local time
  if(isNaN(dt.getTime())) return new Date().toISOString();
  return dt.toISOString();
}

// ── Voice-to-text (mobile-friendly) ──
let _recognition = null;
function startVoiceInput(targetId, btnEl) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // Already recording → stop
  if (_recognition) { try { _recognition.stop(); } catch(e){} return; }
  if (!SR) {
    toast('此瀏覽器不支援語音按鈕，請改用手機鍵盤上的麥克風圖示', 'error');
    return;
  }
  const ta = document.getElementById(targetId);
  if (!ta) return;
  const rec = new SR();
  rec.lang = 'zh-TW';
  rec.continuous = true;
  rec.interimResults = true;
  _recognition = rec;
  const baseText = ta.value ? (ta.value.endsWith('\n') ? ta.value : ta.value + '\n') : '';
  if (btnEl) { btnEl.textContent = '⏹ 停止錄音'; btnEl.classList.remove('btn-secondary'); btnEl.classList.add('btn-danger'); }
  rec.onresult = (e) => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    ta.value = baseText + txt;
  };
  rec.onerror = (e) => {
    if (e.error !== 'aborted' && e.error !== 'no-speech') toast('語音辨識錯誤：' + (e.error || ''), 'error');
  };
  rec.onend = () => {
    _recognition = null;
    if (btnEl) { btnEl.textContent = '🎤 語音輸入'; btnEl.classList.remove('btn-danger'); btnEl.classList.add('btn-secondary'); }
  };
  try { rec.start(); } catch(e) { toast('無法啟動語音輸入', 'error'); _recognition = null; }
}

function isQuoteNote(note) {

function requestQuoteSnapshot() {

    if (!quoteFrameReady || !quoteFrameWindow()) { reject(new Error('報價工具尚未載入完成')); return; }
    const id = 'qreq-' + Date.now() + '-' + Math.random().toString(36).slice(2);

}

    if (exact) quoteSelectLead(exact.id);

      +     '<div style="font-size:11px;color:var(--text3);margin-top:2px">' + esc(sm.date || fmtDate(r.savedAt)) + ' · ' + esc(sm.planName || '—') + '</div>'
      +     '<div style="font-family:var(--mono);font-size:11.5px;color:var(--green);margin-top:3px">' + quoteMoney(sm.grand, sm.currency || 'TWD') + '</div>'

async function saveCurrentQuote(options={}) {
  if (!quoteSelectedLeadId) { toast('目前是手動客戶。若要存進 CRM，請先從上方搜尋並綁定既有 Lead。', 'error'); return false; }
  try {
    const msg = await requestQuoteSnapshot();
    const record = { version:1, kind:'orderup_quote', summary:msg.summary, snapshot:msg.snapshot };
    const existingQuotes = await loadQuoteNotesForLead(quoteSelectedLeadId);
    const latest = existingQuotes[0];
    if (latest?.snapshot && JSON.stringify(latest.snapshot) === JSON.stringify(msg.snapshot)) {
      if (!options.silent) toast('這份報價沒有變更，CRM 已有最新版本', 'success');
      return true;
    }
    const payload = {
      content: QUOTE_NOTE_PREFIX + JSON.stringify(record),
      lead_id: quoteSelectedLeadId,
      user_id: currentUser.id,
      created_at: new Date().toISOString()
    };
    try {
      const { data: acc } = await db.from('accounts').select('id').eq('lead_id', quoteSelectedLeadId).maybeSingle();
      if (acc?.id) payload.account_id = acc.id;
    } catch(e) {}
    const { error } = await db.from('notes').insert(payload);
    if (error) throw error;
    await refreshQuoteHistoryCount(quoteSelectedLeadId);
    if (!options.silent) toast('✅ 報價已儲存到客戶紀錄', 'success');
    return true;
  } catch(e) {
    toast('報價儲存失敗：' + (e.message || e), 'error');
    return false;
  }
}

window.addEventListener('message', async (e) => {
  const frame = document.getElementById('quoteFrame');
  if (!frame || e.source !== frame.contentWindow) return;
  const d = e.data || {};
  if (d.type === 'orderup-quote-ready') {
    quoteFrameReady = true;
    if (quoteSelectedLeadId) {
      const client = await getLeadClientPayload(quoteSelectedLeadId);
      if (client) postToQuoteFrame({ type:'orderup-quote-set-client', client });
      if (!pendingQuoteSnapshot) { const vendor = await quoteVendorFor(quoteSelectedLeadId); if (vendor) postToQuoteFrame({ type:'orderup-quote-set-vendor', vendor }); }
    } else if (quoteManualClientName) {
      postToQuoteFrame({ type:'orderup-quote-set-client', client:{name:quoteManualClientName, taxId:'', contact:'', phone:''} });
    }
    if (pendingQuoteSnapshot) {
      postToQuoteFrame({ type:'orderup-quote-load-snapshot', snapshot:pendingQuoteSnapshot });
      pendingQuoteSnapshot = null;
    }
  } else if (d.type === 'orderup-quote-snapshot') {
    const resolver = quoteSnapshotRequests.get(d.requestId);
    if (resolver) { quoteSnapshotRequests.delete(d.requestId); resolver(d); }
  } else if (d.type === 'orderup-quote-print-request') {
    if (!quoteSelectedLeadId) {
      toast('手動客戶模式：直接開啟列印 / PDF，本次不寫入 CRM', 'success');

  }
});

function renderAccountsList(accs, keepSearch) {
  const content = document.getElementById('content');
  const mk = function (a) {
    const qs = accOpenQuotes(a);
    return { a: a, f: acctFin(a.contracts || []), off: a.status === 'terminated', oi: onbIdx(a), qn: qs.length, qsum: qs.reduce(function (s, r) { return s + (Number((r.summary || {}).grand) || 0); }, 0) };
  };
  const rows = accs.map(mk);
  const all = accountsData.map(mk);
  const act = all.filter(function (r) { return !r.off; });
  const sum = function (list, k) { return list.reduce(function (s, r) { return s + r.f[k]; }, 0); };
  const isOver = function (r) { return r.f.nextPay && daysUntil(r.f.nextPay.due_date) < 0; };
  const F = {
    active: function (r) { return !r.off; },
    pay: function (r) { return r.f.unpaid > 0; },
    renew: function (r) { return !r.off && r.f.renewDays != null && r.f.renewDays <= 90; },
    onb: function (r) { return !r.off && r.oi < ONB_STAGES.length - 1; },
    quote: function (r) { return r.qn > 0; },
    all: function () { return true; }
  };
  if (!F[_accFilter]) _accFilter = 'active';
  let shown = rows.filter(F[_accFilter]);
  if (_accFilter === 'renew') shown.sort(function (x, y) { return x.f.renewDays - y.f.renewDays; });
  else if (_accFilter === 'pay') shown.sort(function (x, y) { return (isOver(y) - isOver(x)) || String((x.f.nextPay || {}).due_date || '').localeCompare(String((y.f.nextPay || {}).due_date || '')); });
  else if (_accFilter === 'onb') shown.sort(function (x, y) { return (x.oi - y.oi) || ((onbDays(y.a) || 0) - (onbDays(x.a) || 0)); });
  else shown.sort(function (x, y) { return (x.off - y.off) || (y.f.monthly - x.f.monthly) || (y.f.total - x.f.total); });
  const kpi = function (label, val, sub, color) { return '<div class="fin-stat"><div class="form-label">' + label + '</div><div class="fin-val"' + (color ? ' style="color:' + color + '"' : '') + '>' + val + '</div>' + (sub ? '<div class="fin-sub">' + sub + '</div>' : '') + '</div>'; };

  const overdue = all.filter(isOver).length;

  let html = '<div class="fin-grid">'
    + kpi('合作中', act.length + ' 家', '導入中 ' + act.filter(F.onb).length + ' 家')

    + kpi('已收', '$' + fmtNum(sum(all, 'paid')), '合約總額 $' + fmtNum(sum(all, 'total')))
    + kpi('未收', '$' + fmtNum(sum(all, 'unpaid')), overdue ? overdue + ' 家逾期' : '無逾期', overdue ? 'var(--red)' : '')
    + '</div>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">'
    +   chip('active', '合作中') + chip('pay', '待收款') + chip('renew', '續約 90 天內') + chip('onb', '導入中') + chip('quote', '報價待回') + chip('all', '全部')
    +   '<input class="form-input" id="accSearch" placeholder="🔍 搜尋客戶" style="width:180px;margin-left:auto;padding:6px 10px" oninput="filterAccounts()" value="' + esc(q) + '">'
    + '</div>';
  if (!shown.length) {
    content.innerHTML = html + '<div class="empty-state" style="padding:40px"><div class="empty-icon">🏢</div><div class="empty-text">沒有符合的客戶</div></div>';

  };
  html += '<div class="panel acc-table-wrap"><table class="data-table"><thead><tr>'

      + '<td onclick="event.stopPropagation()">' + onbCellHtml(a) + '</td>'

      + '<td style="font-size:12px">' + (f.count ? finRenewHtml(f) : '<span style="color:var(--text3)">—</span>') + renewBtnHtml(a, f) + '</td>'
      + '<td>' + quoteCell(r) + '</td>'

  });
  html += '</tbody></table></div><div class="acc-cards">';
  shown.forEach(function (r) {
    const a = r.a, f = r.f;
    html += '<div class="acc-card" onclick="openAccountDetail(\'' + a.id + '\')"' + (r.off ? ' style="opacity:0.55"' : '') + '>'

  openModal('🔀 合併重複客戶', h, [

function swapMergeRow(i) {

function doMergeRow(i) { const p = _mergeSug[i]; if (p) confirmMergeAccounts(p[0].id, p[1].id); }
function confirmMergeAccounts(keepId, dupId) {

async function searchMergeLead(leadId) {

  const { data } = await db.from('leads').select('id,name,tax_id,user_name,created_at').or('name.ilike.' + p + ',company.ilike.' + p + ',tax_id.ilike.' + p).neq('id', leadId).limit(10);

function confirmMergeLead(keepId, i) {

    closeModal, '確定轉回', '取消'
  );
}

function renderContractList(contracts, accId) {
  if (!contracts.length) return '<div class="empty-state" style="padding:16px"><div class="empty-text">尚無成交紀錄</div></div>';
  return contracts.map(function (c) {
    const sales = dealSalesName(c);
    const items = dealItems(c), inst = dealInstallments(c);
    const paid = inst.reduce(function (s, p) { return s + instPaidAmt(p); }, 0);
    const total = c.amount || items.reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0);
    let meta = '<span class="badge badge-green" style="font-family:var(--mono)">$ ' + fmtNum(total) + '</span>';
    const pct = total > 0 ? Math.min(100, Math.round(paid / total * 100)) : 0;
    const nextP = inst.find(function (p) { return !p.paid_date; });
    meta += '<span style="display:inline-flex;align-items:center;gap:6px"><span class="df-bar"><div style="width:' + pct + '%"></div></span>'
      + '<span style="font-size:11px;color:' + (pct >= 100 ? 'var(--green)' : 'var(--text3)') + '">' + (pct >= 100 ? '已收齊' : '已收 $' + fmtNum(paid)) + '</span></span>';
    if (nextP) { const dd = daysUntil(nextP.due_date); meta += '<span style="font-size:11px;color:' + (dd != null && dd < 0 ? 'var(--red)' : 'var(--text3)') + '">下期 $' + fmtNum(nextP.amount) + '・' + esc(nextP.due_date || '') + (dd != null && dd < 0 ? '（逾期）' : '') + '</span>'; }
    const mf = ctMonthly(c);
    if (mf) meta += '<span class="badge badge-blue" style="font-family:var(--mono)">月費 $' + fmtNum(mf) + '</span>';
    if (sales) meta += '<span style="font-size:11px;color:var(--text3)">👤 ' + esc(sales) + '</span>';
    meta += dealFilesBadge(c.id);
    let dates = '';
    const sd = dealDate(c);
    if (sd) dates += '<span>簽約 ' + sd + '</span>';
    const ti = ctTermInfo(c);
    if (c.start_date || c.end_date) dates += '<span>合約 ' + esc(c.start_date || '?') + ' ~ ' + (c.end_date ? renewalBadgeHtml(c) : '?') + (ti ? '・' + ti.label : '') + '</span>';
    let itemsHtml = '<div class="form-label">成交明細</div><table class="data-table" style="margin-bottom:10px"><tbody>';
    items.forEach(function (it) {
      itemsHtml += '<tr><td style="font-size:12.5px">' + esc(it.name || '') + '</td><td>' + bonusTypeBadge(it.bonus_type) + '</td><td style="text-align:right;font-family:var(--mono);font-size:12.5px">' + (Number(it.amount) === 0 ? '贈送' : fmtNum(it.amount)) + '</td></tr>';
    });
    itemsHtml += '</tbody></table>';
    let instHtml = '<div class="form-label">付款排程</div><table class="data-table" style="margin-bottom:10px"><tbody>';
    inst.forEach(function (p, i) {
      const d = p.paid_date ? null : daysUntil(p.due_date);
      const due = p.paid_date ? '<span class="badge badge-green">已收 ' + esc(p.paid_date) + '</span>'
        : '<span style="font-size:11.5px;color:' + (d != null && d < 0 ? 'var(--red)' : 'var(--text3)') + '">預計 ' + esc(p.due_date || '—') + (d != null && d < 0 ? '（逾期）' : '') + '</span>';
      const alloc = (p.alloc && p.alloc !== 'prorata') ? ' <span style="font-size:10.5px;color:var(--text3)">' + (ALLOC_OPTS.find(o => o[0] === p.alloc) || ['', ''])[1] + '</span>' : '';
      let act = '';
      if (window.isAdmin) act = p.paid_date
        ? '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="undoPayment(\'' + c.id + '\',' + i + ',\'' + accId + '\')">取消收款</button>'
        : '<button class="btn btn-primary btn-sm" style="font-size:11px" onclick="confirmPayment(\'' + c.id + '\',' + i + ',\'' + accId + '\')">確認收款</button>';
      instHtml += '<tr><td style="font-size:12.5px">' + esc(p.label || '') + alloc + '</td><td style="text-align:right;font-family:var(--mono);font-size:12.5px">' + fmtNum(p.paid_date ? instPaidAmt(p) : p.amount) + '</td><td>' + due + '</td><td style="text-align:right">' + act + '</td></tr>';
    });
    instHtml += '</tbody></table>';
    return ''
      + '<div class="contract-card">'
      +   '<div class="contract-card-header" onclick="toggleContractCard(\'' + c.id + '\')">'
      +     '<div style="flex:1;min-width:0">'
      +       '<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap">' + dealCatBadge(c.deal_category) + '<span style="font-weight:500;font-size:13px">' + esc(c.name || '成交') + '</span>' + (c.quote_note_id ? '<span style="font-size:10.5px;color:var(--text3)">📄 來自報價</span>' : '') + '</div>'
      +       '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:3px">' + meta + '</div>'
      +       (dates ? '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text3)">' + dates + '</div>' : '')
      +     '</div>'
      +     '<div style="display:flex;align-items:center;gap:2px">'
      +       '<button class="btn btn-ghost btn-sm" title="上傳回簽檔" onclick="event.stopPropagation();pickDealFiles(\'' + c.id + '\',\'' + accId + '\')">📎</button>'
      +       '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditContract(\'' + c.id + '\',\'' + accId + '\')">✏️</button>'
      +       (window.isAdmin ? '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteContract(\'' + c.id + '\',\'' + accId + '\')">🗑</button>' : '')
      +     '</div>'
      +   '</div>'
      +   '<div class="contract-card-body" id="ct-body-' + c.id + '" style="display:none">'
      +     '<div class="form-label" style="display:flex;align-items:center;justify-content:space-between">回簽檔<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="pickDealFiles(\'' + c.id + '\',\'' + accId + '\')">＋ 上傳</button></div>'
      +     '<div class="df-files" id="ct-files-' + c.id + '">' + dealFilesListHtml(c.id, accId) + '</div>'
      +     itemsHtml + instHtml
      +     (c.plan_content ? '<div class="form-label">方案內容 / 開通功能</div><div style="font-size:12.5px;white-space:pre-wrap;margin-bottom:10px;padding:8px 10px;background:var(--bg3);border-radius:6px;line-height:1.6">' + esc(c.plan_content) + '</div>' : '')
      +     (c.note ? '<div style="font-size:12px;color:var(--text3);margin-bottom:10px;padding:6px 8px;background:var(--bg3);border-radius:5px;white-space:pre-wrap">' + esc(c.note) + '</div>' : '')
      +     '<div id="ct-notes-' + c.id + '"><div style="font-size:12px;color:var(--text3)">載入中...</div></div>'
      +     '<div style="margin-top:10px;display:flex;gap:6px">'
      +       '<textarea class="form-textarea" id="ct-note-input-' + c.id + '" placeholder="新增備註（例：開通進度、客服交接）..." style="min-height:60px;flex:1;font-size:12.5px"></textarea>'
      +       '<button class="btn btn-primary btn-sm" style="align-self:flex-end" onclick="addContractNote(\'' + c.id + '\')">新增</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  }).join('');
}

// 收款（僅管理員）
async function confirmPayment(ctId, idx, accId) {
  if (!window.isAdmin) { toast('只有管理員可以確認收款', 'error'); return; }
  const { data: ct } = await db.from('contracts').select('*').eq('id', ctId).maybeSingle();
  if (!ct) { toast('找不到成交單', 'error'); return; }
  const inst = JSON.parse(JSON.stringify(dealInstallments(ct)));
  const p = inst[idx]; if (!p) return;
  openModal('💵 確認收款：' + (p.label || ''), ''
    + '<div style="font-size:12.5px;color:var(--text2);margin-bottom:10px">' + esc(ct.name || '') + '｜排定金額 $' + fmtNum(p.amount) + '（未稅）</div>'
    + '<div class="form-row">'
    +   '<div class="form-group"><label class="form-label">實收日期 *</label><input class="form-input" id="pyDate" type="date" value="' + nowDateStr() + '"></div>'
    +   '<div class="form-group"><label class="form-label">實收金額（未稅）*</label><input class="form-input" id="pyAmt" type="number" min="0" value="' + esc(String(p.amount)) + '"></div>'
    + '</div><div style="font-size:11.5px;color:var(--text3)">獎金會算在實收日期的月份。</div>', [
    { label: '取消', cls: 'btn-secondary', action: closeModal },
    { label: '確認收款', cls: 'btn-primary', action: async function () {
      const d = document.getElementById('pyDate').value, a = numLoose(document.getElementById('pyAmt').value);
      if (!d || a == null || a < 0) { toast('請填實收日期與金額', 'error'); return; }
      p.paid_date = d; p.paid_amount = a;
      p.paid_by = currentUser.user_metadata?.full_name || currentUser.email || ''; p.paid_at = new Date().toISOString();
      const { error } = await db.from('contracts').update({ installments: inst, items: dealItems(ct) }).eq('id', ctId);
      if (error) { toast('儲存失敗：' + error.message, 'error'); return; }
      closeModal(); toast('已確認收款', 'success');
      if (currentPage === 'today') renderToday(); else if (currentPage === 'dashboard') renderDashboard(); else if (accId && accId !== 'null') openAccountDetail(accId);
    }}
  ]);
}
async function undoPayment(ctId, idx, accId) {
  if (!window.isAdmin) return;
  openConfirm('取消收款', '確定把這期改回「未收」？該月獎金會跟著重新計算。', async function () {
    const { data: ct } = await db.from('contracts').select('*').eq('id', ctId).maybeSingle();
    if (!ct) { closeModal(); return; }
    const inst = JSON.parse(JSON.stringify(dealInstallments(ct)));
    if (inst[idx]) { inst[idx].paid_date = null; delete inst[idx].paid_amount; delete inst[idx].paid_by; delete inst[idx].paid_at; }
    const { error } = await db.from('contracts').update({ installments: inst }).eq('id', ctId);
    closeModal();
    if (error) { toast('儲存失敗：' + error.message, 'error'); return; }
    toast('已改回未收', 'success');
    if (accId) openAccountDetail(accId);
  }, closeModal, '確定', '取消');
}

// 客戶頁：原始線索的開發紀錄（活動 + 備註），唯讀時間軸
function buildLeadHistoryHtml(acts, notes, contacts, acc) {
  const items = [];
  (acts || []).forEach(function (a) { items.push({ kind: 'act', at: a.created_at, row: a }); });
  (notes || []).forEach(function (n) { items.push({ kind: 'note', at: n.created_at, row: n }); });
  items.sort(function (x, y) { return new Date(y.at) - new Date(x.at); });
  const convertedAt = acc.created_at ? new Date(acc.created_at) : null;
  let html = '', dividerDone = false;
  items.forEach(function (it, idx) {
    if (!dividerDone && convertedAt && new Date(it.at) < convertedAt) {
      dividerDone = true;
      if (idx > 0) html += '<div' + (idx >= 5 ? ' data-more="1" style="display:none;' : ' style="') + 'text-align:center;font-size:11px;color:var(--green);margin:8px 0">── 🤝 轉為成交客戶 ' + isoToLocalDate(acc.created_at) + ' ── 以下為簽約前 ──</div>';
    }
    const hidden = idx >= 5 ? ' data-more="1" style="display:none"' : '';
    const r = it.row;
    let label, icon, color;
    if (it.kind === 'act') {
      const t = ACTIVITY_TYPES[r.type] || ACTIVITY_TYPES['note'];
      label = t.label; icon = t.icon; color = t.color;
      const ct = (contacts || []).find(function (c) { return c.id === r.contact_id; });
      if (ct) label += ' · ' + esc(ct.name);
    } else { label = '備註'; icon = '📝'; color = '#94a3b8'; }
    const u = usersData.find(function (x) { return x.id === r.user_id; });
    const who = u ? (u.full_name || u.email || '') : '';
    html += '<div class="activity-item"' + hidden + '>'
      + '<div class="activity-icon" style="background:' + color + '20;color:' + color + '">' + icon + '</div>'
      + '<div class="activity-content">'
      +   '<div class="activity-type">' + label + '</div>'
      +   '<div class="activity-note" style="white-space:pre-wrap">' + esc(r.content || '') + '</div>'
      +   '<div class="activity-meta">' + fmtDate(it.at) + (who ? ' · ' + esc(who) : '') + '</div>'
      + '</div></div>';
  });
  const more = items.length > 5
    ? '<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="this.parentElement.querySelectorAll(\'[data-more]\').forEach(function(e){e.style.display=\'\'});this.remove()">顯示全部 ' + items.length + ' 筆</button>'
    : '';
  return '<div class="chart-card" style="margin-bottom:14px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    +   '<div class="chart-title">🕘 開發紀錄（來自原始線索，' + items.length + ' 筆）</div>'
    +   '<button class="btn btn-ghost btn-sm" onclick="openLeadDrawerFromAccount(\'' + acc.lead_id + '\')">開啟線索 ↗</button>'
    + '</div>'
    + (items.length ? '<div class="activity-list">' + html + more + '</div>' : '<div class="empty-state" style="padding:16px"><div class="empty-text">此線索沒有開發紀錄</div></div>')
    + '</div>';
}

async function toggleContractCard(ctId) {
  const body = document.getElementById('ct-body-' + ctId);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (!open) await loadContractNotes(ctId);
}

async function loadContractNotes(ctId) {
  const { data: notes } = await db.from('notes').select('*').eq('contract_id', ctId).order('created_at', {ascending:false});
  const el = document.getElementById('ct-notes-' + ctId);
  if (!el) return;
  if (!notes || !notes.length) { el.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:4px 0">尚無備註</div>'; return; }
  el.innerHTML = notes.map(n => `
    <div class="contract-note-item">
      <div>${esc(n.content)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px">
        <div class="contract-note-meta">${fmtDate(n.created_at)}</div>
        <button class="btn btn-ghost btn-sm" style="padding:1px 6px;font-size:11px" onclick="deleteContractNote('${n.id}','${ctId}')">🗑</button>
      </div>
    </div>`).join('');
}

async function addContractNote(ctId) {
  const input = document.getElementById('ct-note-input-' + ctId);
  const text = input?.value?.trim();
  if (!text) return;
  await db.from('notes').insert({ content: text, contract_id: ctId, user_id: currentUser.id, created_at: new Date().toISOString() });
  input.value = '';
  toast('備註已新增', 'success');
  await loadContractNotes(ctId);
}

async function deleteContractNote(noteId, ctId) {
  await db.from('notes').delete().eq('id', noteId);
  await loadContractNotes(ctId);
}

}

async function openEditContract(ctId, accId) {

async function openDealModal(accId, ct, opts) {
  if (!dealTypesData.length || !usersData.length) await loadGlobalData();
  _lastDealTpl = '';
  opts = opts || {};
  let acc = accountsData.find(a => a.id === accId);
  if (!acc) { const r = await db.from('accounts').select('*').eq('id', accId).maybeSingle(); acc = r.data; }
  const leadId = opts.leadId || (acc && acc.lead_id) || null;
  if (!ct && !opts.quoteNoteId) {
    if (leadId) { startDealFromQuote(leadId); return; }
    toast('成交要從報價單轉，請先到公司頁建立報價', 'error'); return;
  }
  const quotes = leadId ? await loadQuoteNotesForLead(leadId) : [];
  if (!ct && !opts.quoteNoteId) opts.quoteNoteId = pickDefaultQuote(quotes);
  initDealForm(ct, quotes, opts.quoteNoteId);
  const def = { sales_user_id: (acc && acc.user_id) || currentUser.id, deal_category: ct ? null : '加購專案' };
  openModal(ct ? '✏️ 編輯成交單' : '＋ 新增成交單' + (acc ? '：' + acc.name : ''), buildDealFormHtml(ct, def), [
    { label: '取消', cls: 'btn-secondary', action: closeModal },
    { label: ct ? '儲存' : '建立', cls: 'btn-primary', action: async function () {
      if (_dealBusy) return;
      const payload = readDealForm();
      if (!payload) return;
      _dealBusy = true;
      try {
        let error;
        if (ct) {
          // 編輯期間若管理員剛好確認了收款，保留最新的收款狀態
          const fresh = (await db.from('contracts').select('installments').eq('id', ct.id).maybeSingle()).data;
          if (fresh && Array.isArray(fresh.installments)) {
            fresh.installments.forEach(function (fp, i) {
              const mp = payload.installments[i];
              if (fp && fp.paid_date && mp && !mp.paid_date) { ['paid_date','paid_amount','paid_by','paid_at'].forEach(function (k) { if (fp[k] != null) mp[k] = fp[k]; }); }
            });
          }
          ({ error } = await db.from('contracts').update(payload).eq('id', ct.id));
        } else {
          payload.account_id = accId;
          payload.user_id = currentUser.id;
          payload.created_at = new Date().toISOString();
          ({ error } = await db.from('contracts').insert(payload));
        }
        if (error) { toast('儲存失敗：' + error.message, 'error'); return; }
        closeModal();
        toast(ct ? '成交單已更新' : '成交單已建立', 'success');
        goToAccount(accId);
      } finally { _dealBusy = false; }
    }}
  ]);
  document.getElementById('modalBox').style.maxWidth = '820px';
  afterDealFormOpen(ct ? null : opts.quoteNoteId);
}

// ── 業績統計 ──
function openSalesReport() { perfTab = 'deals'; navigate('performance'); }

function setSalesReportRange(kind) {
  const t = new Date(); const y = t.getFullYear(); const m = t.getMonth();
  let a, b;
  if (kind === 'lastmonth') { const d = new Date(y, m - 1, 1); a = b = d.getFullYear() + '-' + _pad2(d.getMonth() + 1); }
  else if (kind === 'quarter') { const qs = Math.floor(m / 3) * 3; a = y + '-' + _pad2(qs + 1); b = y + '-' + _pad2(qs + 3); }
  else { a = y + '-01'; b = y + '-12'; }
  document.getElementById('srFrom').value = a;
  document.getElementById('srTo').value = b;
  runSalesReport();
}

async function runSalesReport() {
  const el = document.getElementById('srResult');
  if (!el) return;
  let from = document.getElementById('srFrom').value, to = document.getElementById('srTo').value;
  if (!from || !to) { toast('請選擇起訖月份', 'error'); return; }
  if (from > to) { const x = from; from = to; to = x; }
  el.innerHTML = '<div class="loading"><span class="dot-pulse">載入中</span></div>';
  if (!usersData.length) await loadGlobalData();
  const [ctRes, accRes] = await Promise.all([
    db.from('contracts').select('*'),
    db.from('accounts').select('id,name')
  ]);
  if (ctRes.error) { el.innerHTML = '<div style="color:var(--red);font-size:13px">讀取失敗：' + esc(ctRes.error.message) + '</div>'; return; }
  const accName = {}; (accRes.data || []).forEach(function (a) { accName[a.id] = a.name; });
  let rows = (ctRes.data || []).filter(function (c) { const ym = dealDate(c).slice(0, 7); return ym >= from && ym <= to; });
  if (!window.isAdmin) rows = rows.filter(function (c) { return (c.sales_user_id || c.user_id) === currentUser.id; });
  rows.sort(function (a, b) { return dealDate(b).localeCompare(dealDate(a)); });
  window._srRows = rows.map(function (c) {
    return { 簽約日: dealDate(c), 客戶: accName[c.account_id] || '', 類型: c.deal_category || '主約', 方案: c.name || '', 金額: c.amount || 0, 業務: dealSalesName(c) || '（未指定）', 系統啟用日: c.start_date || '', 續約日: c.end_date || '', 方案內容: c.plan_content || '', _acc: c.account_id };
  });
  window._srRange = from + '_' + to;
  if (!rows.length) { el.innerHTML = '<div class="empty-state" style="padding:24px"><div class="empty-text">此期間沒有成交紀錄</div></div>'; return; }
  const bySales = {};
  window._srRows.forEach(function (r) {
    const k = r.業務;
    if (!bySales[k]) { bySales[k] = { n: 0, total: 0 }; DEAL_CATEGORIES.forEach(function (c) { bySales[k][c] = 0; }); }
    const cat = DEAL_CATEGORIES.indexOf(r.類型) >= 0 ? r.類型 : '其他';
    bySales[k][cat] += r.金額; bySales[k].total += r.金額; bySales[k].n += 1;
  });
  const th = 'style="text-align:right"';
  let sum = '<table class="data-table" style="margin-bottom:14px"><thead><tr><th>業務</th>';
  DEAL_CATEGORIES.forEach(function (c) { sum += '<th ' + th + '>' + c + '</th>'; });
  sum += '<th ' + th + '>合計</th><th ' + th + '>筆數</th></tr></thead><tbody>';
  const grand = { n: 0, total: 0 }; DEAL_CATEGORIES.forEach(function (c) { grand[c] = 0; });
  Object.keys(bySales).sort(function (a, b) { return bySales[b].total - bySales[a].total; }).forEach(function (k) {
    const s = bySales[k];
    sum += '<tr><td style="font-weight:500">' + esc(k) + '</td>';

// ── 業績獎金（依 V3 制度，只算業績獎金；不含底薪與 KPI）──
// 規則集中在這裡，制度改版時只要改這個物件
const BONUS_RULES = {
  tiers: [ { upTo: 200000, rate: 0.10 }, { upTo: 500000, rate: 0.12 }, { upTo: Infinity, rate: 0.15 } ], // 當月累積標準業績，超額累進
  customRate: 0.05,   // 客製案件：整包成交價 × 5%，獨立計算
  renewalRate: 0.10   // 首次續約：純軟體續約金額 × 10%，限親自開發客戶、只發第一次
};
function bonusBucket(cat) {
  const c = cat || '主約';
  if (c === '主約' || c === '加購專案') return 'standard';
  if (c === '客製案件') return 'custom';
  if (c === '續約') return 'renewal';
  return 'none';
}
function pct(r) { return Math.round(r * 1000) / 10 + '%'; }
function calcTiered(amount) {
  const lines = []; let prev = 0, total = 0;
  BONUS_RULES.tiers.forEach(function (t) {
    if (amount <= prev) return;
    const portion = Math.min(amount, t.upTo) - prev;
    const b = Math.round(portion * t.rate);
    lines.push({ portion: portion, rate: t.rate, bonus: b });
    total += b; prev = t.upTo;
  });
  return { lines: lines, total: total };
}
function nextTierHint(amount) {
  let prev = 0;
  for (let i = 0; i < BONUS_RULES.tiers.length - 1; i++) {
    const t = BONUS_RULES.tiers[i];
    if (amount < t.upTo) return '再 $' + fmtNum(t.upTo - amount) + ' 標準業績，超出部分改抽 ' + pct(BONUS_RULES.tiers[i + 1].rate);
    prev = t.upTo;
  }
  return '';
}
function userNameById(uid, fallback) {
  const u = usersData.find(function (x) { return x.id === uid; });
  return u ? (u.full_name || u.email || '') : (fallback || '（未指定）');
}

// 把每筆成交轉成獎金項目：決定類別、歸屬業務、是否計獎
function buildBonusEntries(contracts, accounts) {
  const accMap = {}; (accounts || []).forEach(function (a) { accMap[a.id] = a; });
  const byAcc = {};
  contracts.forEach(function (c) { (byAcc[c.account_id] = byAcc[c.account_id] || []).push(c); });
  const sortFn = function (a, b) { return dealDate(a).localeCompare(dealDate(b)) || String(a.created_at || '').localeCompare(String(b.created_at || '')); };
  const firstRenewal = new Set(), devOf = {};
  Object.keys(byAcc).forEach(function (aid) {
    const list = byAcc[aid].slice().sort(sortFn);
    const firstMain = list.find(function (c) { return (c.deal_category || '主約') === '主約'; });
    devOf[aid] = (firstMain && (firstMain.sales_user_id || firstMain.user_id)) || (accMap[aid] && accMap[aid].user_id) || null;
    const fr = list.find(function (c) { return dealItems(c).some(function (it) { return it.bonus_type === 'renewal' && Number(it.amount) > 0; }); });
    if (fr) firstRenewal.add(fr.id);
  });
  const out = [];
  contracts.forEach(function (c) {
    const tot = {}; let all = 0;
    dealItems(c).forEach(function (it) { const a = Number(it.amount) || 0; if (a <= 0) return; const t = it.bonus_type || 'none'; tot[t] = (tot[t] || 0) + a; all += a; });
    const salesUid = c.sales_user_id || c.user_id;
    // 「依比例」的期數，只分攤「扣掉指定類別期數之後」剩下的部分
    const spec = {};
    dealInstallments(c).forEach(function (p) { if (p.alloc && p.alloc !== 'prorata') spec[p.alloc] = (spec[p.alloc] || 0) + (Number(p.amount) || 0); });
    const rem = {}; let remAll = 0;
    Object.keys(tot).forEach(function (t) { rem[t] = Math.max(0, tot[t] - (spec[t] || 0)); remAll += rem[t]; });
    const base = remAll > 0 ? rem : tot, baseAll = remAll > 0 ? remAll : all;
    dealInstallments(c).forEach(function (p, idx) {
      const paid = !!p.paid_date;
      const amt = paid ? instPaidAmt(p) : (Number(p.amount) || 0);
      if (!amt) return;
      const ym = String(paid ? p.paid_date : (p.due_date || dealDate(c))).slice(0, 7);
      const parts = {};
      if (p.alloc && p.alloc !== 'prorata') parts[p.alloc] = amt;
      else if (baseAll > 0) Object.keys(base).forEach(function (t) { if (base[t]) parts[t] = amt * base[t] / baseAll; });
      else parts.none = amt;
      Object.keys(parts).forEach(function (t) {
        let type = t, uid = salesUid, reason = '';
        if (t === 'renewal') {
          if (!firstRenewal.has(c.id)) { type = 'none'; reason = '非首次續約，不發放'; }
          else if (devOf[c.account_id]) { uid = devOf[c.account_id]; if (uid !== salesUid) reason = '歸屬原開發業務'; }
        }
        if (type === 'none' && !reason) reason = '不計獎金';
        out.push({ c: c, p: p, idx: idx, paid: paid, ym: ym, type: type, uid: uid, uname: userNameById(uid, c.sales_user_name),
                   amt: Math.round(parts[t]), reason: reason, acc: (accMap[c.account_id] || {}).name || '' });
      });
    });
  });
  return out;
}
function sumBonus(entries) {
  let std = 0, cus = 0, ren = 0;
  entries.forEach(function (e) {
    if (e.type === 'standard') std += e.amt; else if (e.type === 'custom') cus += e.amt; else if (e.type === 'renewal') ren += e.amt;
  });
  const tier = calcTiered(std);
  const cusB = Math.round(cus * BONUS_RULES.customRate), renB = Math.round(ren * BONUS_RULES.renewalRate);
  return { std: std, cus: cus, ren: ren, tier: tier, cusB: cusB, renB: renB, total: tier.total + cusB + renB };
}
function bonusBreakdownHtml(r) {
  const row = function (label, calc, val) {
    return '<tr><td style="font-weight:500;white-space:nowrap">' + label + '</td><td style="font-size:12.5px;color:var(--text2)">' + calc + '</td><td style="text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap">' + fmtNum(val) + ' 元</td></tr>';
  };
  const tierCalc = r.tier.lines.length
    ? r.tier.lines.map(function (l) { return fmtNum(l.portion) + ' × ' + pct(l.rate); }).join(' ＋ ') + ' ＝ ' + fmtNum(r.tier.total)
    : '標準業績 0';
  const hint = nextTierHint(r.std);
  return '<table class="data-table" style="margin-bottom:6px"><tbody>'
    + row('① 標準業績抽成', '標準業績 $' + fmtNum(r.std) + '：' + tierCalc, r.tier.total)
    + row('② 客製案件獎金', fmtNum(r.cus) + ' × ' + pct(BONUS_RULES.customRate), r.cusB)
    + row('③ 首次續約獎金', fmtNum(r.ren) + ' × ' + pct(BONUS_RULES.renewalRate), r.renB)
    + '<tr style="border-top:2px solid var(--border)"><td style="font-weight:700">業績獎金合計</td><td></td><td style="text-align:right;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent)">' + fmtNum(r.total) + ' 元</td></tr>'
    + '</tbody></table>'
    + (hint ? '<div style="font-size:12px;color:var(--text3);margin-bottom:12px">📈 ' + hint + '</div>' : '');
}
