}

// ── ① 開打模式 ──
async function loadCcQueue() {
  const { data, error } = await db.from('cold_calls').select('*');
  if (error) { toast('讀取失敗：' + error.message, 'error'); return []; }
  const today = nowDateStr();
  return (data || [])
    .filter(function (c) {
      if (['interested', 'rejected', 'invalid', 'converted'].indexOf(c.status) >= 0) return false;
      if (c.owner_id && c.owner_id !== currentUser.id) return false;
      if (c.next_call_at && String(c.next_call_at).slice(0, 10) > today) return false;
      return true;
    })
    .sort(function (a, b) {
      const pa = a.status === 'callback' ? 0 : (a.owner_id ? 1 : 2);
      const pb = b.status === 'callback' ? 0 : (b.owner_id ? 1 : 2);
      if (pa !== pb) return pa - pb;
      const ga = 'ABC'.indexOf(String(a.grade || 'B').toUpperCase());
      const gb = 'ABC'.indexOf(String(b.grade || 'B').toUpperCase());
      if (ga !== gb) return (ga < 0 ? 1 : ga) - (gb < 0 ? 1 : gb);
      return String(a.next_call_at || a.created_at || '').localeCompare(String(b.next_call_at || b.created_at || ''));
    });
}

async function renderCcCall() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><span class="dot-pulse">載入中</span></div>';
  ccQueue = await loadCcQueue();
  if (currentPage !== 'coldcall') return;
  ccIdx = 0;
  renderCcCard();
}

async function renderCcCard() {
  const content = document.getElementById('content');
  if (currentPage !== 'coldcall' || ccTab !== 'call') return;
  if (ccIdx >= ccQueue.length) {
    content.innerHTML = '<div class="cp-card" style="max-width:560px;text-align:center;padding:40px 20px">'
      + '<div style="font-size:40px;margin-bottom:10px">' + (ccQueue.length ? '🎉' : '📭') + '</div>'
      + '<div style="font-size:17px;font-weight:700;margin-bottom:6px">' + (ccQueue.length ? '這輪都打完了' : '目前沒有要打的名單') + '</div>'
      + '<div style="font-size:13px;color:var(--text3);margin-bottom:16px">' + (ccQueue.length ? '共 ' + ccQueue.length + ' 通' : '去「名單」認領，或先加一批新名單') + '</div>'
      + '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
      +   '<button class="btn btn-secondary btn-sm" onclick="renderCcCall()">🔄 重新整理</button>'
      +   '<button class="btn btn-secondary btn-sm" onclick="ccTab=\'list\';renderColdCall()">📋 看名單</button>'
      +   '<button class="btn btn-primary btn-sm" onclick="openCcImport()">＋ 加名單</button>'
      + '</div></div>';
    return;
  }
  const c = ccQueue[ccIdx];
  const [{ data: logs }, sc] = await Promise.all([
    db.from('call_logs').select('*').eq('cold_call_id', c.id).order('called_at', { ascending: false }),
    ccTodayScore()
  ]);
  if (currentPage !== 'coldcall' || ccTab !== 'call') return;
  const hist = (logs || []).slice(0, 3).map(function (l) {
    const o = CC_OUTCOMES[l.outcome] || {};
    return '<div style="font-size:12px;color:var(--text3);padding:4px 0;border-top:1px solid var(--border)">'
      + (o.icon || '') + ' ' + (o.label || l.outcome) + '・' + fmtDate(l.called_at) + (l.user_name ? '・' + esc(l.user_name) : '')
      + (l.note ? '<div style="color:var(--text2);margin-top:2px;white-space:pre-wrap">' + esc(l.note) + '</div>' : '')
      + '</div>';
  }).join('');
  let btns = '';
  Object.keys(CC_OUTCOMES).forEach(function (k) {
    const o = CC_OUTCOMES[k];
    btns += '<button class="cc-out" style="border-color:' + o.color + '33" onclick="ccPickOutcome(\'' + k + '\')">'
      + '<span style="font-size:19px">' + o.icon + '</span><span style="color:' + o.color + '">' + o.label + '</span></button>';
  });
  const warn = (c.attempts || 0) >= CC_GIVEUP_AFTER
    ? '<div style="font-size:12px;color:var(--yellow);margin-top:8px">⚠️ 已撥打 ' + c.attempts + ' 次都沒接通，考慮放棄這筆</div>' : '';
  const rank = ccRankOf(sc.pts);
  const goalPct = Math.min(100, Math.round(sc.calls / sc.goal * 100));
  content.innerHTML = ''
    + '<div style="max-width:560px">'
    + '<div class="cc-hud">'
    +   '<div style="cursor:pointer" onclick="ccSetDailyGoal()" title="點我改每日目標"><div class="cc-hud-n">' + sc.calls + '<span style="font-size:12px;color:var(--text3);font-weight:500"> / ' + sc.goal + '</span></div><div class="cc-hud-l">今日撥打</div></div>'
    +   '<div class="cc-hud-bar"><div style="width:' + goalPct + '%"></div></div>'
    +   '<div style="text-align:center"><div class="cc-hud-n" style="color:var(--green)">' + sc.conn + '</div><div class="cc-hud-l">接通</div></div>'
    +   '<div style="text-align:center"><div class="cc-hud-n" style="color:var(--yellow)">' + sc.hot + '</div><div class="cc-hud-l">有興趣</div></div>'
    +   '<div style="text-align:center"><div class="cc-hud-n" style="color:var(--accent)">' + sc.pts + '</div><div class="cc-hud-l">' + rank[2] + ' ' + rank[1] + '</div></div>'
    +   (sc.streak > 1 ? '<div style="text-align:center"><div class="cc-hud-n" style="color:#f97316">🔥' + sc.streak + '</div><div class="cc-hud-l">連續達標</div></div>' : '')
    + '</div>'
    + (goalPct >= 100 ? '<div style="font-size:12.5px;color:var(--green);background:var(--green-bg);padding:7px 12px;border-radius:8px;margin-bottom:10px">🎯 今日目標達成！再多打都是賺到</div>' : '')
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
    +   '<div style="font-size:13px;color:var(--text3)">第 <b style="color:var(--text)">' + (ccIdx + 1) + '</b> / ' + ccQueue.length + ' 通</div>'
    +   '<div class="df-bar" style="flex:1"><div style="width:' + Math.round(ccIdx / ccQueue.length * 100) + '%"></div></div>'
    + '</div>'
    + '<div class="cp-card">'
    +   '<div style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:4px">'
    +     ccGradeBadge(c.grade)
    +     '<div style="font-size:20px;font-weight:700;flex:1;min-width:0">' + esc(c.company || '') + '</div>'
    +     ccStatusBadge(c.status)
    +   '</div>'
    +   '<div style="font-size:12.5px;color:var(--text3);margin-bottom:14px">'
    +     [esc(c.contact_name || ''), esc(c.title || ''), esc(c.industry || ''), esc(c.city || '')].filter(Boolean).join('・')
    +     + ((c.attempts || 0) ? (([c.contact_name, c.title, c.industry, c.city].filter(Boolean).length ? '・' : '') + '已撥 ' + c.attempts + ' 次') : '')
    +   '</div>'
    +   '<a class="cc-dial" href="' + ccTelHref(c.phone) + '">📞 ' + esc(c.phone || '（無電話）') + '</a>'
    +   (c.note ? '<div class="cc-note mkt">📋 ' + esc(c.note) + '</div>' : '')
    +   (c.sales_note ? '<div class="cc-note sales">✍️ ' + esc(c.sales_note) + '</div>' : '')
    +   warn
    +   '<div class="cc-outs">' + btns + '</div>'
    +   '<div style="display:flex;gap:6px;margin-top:12px">'
    +     '<button class="btn btn-ghost btn-sm" onclick="ccSkip()">略過 ›</button>'
    +     '<button class="btn btn-ghost btn-sm" onclick="ccQuickNote(\'' + c.id + '\')">✍️ 備註</button>'
    +     '<span style="flex:1"></span>'
    +     '<button class="btn btn-ghost btn-sm" onclick="openCcEdit(\'' + c.id + '\')">✏️ 編輯</button>'
    +   '</div>'
    + '</div>'
    + (hist ? '<div class="cp-card"><div class="cp-card-t" style="margin-bottom:4px">通話紀錄</div>' + hist + '</div>' : '')
    + '</div>';
}

function ccSkip() { ccIdx += 1; renderCcCard(); }

function ccQuickNote(id) {
  const c = ccQueue.find(function (x) { return x.id === id; }) || {};
  openModal('✍️ 業務備註：' + (c.company || ''),
    (c.note ? '<div class="form-label">名單備註（行銷提供）</div><div class="cc-note mkt" style="margin:0 0 12px">' + esc(c.note) + '</div>' : '')
    + '<div class="form-group"><label class="form-label">你的備註</label>'
    + '<textarea class="form-textarea" id="ccQN" style="min-height:110px" placeholder="這家的狀況、窗口習慣、下次切入點…">' + esc(c.sales_note || '') + '</textarea></div>', [
    { label: '取消', cls: 'btn-secondary', action: closeModal },
    { label: '儲存', cls: 'btn-primary', action: async function () {
      const v = document.getElementById('ccQN').value.trim() || null;
      const { error } = await db.from('cold_calls').update({ sales_note: v, updated_at: new Date().toISOString() }).eq('id', id);
      if (error) { toast('儲存失敗：' + error.message, 'error'); return; }
      c.sales_note = v;
      closeModal(); toast('備註已存', 'success');
      renderCcCard();
    }}
  ]);
}

function ccPickOutcome(key) {
  const o = CC_OUTCOMES[key];
  const c = ccQueue[ccIdx];
  if (!c) return;
  let extra = '';
  if (key === 'callback' || key === 'no_answer' || key === 'gatekeeper') {
    const def = o.askNext || o.autoNext || 1;
    let chips = '';
    [[1, '明天'], [3, '3 天後'], [7, '1 週後'], [14, '2 週後'], [30, '1 個月後']].forEach(function (p) {
      chips += '<button type="button" class="df-chip' + (p[0] === def ? ' on' : '') + '" onclick="ccSetNext(' + p[0] + ',this)">' + p[1] + '</button>';
    });
    extra = '<div class="form-group"><label class="form-label">下次什麼時候再打？</label>'
      + '<div id="ccNextChips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">' + chips + '</div>'
      + '<input class="form-input" id="ccNextDate" type="date" value="' + addDaysStr(nowDateStr(), def) + '"></div>';
  }
  openModal(o.icon + ' ' + o.label + '：' + (c.company || ''),
    extra + '<div class="form-group"><label class="form-label">通話內容</label>'
    + '<textarea class="form-textarea" id="ccNote" style="min-height:90px" placeholder="對方說了什麼、下一步是什麼…"></textarea></div>'
    + (key === 'interested' ? '<div style="font-size:12.5px;color:var(--green);background:var(--green-bg);padding:8px 10px;border-radius:8px">存檔後會直接帶你把這筆轉成線索。</div>' : ''),
    [
      { label: '取消', cls: 'btn-secondary', action: closeModal },
      { label: '儲存', cls: 'btn-primary', action: function () { ccSaveOutcome(key); } }
    ]);
}
function ccSetNext(days, btn) {
  const inp = document.getElementById('ccNextDate');
  if (inp) inp.value = addDaysStr(nowDateStr(), days);
  document.querySelectorAll('#ccNextChips .df-chip').forEach(function (b) { b.classList.toggle('on', b === btn); });
}

async function ccSaveOutcome(key) {
  if (ccBusy) return;
  const o = CC_OUTCOMES[key];
  const c = ccQueue[ccIdx];
  if (!c || !o) return;
  ccBusy = true;
  try {
    const note = document.getElementById('ccNote')?.value.trim() || null;
    const nextEl = document.getElementById('ccNextDate');
    const next = nextEl ? (nextEl.value || null) : null;
    const now = new Date().toISOString();
    const myName = userNameById(currentUser.id, currentUser.user_metadata?.full_name || currentUser.email || '');
    const { error: le } = await db.from('call_logs').insert({
      cold_call_id: c.id, outcome: key, note: note,
      user_id: currentUser.id, user_name: myName, called_at: now
    });
    if (le) { toast('儲存失敗：' + le.message, 'error'); return; }
    const upd = {
      status: o.status,
      attempts: (c.attempts || 0) + 1,
      last_call_at: now,
      next_call_at: next,
      updated_at: now
    };
    if (!c.owner_id) { upd.owner_id = currentUser.id; upd.owner_name = myName; }
    const { error } = await db.from('cold_calls').update(upd).eq('id', c.id);
    if (error) { toast('儲存失敗：' + error.message, 'error'); return; }
    Object.assign(c, upd);
    closeModal();
    const gained = ccLogPoints({ outcome: key });
    ccPop('+' + gained, o.color);
    if (key === 'interested') { openCcConvert(c.id); return; }
    toast(o.icon + ' 已記錄　+' + gained + ' 分' + (next ? '・' + next + ' 再打' : ''), 'success');
    ccIdx += 1;
    renderCcCard();
  } finally { ccBusy = false; }
}

// ── 轉線索 ──
async function openCcConvert(ccId) {
  const { data: c } = await db.from('cold_calls').select('*').eq('id', ccId).maybeSingle();
  if (!c) { toast('找不到這筆名單', 'error'); return; }
  if (c.lead_id) { toast('已經轉過線索了', 'success'); openCompany(c.lead_id); return; }
  if (!stagesData.length) await loadGlobalData();
  const dup = await ccFindExistingLead(c.company);
  let stageOpts = '';
  stagesData.forEach(function (s, i) { stageOpts += '<option value="' + s.id + '"' + (i === 0 ? ' selected' : '') + '>' + esc(s.name) + '</option>'; });
  let srcOpts = '<option value="">— 不指定 —</option>';
  const guess = sourcesData.find(function (s) { return /陌開|陌生|電話|開發/.test(s.name); });
  sourcesData.forEach(function (s) { srcOpts += '<option value="' + s.id + '"' + (guess && s.id === guess.id ? ' selected' : '') + '>' + esc(s.name) + '</option>'; });
  openModal('🔥 轉為線索：' + (c.company || ''), ''
    + (dup ? '<div style="font-size:12.5px;color:var(--yellow);background:var(--yellow-bg);padding:8px 10px;border-radius:8px;margin-bottom:12px">⚠️ 系統已有同名公司「' + esc(dup.name) + '」'
        + '<button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="closeModal();openCompany(\'' + dup.id + '\')">去看看</button></div>' : '')
    + '<div class="form-row">'
    +   '<div class="form-group"><label class="form-label">公司名稱 *</label><input class="form-input" id="cvName" value="' + esc(c.company || '') + '"></div>'
    +   '<div class="form-group"><label class="form-label">階段</label><select class="form-select" id="cvStage">' + stageOpts + '</select></div>'
    + '</div>'
    + '<div class="form-row">'
    +   '<div class="form-group"><label class="form-label">來源</label><select class="form-select" id="cvSource">' + srcOpts + '</select></div>'
    +   '<div class="form-group"><label class="form-label">產業</label><input class="form-input" id="cvIndustry" value="' + esc(c.industry || '') + '"></div>'
    + '</div>'
    + '<div class="form-row">'
    +   '<div class="form-group"><label class="form-label">聯絡人</label><input class="form-input" id="cvContact" value="' + esc(c.contact_name || '') + '"></div>'
    +   '<div class="form-group"><label class="form-label">電話</label><input class="form-input" id="cvPhone" value="' + esc(c.phone || '') + '"></div>'
    + '</div>'
    + '<div class="form-group"><label class="form-label">下次聯絡日</label><input class="form-input" id="cvNext" type="date" value="' + addDaysStr(nowDateStr(), 3) + '"></div>'
    + ((c.note || c.sales_note) ? '<div class="form-group"><label class="form-label">帶進線索的備註</label>'
        + '<textarea class="form-textarea" id="cvNote" style="min-height:70px">' + esc([c.note ? '【名單備註】' + c.note : '', c.sales_note ? '【業務備註】' + c.sales_note : ''].filter(Boolean).join('\n')) + '</textarea></div>' : '')
    + '<div style="font-size:12px;color:var(--text3)">所有通話紀錄會一併帶進線索的時間軸。</div>', [
    { label: '取消', cls: 'btn-secondary', action: function () { closeModal(); ccAfterConvertSkip(); } },
    { label: '✅ 建立線索', cls: 'btn-primary', action: function () { ccDoConvert(c); } }
  ]);
}
function ccAfterConvertSkip() {
  if (currentPage === 'coldcall' && ccTab === 'call') { ccIdx += 1; renderCcCard(); }
}
async function ccFindExistingLead(company) {
  const core = ccNormCo(company);
  if (core.length < 2) return null;
  const { data } = await db.from('leads').select('id,name').ilike('name', '%' + core.slice(0, 10) + '%').limit(5);
  return (data || []).find(function (l) {
    const n = ccNormCo(l.name);
    return n.indexOf(core) >= 0 || core.indexOf(n) >= 0;
  }) || null;
}

async function ccDoConvert(c) {
  if (ccBusy) return;
  const name = document.getElementById('cvName').value.trim();
  if (!name) { toast('請填公司名稱', 'error'); return; }
  ccBusy = true;
  try {
    const now = new Date().toISOString();
    const myName = userNameById(currentUser.id, currentUser.user_metadata?.full_name || currentUser.email || '');
    const { data: lead, error } = await db.from('leads').insert({
      name: name,
      stage_id: document.getElementById('cvStage').value || null,
      source_id: document.getElementById('cvSource').value || null,
      product_type: document.getElementById('cvIndustry').value.trim() || null,
      user_id: c.owner_id || currentUser.id,
      user_name: c.owner_name || myName,
      next_contact_date: document.getElementById('cvNext').value || null,
      created_at: now, updated_at: now
    }).select().single();
    if (error || !lead) { toast('建立失敗：' + (error ? error.message : ''), 'error'); return; }
    const ctName = document.getElementById('cvContact').value.trim();
    const ctPhone = document.getElementById('cvPhone').value.trim();
    if (ctName || ctPhone) {
      await db.from('contacts').insert({
        lead_id: lead.id, name: ctName || '（未留名）', phone: ctPhone || null,
        email: c.email || null, role: c.title || null, created_at: now
      });
    }
    // 把陌開通話紀錄搬進線索時間軸
    const { data: logs } = await db.from('call_logs').select('*').eq('cold_call_id', c.id).order('called_at', { ascending: true });
    for (const l of (logs || [])) {
      const o = CC_OUTCOMES[l.outcome] || {};
      await db.from('activities').insert({
        type: 'call', lead_id: lead.id, user_id: l.user_id || currentUser.id,
        content: '【陌開電話・' + (o.label || l.outcome) + '】' + (l.note || ''),
        created_at: l.called_at || now
      });
    }
    const cvn = document.getElementById('cvNote')?.value.trim();
    if (cvn) await db.from('notes').insert({ content: cvn, lead_id: lead.id, user_id: currentUser.id, created_at: now });
    await db.from('cold_calls').update({ status: 'converted', lead_id: lead.id, updated_at: now }).eq('id', c.id);
    const q = ccQueue.find(function (x) { return x.id === c.id; });
    if (q) { q.status = 'converted'; q.lead_id = lead.id; }
    closeModal();
    ccPop('+' + CC_POINTS.converted, 'var(--green)');
    toast('🎉 已轉成線索：' + name + '　+' + CC_POINTS.converted + ' 分', 'success');
    openCompany(lead.id);
  } finally { ccBusy = false; }
}

// ── ② 名單 ──
async function renderCcList() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><span class="dot-pulse">載入中</span></div>';
  const { data, error } = await db.from('cold_calls').select('*').order('created_at', { ascending: false });
  if (currentPage !== 'coldcall' || ccTab !== 'list') return;
  if (error) { content.innerHTML = '<div class="cp-card" style="color:var(--red)">讀取失敗：' + esc(error.message) + '（是否已執行 v5 SQL？）</div>'; return; }
  const all = data || [];
  window._ccAll = all;
  const batches = [];
  all.forEach(function (c) { if (c.batch && batches.indexOf(c.batch) < 0) batches.push(c.batch); });
  const stOpts = ['<option value="active">進行中（未撥＋跟進）</option>', '<option value="all">全部</option>']
    .concat(Object.keys(CC_STATUS).map(function (k) { return '<option value="' + k + '">' + CC_STATUS[k].label + '</option>'; })).join('');
  let ownerOpts = '<option value="all">全部負責人</option><option value="mine">我的</option><option value="pool">公海（未認領）</option>';
  usersData.forEach(function (u) { ownerOpts += '<option value="' + u.id + '">' + esc(u.full_name || u.email || '') + '</option>'; });
  let gradeOpts = '<option value="">全部等級</option>';
  Object.keys(CC_GRADES).forEach(function (g) { gradeOpts += '<option value="' + g + '">' + g + '（' + CC_GRADES[g] + '）</option>'; });
  let batchOpts = '<option value="">全部批次</option>';
  batches.forEach(function (b) { batchOpts += '<option value="' + esc(b) + '">' + esc(b) + '</option>'; });
  const sel = function (id, opts, val, w) {
    return '<select class="form-select" id="' + id + '" style="width:auto;height:32px;font-size:13px' + (w ? ';max-width:' + w : '') + '" onchange="ccApplyFilter()">'
      + opts.replace('value="' + val + '"', 'value="' + val + '" selected') + '</select>';
  };
  content.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'
    + sel('ccFStatus', stOpts, ccFilter.status) + sel('ccFGrade', gradeOpts, ccFilter.grade) + sel('ccFOwner', ownerOpts, ccFilter.owner) + sel('ccFBatch', batchOpts, ccFilter.batch, '160px')
    + '<input class="form-input" id="ccFQ" placeholder="搜尋公司、電話、窗口…" style="width:auto;height:32px;font-size:13px;flex:1;min-width:150px" value="' + esc(ccFilter.q) + '" oninput="ccApplyFilter()">'
    + '<button class="btn btn-ghost btn-sm" onclick="ccExport()">📤 匯出</button>'
    + '</div><div id="ccListBody"></div>';
  ccApplyFilter();
}

function ccFiltered() {
  const all = window._ccAll || [];
  const f = ccFilter;
  const q = f.q.trim().toLowerCase();
  return all.filter(function (c) {
    if (f.status === 'active') { if (['interested', 'rejected', 'invalid', 'converted'].indexOf(c.status) >= 0) return false; }
    else if (f.status !== 'all' && c.status !== f.status) return false;
    if (f.owner === 'mine') { if (c.owner_id !== currentUser.id) return false; }
    else if (f.owner === 'pool') { if (c.owner_id) return false; }
    else if (f.owner !== 'all' && c.owner_id !== f.owner) return false;
    if (f.grade && String(c.grade || '').toUpperCase() !== f.grade) return false;
    if (f.batch && c.batch !== f.batch) return false;
    if (q) {
      const hay = [c.company, c.phone, c.contact_name, c.industry, c.note, c.sales_note].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function ccApplyFilter() {
  ccFilter.status = document.getElementById('ccFStatus')?.value || 'active';
  ccFilter.owner = document.getElementById('ccFOwner')?.value || 'all';
  ccFilter.grade = document.getElementById('ccFGrade')?.value || '';
  ccFilter.batch = document.getElementById('ccFBatch')?.value || '';
  ccFilter.q = document.getElementById('ccFQ')?.value || '';
  const rows = ccFiltered();
  const el = document.getElementById('ccListBody');
  if (!el) return;
  if (!rows.length) { el.innerHTML = '<div class="empty-state" style="padding:28px"><div class="empty-text">沒有符合條件的名單</div></div>'; return; }
  let h = '<div style="font-size:12px;color:var(--text3);margin-bottom:6px">' + rows.length + ' 筆</div>'
    + '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>等級</th><th>公司</th><th>備註</th><th>電話</th><th>狀態</th><th>撥打</th><th>下次</th><th>負責</th><th></th></tr></thead><tbody>';
  rows.slice(0, 300).forEach(function (c) {
    const nd = c.next_call_at ? String(c.next_call_at).slice(0, 10) : '';
    const d = nd ? daysUntil(nd) : null;
    const act = c.lead_id
      ? '<button class="btn btn-ghost btn-sm" onclick="openCompany(\'' + c.lead_id + '\')">看線索</button>'
      : (!c.owner_id ? '<button class="btn btn-secondary btn-sm" onclick="ccClaim(\'' + c.id + '\')">認領</button>' : '');
    const notes = [c.note ? '📋 ' + c.note : '', c.sales_note ? '✍️ ' + c.sales_note : ''].filter(Boolean).join('　');
    h += '<tr>'
      + '<td>' + (ccGradeBadge(c.grade) || '<span style="color:var(--text3)">—</span>') + '</td>'
      + '<td style="cursor:pointer;font-weight:500" onclick="openCcDetail(\'' + c.id + '\')">' + esc(c.company || '')
        + (c.contact_name ? '<div style="font-size:11.5px;color:var(--text3);font-weight:400">' + esc(c.contact_name) + '</div>' : '') + '</td>'
      + '<td style="font-size:12px;color:var(--text2);max-width:280px"><div style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden" title="' + esc(notes) + '">' + esc(notes) + '</div></td>'

  ]);

  window._ccLogs = lR.data || [];
  window._ccCards = cR.data || [];
  content.innerHTML = '<div class="cp-card" style="max-width:980px">'
    + '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">'
    +   '<div class="form-group" style="margin:0"><label class="form-label">月份</label><input class="form-input" id="csMonth" type="month" value="' + ym + '" onchange="runCcStats()"></div>'

    + '</div><div id="csResult"></div></div>';

}

function runCcStats() {
  const el = document.getElementById('csResult');
  if (!el) return;
  const ym = document.getElementById('csMonth')?.value || '';
  let logs = window._ccLogs || [];
  if (ym) logs = logs.filter(function (l) { return String(l.called_at || '').slice(0, 7) === ym; });
  if (!window.isAdmin) logs = logs.filter(function (l) { return l.user_id === currentUser.id; });
  if (!logs.length) { el.innerHTML = '<div class="empty-state" style="padding:24px"><div class="empty-text">這段期間沒有撥打紀錄</div></div>'; return; }
  const cards = {}; (window._ccCards || []).forEach(function (c) { cards[c.id] = c; });
  const by = {};
  logs.forEach(function (l) {
    const k = l.user_id || '_';
    if (!by[k]) by[k] = { name: l.user_name || userNameById(l.user_id, '') || '未知', calls: 0, conn: 0, interested: 0, outs: {} };
    const o = CC_OUTCOMES[l.outcome] || {};
    by[k].calls += 1;
    if (o.connected) by[k].conn += 1;
    if (l.outcome === 'interested') by[k].interested += 1;
    by[k].outs[l.outcome] = (by[k].outs[l.outcome] || 0) + 1;
  });
  // 轉線索數：以名單目前狀態計，歸給名單負責人
  const convBy = {};
  (window._ccCards || []).forEach(function (c) { if (c.lead_id) convBy[c.owner_id || '_'] = (convBy[c.owner_id || '_'] || 0) + 1; });
  const R = 'style="text-align:right;font-family:var(--mono)"';
  const rows = Object.keys(by).sort(function (a, b) { return by[b].calls - by[a].calls; });
  let h = '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>業務</th><th style="text-align:right">撥打</th><th style="text-align:right">接通</th><th style="text-align:right">接通率</th><th style="text-align:right">有興趣</th><th style="text-align:right">轉線索</th></tr></thead><tbody>';
  let tc = 0, tn = 0, ti = 0, tv = 0;
  rows.forEach(function (k) {
    const s = by[k];
    const conv = convBy[k] || 0;
    tc += s.calls; tn += s.conn; ti += s.interested; tv += conv;
    h += '<tr><td style="font-weight:500">' + esc(s.name) + '</td>'
      + '<td ' + R + '>' + s.calls + '</td><td ' + R + '>' + s.conn + '</td>'
      + '<td ' + R + '>' + (s.calls ? Math.round(s.conn / s.calls * 100) : 0) + '%</td>'
      + '<td ' + R + '>' + s.interested + '</td><td ' + R + '>' + conv + '</td></tr>';
  });
  h += '<tr style="border-top:2px solid var(--border)"><td style="font-weight:600">合計</td>'
    + '<td ' + R + '><b>' + tc + '</b></td><td ' + R + '><b>' + tn + '</b></td>'
    + '<td ' + R + '><b>' + (tc ? Math.round(tn / tc * 100) : 0) + '%</b></td>'
    + '<td ' + R + '><b>' + ti + '</b></td><td ' + R + '><b>' + tv + '</b></td></tr></tbody></table></div>';
  // 結果分布
  const dist = {};
  logs.forEach(function (l) { dist[l.outcome] = (dist[l.outcome] || 0) + 1; });
  const max = Math.max.apply(null, Object.values(dist));
  let d = '<div class="form-label" style="margin:16px 0 6px">撥打結果分布</div>';
  Object.keys(CC_OUTCOMES).forEach(function (k) {
    const n = dist[k] || 0;
    if (!n) return;
    const o = CC_OUTCOMES[k];
    d += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'
      + '<div style="width:100px;font-size:12.5px">' + o.icon + ' ' + o.label + '</div>'
      + '<div style="flex:1;height:16px;background:var(--bg4);border-radius:4px;overflow:hidden"><div style="height:100%;width:' + Math.round(n / max * 100) + '%;background:' + o.color + ';opacity:.7"></div></div>'
      + '<div style="width:70px;text-align:right;font-size:12.5px;font-family:var(--mono)">' + n + '（' + Math.round(n / logs.length * 100) + '%）</div></div>';
  });
  // 排行榜（積分）
  let board = '';
  if (window.isAdmin) {
    const pts = {};
    logs.forEach(function (l) {
      const k = l.user_id || '_';
      if (!pts[k]) pts[k] = { name: l.user_name || userNameById(l.user_id, '') || '未知', p: 0, calls: 0, hot: 0 };
      pts[k].p += ccLogPoints(l); pts[k].calls += 1;
      if (l.outcome === 'interested') pts[k].hot += 1;
    });
    (window._ccCards || []).forEach(function (c) { if (c.lead_id && pts[c.owner_id]) pts[c.owner_id].p += CC_POINTS.converted; });
    const arr = Object.values(pts).sort(function (a, b) { return b.p - a.p; });
    const medals = ['🥇', '🥈', '🥉'];
    board = '<div class="form-label" style="margin:18px 0 6px">🏆 積分排行榜</div>'
      + arr.map(function (x, i) {
        const r = ccRankOf(x.p);
        return '<div class="cc-rank"><div class="cc-medal">' + (medals[i] || (i + 1)) + '</div>'
          + '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">' + esc(x.name) + ' <span style="font-weight:400;color:var(--text3)">' + r[2] + ' ' + r[1] + '</span></div>'
          + '<div style="font-size:11.5px;color:var(--text3)">' + x.calls + ' 通・' + x.hot + ' 有興趣</div></div>'
          + '<div style="font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent)">' + x.p + '</div></div>';
      }).join('')
      + '<div style="font-size:11.5px;color:var(--text3);margin-top:8px">計分：撥打 +' + CC_POINTS.call + '・接通 +' + CC_POINTS.connected + '・有興趣 +' + CC_POINTS.interested + '・轉線索 +' + CC_POINTS.converted + '</div>';
  } else {
    const myPts = logs.reduce(function (s, l) { return s + ccLogPoints(l); }, 0);
    const conv = (window._ccCards || []).filter(function (c) { return c.lead_id && c.owner_id === currentUser.id; }).length;
    const total = myPts + conv * CC_POINTS.converted;
    const r = ccRankOf(total);
    board = '<div style="margin-top:18px;padding:14px;background:var(--bg3);border-radius:10px;display:flex;align-items:center;gap:14px">'
      + '<div style="font-size:30px">' + r[2] + '</div>'
      + '<div style="flex:1"><div style="font-size:14px;font-weight:700">' + r[1] + '</div>'
      + '<div style="font-size:11.5px;color:var(--text3)">撥打 +' + CC_POINTS.call + '・接通 +' + CC_POINTS.connected + '・有興趣 +' + CC_POINTS.interested + '・轉線索 +' + CC_POINTS.converted + '</div></div>'
      + '<div style="font-family:var(--mono);font-weight:800;font-size:22px;color:var(--accent)">' + total + '</div></div>';
  }
  el.innerHTML = h + d + board + (window.isAdmin ? '' : '<div style="font-size:12px;color:var(--text3);margin-top:10px">僅顯示你本人的紀錄</div>');
}

function ccSplitLine(line) {
  if (line.indexOf('\t') >= 0) return line.split('\t');
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (ch === ',' && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function ccRowsFromGrid(grid) {
  if (!grid.length) return [];
  const head = grid[0].map(function (x) { return String(x || '').trim(); });
  const mapped = head.map(ccDetectCol);
  const hasHeader = mapped.filter(Boolean).length >= 2;
  const cols = hasHeader ? mapped : ['company', 'phone', 'contact_name', 'industry', 'note'];
  const body = hasHeader ? grid.slice(1) : grid;
  const out = [];
  body.forEach(function (r) {
    const o = {};
    cols.forEach(function (f, i) { if (f && r[i] != null && String(r[i]).trim()) o[f] = String(r[i]).trim(); });
    if (o.company || o.phone) out.push(o);
  });
  return out;
}

  ccPasteRows = ccRowsFromGrid(lines.map(ccSplitLine));

}

async function ccDoImport() {
  if (ccBusy) return;
  const mode = window._ccImpMode || 'paste';
  let rows = [];
  if (mode === 'one') {
    const company = document.getElementById('co1Company').value.trim();
    const phone = document.getElementById('co1Phone').value.trim();
    if (!company) { toast('請填公司名稱', 'error'); return; }
    rows = [{ company: company, phone: phone, contact_name: document.getElementById('co1Contact').value.trim(), industry: document.getElementById('co1Industry').value.trim(), grade: document.getElementById('co1Grade').value, note: document.getElementById('co1Note').value.trim() }];
  } else {
    rows = ccPasteRows || [];
    if (!rows.length) { toast('沒有辨識到任何資料', 'error'); return; }
  }
  ccBusy = true;
  try {
    const batch = document.getElementById('ccBatch').value.trim() || null;
    const defSrc = document.getElementById('ccSrc').value.trim() || null;
    const mineOnly = document.getElementById('ccClaimMine').checked;
    const myName = userNameById(currentUser.id, currentUser.user_metadata?.full_name || currentUser.email || '');
    // 既有資料：陌開名單、線索、客戶
    const [ccR, ldR, acR] = await Promise.all([
      db.from('cold_calls').select('company,phone'),
      db.from('leads').select('name'),
      db.from('accounts').select('name')
    ]);
    const phoneSet = new Set(), coSet = new Set();
    (ccR.data || []).forEach(function (c) { if (c.phone) phoneSet.add(ccDigits(c.phone)); if (c.company) coSet.add(ccNormCo(c.company)); });
    const knownSet = new Set();
    (ldR.data || []).concat(acR.data || []).forEach(function (x) { if (x.name) knownSet.add(ccNormCo(x.name)); });
    const now = new Date().toISOString();
    const seen = new Set();
    const toInsert = [];
    let dupCc = 0, dupKnown = 0, dupSelf = 0;
    rows.forEach(function (r) {
      const ph = ccDigits(r.phone);
      const co = ccNormCo(r.company);
      const key = ph || co;
      if (!key) return;
      if (seen.has(key)) { dupSelf++; return; }
      seen.add(key);
      if ((ph && phoneSet.has(ph)) || (co && coSet.has(co))) { dupCc++; return; }
      if (co && knownSet.has(co)) { dupKnown++; return; }
      toInsert.push({
        company: r.company || '（未填公司）', phone: r.phone || null,
        contact_name: r.contact_name || null, title: r.title || null,
        industry: r.industry || null, city: r.city || null,
        email: r.email || null, source: r.source || defSrc, note: r.note || null,
        grade: (function () { const g = String(r.grade || '').trim().toUpperCase().charAt(0); return CC_GRADES[g] ? g : null; })(),
        batch: batch, status: 'new', attempts: 0,
        owner_id: mineOnly ? currentUser.id : null,
        owner_name: mineOnly ? myName : null,
        created_by: currentUser.id, created_at: now, updated_at: now
      });
    });
    if (!toInsert.length) {
      toast('沒有新名單可加入（重複 ' + (dupCc + dupKnown + dupSelf) + ' 筆）', 'error');
      return;
    }
    for (let i = 0; i < toInsert.length; i += 200) {
      const { error } = await db.from('cold_calls').insert(toInsert.slice(i, i + 200));
      if (error) { toast('匯入失敗：' + error.message + '（是否已執行 v5 SQL？）', 'error'); return; }
    }
    closeModal();
    const skipped = [];
    if (dupCc) skipped.push('名單裡已有 ' + dupCc);
    if (dupKnown) skipped.push('已是線索／客戶 ' + dupKnown);
    if (dupSelf) skipped.push('這批自己重複 ' + dupSelf);
    toast('✅ 加入 ' + toInsert.length + ' 筆' + (skipped.length ? '，略過：' + skipped.join('、') : ''), 'success');
    if (currentPage === 'coldcall') renderColdCall(); else navigate('coldcall');
  } finally { ccBusy = false; }
}

async function crmApi(method, path, body) {
  const s = (await db.auth.getSession()).data.session;
  if (!s) throw new Error('登入已過期，請重新整理');
  const r = await fetch(path, { method: method, headers: { 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json', 'X-Client': 'crm' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function leadMatches(l, q) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return true;
  const qd = q.replace(/\D/g, '');
  if ((l.name || '').toLowerCase().includes(q) || (l.company || '').toLowerCase().includes(q) || (l.user_name || '').toLowerCase().includes(q)) return true;
  if (l.tax_id && qd.length >= 3 && String(l.tax_id).includes(qd)) return true;
  return (l.contacts || []).some(function (c) {
    return (c.name || '').toLowerCase().includes(q) || (qd.length >= 4 && String(c.phone || '').replace(/\D/g, '').includes(qd));
  });
}

let mlScope = null, mlStage = 'open', mlQuery = '', mlLimit = 40;
function mlDue(l) {
  if (!l.next_contact_date) return { cls: '', txt: '', rank: 2 };
  const d = daysUntil(String(l.next_contact_date).slice(0, 10));
  if (d < 0) return { cls: 'late', txt: '逾期 ' + (-d) + ' 天', rank: 0, d: d };
  if (d === 0) return { cls: 'today', txt: '今天聯絡', rank: 0, d: d };
  return { cls: '', txt: '📅 ' + String(l.next_contact_date).slice(5, 10).replace('-', '/'), rank: 1, d: d };
}
function renderLeadsMobile() {
  if (currentPage !== 'leads') return;
  const content = document.getElementById('content');
  content.style.padding = ''; content.style.overflowX = '';
  if (mlScope === null) mlScope = (!window.isAdmin && leadsData.some(function (l) { return l.user_id === currentUser.id; })) ? 'mine' : 'all';
  const closed = stagesData.find(function (s) { return s.name === '結案'; });
  const isOpen = function (l) { return !convertedLeadIds.has(l.id) && (!closed || l.stage_id !== closed.id); };
  const inScope = function (l) { return mlScope === 'all' ? true : mlScope === 'mine' ? l.user_id === currentUser.id : !l.user_id; };
  const scoped = leadsData.filter(inScope);
  let list;
  if (mlQuery) list = leadsData.filter(function (l) { return leadMatches(l, mlQuery); });
  else if (mlStage === 'open') list = scoped.filter(isOpen);
  else if (mlStage === 'won') list = scoped.filter(function (l) { return convertedLeadIds.has(l.id); });
  else list = scoped.filter(function (l) { return l.stage_id === mlStage && !convertedLeadIds.has(l.id); });

const DEAL_FILE_MAX = 20 * 1024 * 1024;
let dealFilesCache = {};
async function loadDealFiles(ctIds) {
  if (!ctIds || !ctIds.length) return;
  const r = await db.from('deal_files').select('*').in('contract_id', ctIds).order('created_at', { ascending: false });
  if (r.error) return;
  ctIds.forEach(function (id) { dealFilesCache[id] = []; });
  (r.data || []).forEach(function (f) { (dealFilesCache[f.contract_id] = dealFilesCache[f.contract_id] || []).push(f); });
}
function dealFilesBadge(ctId) {
  const fs = dealFilesCache[ctId];
  if (!fs) return '';
  return fs.length ? '<span class="badge badge-blue">📎 ' + fs.length + '</span>' : '<span class="df-miss">未附回簽</span>';
}
function dealFilesListHtml(ctId, accId) {
  const fs = dealFilesCache[ctId] || [];
  if (!fs.length) return '<div style="font-size:12px;color:var(--text3)">還沒有檔案。可以直接上傳，或在 ChatGPT 丟檔案給 SaleFlow 助理。</div>';
  return fs.map(function (f) {
    const canDel = window.isAdmin || f.uploaded_by === currentUser.id;
    const ico = /pdf/.test(f.mime || '') ? '📄' : '🖼';
    return '<div class="df-file"><span>' + ico + '</span>'
      + '<span class="nm" onclick="openDealFile(\'' + f.id + '\')">' + esc(f.file_name) + '</span>'
      + '<span class="mt">' + esc(f.kind || '') + '・' + fmtDate(f.created_at) + (f.source === 'ai' ? '・AI' : '') + '</span>'
      + (canDel ? '<button class="btn btn-ghost btn-sm" style="padding:1px 6px" onclick="deleteDealFile(\'' + f.id + '\',\'' + ctId + '\',\'' + accId + '\')">🗑</button>' : '')
      + '</div>';
  }).join('');
}
function pickDealFiles(ctId, accId) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = 'application/pdf,image/*';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  inp.onchange = function () { const fs = Array.from(inp.files || []); inp.remove(); uploadDealFiles(ctId, accId, fs); };
  inp.click();
}
// 從客戶層級上傳：只有一張成交單就直接選檔，多張先選要放哪一張
async function pickDealFilesForAccount(accId) {
  let cts = (window._cp && window._cp.acc && window._cp.acc.id === accId && window._cp.contracts) || ((accountsData.find(function (a) { return a.id === accId; }) || {}).contracts) || null;
  if (!cts) { const r = await db.from('contracts').select('*').eq('account_id', accId); cts = r.data || []; }
  if (!cts.length) { toast('這家還沒有成交單，先建立成交單再上傳回簽', 'error'); return; }
  cts = cts.slice().sort(function (a, b) { return dealDate(b).localeCompare(dealDate(a)); });
  if (cts.length === 1) { pickDealFiles(cts[0].id, accId); return; }
  openModal('回簽檔要放哪張成交單？', cts.map(function (c) {
    return '<button class="btn btn-secondary" style="width:100%;justify-content:space-between;margin-bottom:8px" onclick="closeModal();pickDealFiles(\'' + c.id + '\',\'' + accId + '\')"><span>' + esc(c.name || '成交') + '</span><span style="font-size:12px;color:var(--text3)">' + esc(dealDate(c)) + '</span></button>';
  }).join(''), [{ label: '取消', cls: 'btn-secondary', action: closeModal }]);
}
function accMissingSigned(a) {
  const cts = (a && a.contracts) || [];
  return cts.length > 0 && cts.every(function (c) { return dealFilesCache[c.id] && !dealFilesCache[c.id].length; });
}
function dealFileMime(f) {
  if (f.type) return f.type;
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  return ({ pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic', heif: 'image/heif', webp: 'image/webp' })[ext] || 'application/octet-stream';
}
async function uploadDealFiles(ctId, accId, files) {
  if (!files.length) return;
  const acc = accountsData.find(function (a) { return a.id === accId; }) || (window._cp && window._cp.acc);
  const leadId = (acc && acc.lead_id) || (window._cp && window._cp.lead && window._cp.lead.id) || null;
  let ok = 0;
  for (const f of files) {
    if (f.size > DEAL_FILE_MAX) { toast(f.name + ' 超過 20MB', 'error'); continue; }
    const mime = dealFileMime(f);
    if (!/^(application\/pdf|image\/)/.test(mime)) { toast(f.name + '：只收 PDF 或照片', 'error'); continue; }
    const ext = (f.name.match(/\.([A-Za-z0-9]{1,6})$/) || [, mime === 'application/pdf' ? 'pdf' : 'jpg'])[1].toLowerCase();
    const path = ctId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    toast('上傳中：' + f.name, 'info');
    const up = await db.storage.from('deal-files').upload(path, f, { contentType: mime, upsert: false });
    if (up.error) { toast('上傳失敗：' + up.error.message, 'error'); continue; }
    const ins = await db.from('deal_files').insert({
      contract_id: ctId, lead_id: leadId, kind: '回簽報價單', file_name: f.name.slice(0, 120), path: path, mime: mime, size: f.size,
      uploaded_by: currentUser.id, uploaded_by_name: window.userProfile?.full_name || currentUser.email || '', source: 'crm'
    });
    if (ins.error) { await db.storage.from('deal-files').remove([path]); toast('存檔失敗：' + ins.error.message, 'error'); continue; }
    ok++;
  }
  if (!ok) return;
  toast('已上傳 ' + ok + ' 個檔案', 'success');
  await loadDealFiles([ctId]);
  if (currentPage === 'company') { await refreshCompany(); const b = document.getElementById('ct-body-' + ctId); if (b) b.style.display = 'block'; }
  else if (currentPage === 'accounts') renderAccountsList(accountsData, true);
  else { const el = document.getElementById('ct-files-' + ctId); if (el) el.innerHTML = dealFilesListHtml(ctId, accId); }
}
async function openDealFile(fileId) {
  let f = null;
  Object.keys(dealFilesCache).forEach(function (k) { (dealFilesCache[k] || []).forEach(function (x) { if (x.id === fileId) f = x; }); });
  if (!f) return;
  const w = window.open('', '_blank');
  const r = await db.storage.from('deal-files').createSignedUrl(f.path, 600);
  if (r.error || !r.data) { if (w) w.close(); toast('開啟失敗：' + (r.error ? r.error.message : ''), 'error'); return; }
  if (w) w.location.href = r.data.signedUrl; else location.href = r.data.signedUrl;
}
async function deleteDealFile(fileId, ctId, accId) {
  const f = (dealFilesCache[ctId] || []).find(function (x) { return x.id === fileId; });
  if (!f) return;
  openConfirm('刪除檔案', '確定刪除「' + esc(f.file_name) + '」？', async function () {
    closeModal();
    const d = await db.from('deal_files').delete().eq('id', fileId);
    if (d.error) { toast('刪除失敗：' + d.error.message, 'error'); return; }
    await db.storage.from('deal-files').remove([f.path]);
    await loadDealFiles([ctId]);
    const el = document.getElementById('ct-files-' + ctId); if (el) el.innerHTML = dealFilesListHtml(ctId, accId);
    toast('已刪除', 'success');
  }, closeModal, '刪除', '取消');
}

async function runLostReport() {
  const el = document.getElementById('lostResult'); if (!el) return;
  const rg = document.getElementById('lostRange').value;
  let qy = db.from('leads').select('id,name,user_id,user_name,lost_reason,lost_at').not('lost_reason', 'is', null);
  if (rg === '90') qy = qy.gte('lost_at', new Date(Date.now() - 90 * 86400000).toISOString());
  else if (rg === 'year') qy = qy.gte('lost_at', new Date(new Date().getFullYear(), 0, 1).toISOString());
  const { data, error } = await qy.order('lost_at', { ascending: false });
  if (error) { el.innerHTML = '<div style="color:var(--red);font-size:13px">讀取失敗：' + esc(error.message) + '（需要先執行 v4 SQL）</div>'; return; }
  let rows = data || [];
  if (!window.isAdmin) rows = rows.filter(function (r) { return r.user_id === currentUser.id; });
  if (!rows.length) { el.innerHTML = '<div class="empty-state" style="padding:24px"><div class="empty-text">這段期間沒有記錄結案原因的線索</div></div>'; return; }
  const cnt = {};
  rows.forEach(function (r) { const k = String(r.lost_reason).split('：')[0]; cnt[k] = (cnt[k] || 0) + 1; });
  const max = Math.max.apply(null, Object.values(cnt));
  let h = '<div style="margin-bottom:16px">';
  Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; }).forEach(function (k) {
    h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div style="width:84px;font-size:12.5px">' + esc(k) + '</div>'
      + '<div style="flex:1;height:16px;background:var(--bg4);border-radius:4px;overflow:hidden"><div style="height:100%;width:' + Math.round(cnt[k] / max * 100) + '%;background:var(--red);opacity:.7"></div></div>'
      + '<div style="width:70px;text-align:right;font-size:12.5px;font-family:var(--mono)">' + cnt[k] + '（' + Math.round(cnt[k] / rows.length * 100) + '%）</div></div>';
  });
  h += '</div><div class="form-label" style="margin-bottom:6px">明細（' + rows.length + ' 筆）</div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>公司</th><th>原因</th><th>業務</th><th>結案日</th></tr></thead><tbody>';
  rows.forEach(function (r) { h += '<tr style="cursor:pointer" onclick="openCompany(\'' + r.id + '\')"><td>' + esc(r.name) + '</td><td style="font-size:12.5px">' + esc(r.lost_reason) + '</td><td style="font-size:12px">' + esc(r.user_name || '') + '</td><td style="font-size:12px">' + fmtDate(r.lost_at) + '</td></tr>'; });
  el.innerHTML = h + '</tbody></table></div>';
}

async function renderDashboard() {
  const [leadsRes, accsRes, contractsRes, activitiesRes] = await Promise.all([
    db.from('leads').select('*'),
    db.from('accounts').select('*'),
    db.from('contracts').select('*'),
    db.from('activities').select('id,created_at,lead_id')
  ]);
  leadsData = leadsRes.data || [];
  accountsData = accsRes.data || [];
  const contracts = contractsRes.data || [];
  const allActivities = activitiesRes.data || [];

  // Build user filter options
  const userMap3 = {};
  leadsData.forEach(l => { if (l.user_id && l.user_name) userMap3[l.user_id] = l.user_name; });
  const dashUserOpts = [{val:'all',label:'全部業務'}, ...Object.entries(userMap3).map(([id,nm])=>({val:id,label:nm}))];
  let dashSelHtml = '<select class="form-select" style="width:auto;height:32px;font-size:13px" onchange="dashFilterUser=this.value;renderDashboard()">';
  dashUserOpts.forEach(function(o) { dashSelHtml += '<option value="' + o.val + '"' + (o.val === dashFilterUser ? ' selected' : '') + '>' + o.label + '</option>'; });
  dashSelHtml += '</select>';
  document.getElementById('topbarActions').innerHTML = '<div class="action-bar">' + dashSelHtml + '<button class="btn btn-secondary btn-sm" onclick="openBonusCalc()">💰 業績獎金</button></div>';

  // Filter data by selected user
  const filtLeads = dashFilterUser==='all' ? leadsData : leadsData.filter(l=>l.user_id===dashFilterUser);
  const filtAccounts = dashFilterUser==='all' ? accountsData : accountsData.filter(a=>a.user_id===dashFilterUser);
  const filtLeadIds = new Set(filtLeads.map(l=>l.id));
  const filtActivities = dashFilterUser==='all' ? allActivities : allActivities.filter(a=>filtLeadIds.has(a.lead_id));

  const today = new Date();
  const in30 = new Date(today); in30.setDate(today.getDate() + 30);

  // 本月統計 (use filtered data)
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const thisMonthLeads = filtLeads.filter(l => new Date(l.created_at) >= monthStart);
  const thisMonthActivities = filtActivities.filter(a => new Date(a.created_at) >= monthStart);
  const thisMonthAccounts = filtAccounts.filter(a => new Date(a.created_at) >= monthStart);

  // 今年至今統計
  const yearStart = new Date(today.getFullYear(), 0, 1);
  const thisYearLeads = filtLeads.filter(l => new Date(l.created_at) >= yearStart);
  const thisYearActivities = filtActivities.filter(a => new Date(a.created_at) >= yearStart);
  const thisYearAccounts = filtAccounts.filter(a => new Date(a.created_at) >= yearStart);
  const thisYearContracts = contracts.filter(c => dealDate(c) >= today.getFullYear() + '-01-01');
  const thisYearRevenue = thisYearContracts.reduce((s,c) => s+(c.amount||0), 0);

  const activeLeads = filtLeads.filter(l => !['暫停','結案'].includes(getStageName(l.stage_id)));
  const wonLeads = filtLeads.filter(l => getStageName(l.stage_id) === '簽約進件');
  const expiring = contracts.filter(c => {
    if (!c.end_date) return false;
    const d = daysUntil(c.end_date);
    return d >= 0 && d <= (c.remind_days != null ? c.remind_days : 30);
  }).sort((a,b) => a.end_date.localeCompare(b.end_date));

  // Stage funnel
  const funnelStages = stagesData.filter(s => !['暫停','結案'].includes(s.name));
  const funnelData = funnelStages.map(s => ({
    name: s.name,
    count: filtLeads.filter(l => l.stage_id === s.id).length
  }));
  const maxCount = Math.max(...funnelData.map(f => f.count), 1);

  const content = document.getElementById('content');

    <div style="margin-bottom:8px;font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.05em">本月動態</div>
    <div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-card" style="border-left:3px solid var(--accent)">
        <div class="stat-label">本月新增 Leads</div>
        <div class="stat-value stat-accent">${thisMonthLeads.length}</div>
        <div class="stat-sub">共 ${leadsData.length} 筆</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--green)">
        <div class="stat-label">本月聯繫活動</div>
        <div class="stat-value stat-green">${thisMonthActivities.length}</div>
        <div class="stat-sub">活動記錄次數</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--yellow)">
        <div class="stat-label">本月新進件</div>
        <div class="stat-value" style="color:var(--yellow)">${thisMonthAccounts.length}</div>
        <div class="stat-sub">轉換為客戶</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--red)">
        <div class="stat-label">即將續約</div>
        <div class="stat-value stat-${expiring.length>0?'red':'green'}">${expiring.length}</div>
        <div class="stat-sub">已進入提醒期</div>
      </div>
    </div>
    <div style="margin-bottom:8px;font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.05em">今年至今（${today.getFullYear()}）</div>
    <div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-card" style="border-left:3px solid var(--accent)">
        <div class="stat-label">新增 Leads</div>
        <div class="stat-value stat-accent">${thisYearLeads.length}</div>
        <div class="stat-sub">今年共開發</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--green)">
        <div class="stat-label">聯繫活動</div>
        <div class="stat-value stat-green">${thisYearActivities.length}</div>
        <div class="stat-sub">今年活動次數</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--yellow)">
        <div class="stat-label">新進件</div>
        <div class="stat-value" style="color:var(--yellow)">${thisYearAccounts.length}</div>
        <div class="stat-sub">今年轉換客戶</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--purple,#a78bfa)">
        <div class="stat-label">合約金額</div>
        <div class="stat-value" style="color:var(--purple,#a78bfa);font-size:18px">${thisYearRevenue>0?'$'+fmtNum(thisYearRevenue):'—'}</div>
        <div class="stat-sub">今年成交總額（依簽約日）</div>
      </div>
    </div>
    <div style="margin-bottom:8px;font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.05em">累積總覽</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">進行中 Leads</div>
        <div class="stat-value stat-accent">${activeLeads.length}</div>
        <div class="stat-sub">共 ${filtLeads.length} 筆</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">轉換客戶</div>
        <div class="stat-value stat-green">${filtAccounts.length}</div>
        <div class="stat-sub">累積成交</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">合約總數</div>
        <div class="stat-value">${contracts.length}</div>
        <div class="stat-sub">合約管理</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">進行中 / 總 Lead</div>
        <div class="stat-value">${filtLeads.length?Math.round(activeLeads.length/filtLeads.length*100):0}%</div>
        <div class="stat-sub">活躍比例</div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">📊 開發漏斗</div>
        <div class="funnel" id="funnelChart"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">⏰ 續約提醒</div>
        <div class="reminder-list" id="reminderList"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">📅 近期需聯絡</div>
        <div id="nextContactList"></div>

        <div id="dueList"></div>
      </div>

  // Render funnel
  const funnelEl = document.getElementById('funnelChart');
  if (funnelData.every(f => f.count === 0)) {
    funnelEl.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-text">尚無 Leads 資料</div></div>';
  } else {
    funnelEl.innerHTML = funnelData.map((f,i) => `
      <div class="funnel-row">
        <div class="funnel-label">${f.name}</div>
        <div class="funnel-bar-wrap">
          <div class="funnel-bar" style="width:${Math.max(f.count/maxCount*100,4)}%;background:${stagesData[i]?.color||'var(--accent)'}">
            ${f.count > 0 ? f.count : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  // Render reminders
  const reminderEl = document.getElementById('reminderList');
  if (expiring.length === 0) {
    reminderEl.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-icon">✅</div><div class="empty-text">近期無需續約的客戶</div></div>';
  } else {
    reminderEl.innerHTML = expiring.slice(0,8).map(function (c) {

      const color = days <= 7 ? 'var(--red)' : days <= 14 ? 'var(--yellow)' : 'var(--green)';
      const accNm = (accountsData.find(a => a.id === c.account_id) || {}).name || '';
      return '<div class="reminder-item" style="cursor:pointer" onclick="goToAccount(\'' + c.account_id + '\')">'

    const rows = [];
    contracts.forEach(function (c) {
      const uid = c.sales_user_id || c.user_id;

      dealInstallments(c).forEach(function (p, i) {

    });
    rows.sort(function (a, b) { return a.d - b.d; });
    dueEl.innerHTML = rows.length ? rows.slice(0, 10).map(function (r) {
      const accNm = (accountsData.find(a => a.id === r.c.account_id) || {}).name || '';

      return '<div class="reminder-item" style="cursor:pointer" onclick="goToAccount(\'' + r.c.account_id + '\')">'

        + '<div class="reminder-name">' + esc(accNm) + ' · ' + esc(r.p.label || '') + ' <span style="font-family:var(--mono)">$' + fmtNum(r.p.amount) + '</span></div>'
        + '<div class="reminder-days" style="color:' + color + '">' + (r.d < 0 ? '逾期 ' + (-r.d) + ' 天' : (r.d === 0 ? '今天' : r.d + ' 天後')) + '</div>'
        + (window.isAdmin ? '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="event.stopPropagation();confirmPayment(\'' + r.c.id + '\',' + r.i + ',null)">收款</button>' : '')
        + '</div>';
    }).join('') : '<div style="font-size:13px;color:var(--text3);padding:8px 0">沒有逾期或近期待收的款項</div>';
  }

  // Render next contact list
  const nextContactEl = document.getElementById('nextContactList');
  if (nextContactEl) {
    const upcoming = filtLeads
      .filter(l => l.next_contact_date)
      .sort((a,b) => new Date(a.next_contact_date) - new Date(b.next_contact_date))
      .slice(0, 10);
    if (!upcoming.length) {
      nextContactEl.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:8px 0">無待聯絡的 Lead</div>';
    } else {
      nextContactEl.innerHTML = upcoming.map(l => {
        const d = new Date(l.next_contact_date);
        const isOverdue = d < today;
        const diffDays = Math.ceil((d - today) / 86400000);
        const label = isOverdue ? '已過期 '+Math.abs(diffDays)+'天' : diffDays === 0 ? '今天' : diffDays+'天後';
        const color = isOverdue ? 'var(--red)' : diffDays <= 3 ? 'var(--yellow)' : 'var(--text3)';
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="navigate(\'leads\');setTimeout(()=>openLeadDrawer(\''+l.id+'\'),400)">'
          + '<div><div style="font-size:13px;font-weight:500">'+esc(l.name)+'</div>'
          + '<div style="font-size:11.5px;color:var(--text3)">'+new Date(l.next_contact_date).toLocaleDateString('zh-TW')+(l.user_name?' · '+esc(l.user_name):'')+'</div></div>'
          + '<div style="font-size:12px;font-weight:600;color:'+color+'">'+label+'</div>'
          + '</div>';
      }).join('');
    }
  }
}

async function renderLeads() {
  await loadGlobalData();
  // Fetch leads without sort_order dependency (sort in JS to avoid NULL issues)
  const { data } = await db.from('leads').select('*, contacts(id,name,phone)').order('created_at', {ascending:true});
  leadsData = (data || []).sort((a,b) => (a.sort_order ?? 999999) - (b.sort_order ?? 999999));

  // Load which leads have been converted to accounts
  const { data: accounts } = await db.from('accounts').select('lead_id').not('lead_id', 'is', null);
  convertedLeadIds = new Set((accounts||[]).map(a => a.lead_id));

  // usersData already loaded from loadGlobalData() above - don't overwrite!
  // But add any users from leads that aren't in usersData yet (edge case)
  const seenIds = new Set(usersData.map(u => u.id));
  leadsData.filter(l=>l.user_id&&l.user_name&&!seenIds.has(l.user_id)).forEach(l => {
    usersData.push({ id: l.user_id, full_name: l.user_name, role: 'sales', email: '' });
    seenIds.add(l.user_id);
  });

  if (currentPage !== 'leads') return;
  document.getElementById('topbarActions').innerHTML = `
    <div class="action-bar">
      <div class="view-toggle">
        <button class="view-toggle-btn active">開發中</button>
        <button class="view-toggle-btn" onclick="navigate('accounts')">成交客戶</button>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="form-input search-input" id="leadSearch" placeholder="搜尋..." style="width:150px" oninput="filterLeads()">
      </div>
      <div class="view-toggle">
        <button class="view-toggle-btn ${leadsViewMode==='kanban'?'active':''}" onclick="setLeadsView('kanban')">🗂</button>
        <button class="view-toggle-btn ${leadsViewMode==='list'?'active':''}" onclick="setLeadsView('list')">☰</button>
      </div>
      <button class="btn btn-secondary btn-sm ${showConvertedLeads?'btn-primary':''}" onclick="toggleShowConverted()" data-tip="顯示/隱藏已轉客戶的 Lead" style="font-size:11px">🏢 ${showConvertedLeads?'含已轉':'僅進行中'}</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadImportTemplate()">📋</button>
      <button class="btn btn-secondary btn-sm" onclick="importLeadsExcel()">📥</button>
      <button class="btn btn-secondary btn-sm" onclick="exportLeadsExcel()">📤</button>
      <button class="btn btn-primary btn-sm" onclick="openNewLeadModal()">＋ Lead</button>
    </div>
  `;

  // Auto list-mode on mobile
  const isMobile = window.innerWidth <= 768;
  if (isMobile) { renderLeadsMobile(); return; }
  if (leadsViewMode === 'list') renderLeadsList();
  else renderKanban();

  const content = document.getElementById('content');
  content.style.padding = '16px';
  content.style.overflowX = 'auto';

  // Build filter bar
  const srcOptions = [{val:'all', label:'全部來源'}, ...sourcesData.map(s=>({val:s.id, label:s.name}))];
  const stageOptions = [{val:'all', label:'全部階段'}, ...stagesData.map(s=>({val:s.id, label:s.name}))];

  // Build user options from leads data
  const userMap = {};
  leadsData.forEach(l => { if (l.user_id && l.user_name) userMap[l.user_id] = l.user_name; });
  const userOptions = [{val:'all', label:'全部業務'}, ...Object.entries(userMap).map(([id,name])=>({val:id, label:name}))];

  content.innerHTML = `
    <div class="kanban-filters">
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('stage',this.value)">
        ${stageOptions.map(o=>`<option value="${o.val}"${kanbanFilterStage===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('user',this.value)">
        ${userOptions.map(o=>`<option value="${o.val}"${kanbanFilterUser===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('src',this.value)">
        ${srcOptions.map(o=>`<option value="${o.val}"${kanbanFilterSrc===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>
    <div id="kanban-board"></div>`;

  const board = document.getElementById('kanban-board');
  if (stagesData.length === 0) {
    board.innerHTML = '<div class="empty-state"><div>請先在設定中建立階段</div></div>';
    return;
  }

  const stagesToShow = kanbanFilterStage === 'all' ? stagesData : stagesData.filter(s => s.id === kanbanFilterStage);
  stagesToShow.forEach((stage, si) => {
    const stageIdx = stagesData.indexOf(stage);
    const stageleads = leadsData.filter(l => {
      if (l.stage_id !== stage.id) return false;
      if (!showConvertedLeads && !searchStr && convertedLeadIds.has(l.id)) return false;
      if (searchStr && !leadMatches(l, searchStr)) return false;
      if (kanbanFilterSrc !== 'all' && (l.source_id||'') !== kanbanFilterSrc) return false;
      if (kanbanFilterUser !== 'all' && (l.user_id||'') !== kanbanFilterUser) return false;
      return true;
    }).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    si = stageIdx;

    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.dataset.stageId = stage.id;
    col.innerHTML = `
      <div class="kanban-col-header">
        <div style="display:flex;align-items:center;gap:7px">
          <div class="col-accent" style="background:${stage.color||STAGE_COLORS[stageIdx]||'var(--accent)'}"></div>
          <div class="kanban-col-title">${stage.name}</div>
        </div>
        <div class="kanban-col-count">${stageleads.length}</div>
      </div>
      <div class="kanban-cards" id="col-${stage.id}"
        ondragover="colDragOver(event,this)"
        ondrop="colDrop(event,'${stage.id}')"
        ondragleave="colDragLeave(event,this)">
      </div>
      <button class="add-card-btn" onclick="openNewLeadModal('${stage.id}')">＋ 新增</button>
    `;
    board.appendChild(col);

    const cardsEl = col.querySelector('.kanban-cards');
    if (stageleads.length === 0) {
      cardsEl.innerHTML = '<div style="height:40px"></div>';
    } else {
      stageleads.forEach(lead => {
        const card = createKanbanCard(lead);
        cardsEl.appendChild(card);
      });
    }
  });
}

function setKanbanFilter(type, val) {
  if (type === 'prio') kanbanFilterPrio = val;
  else if (type === 'src') kanbanFilterSrc = val;
  else if (type === 'stage') kanbanFilterStage = val;
  else if (type === 'user') kanbanFilterUser = val;
  renderKanban(document.getElementById('leadSearch')?.value || '');
}

function createKanbanCard(lead) {
  const card = document.createElement('div');
  card.className = 'kanban-card';
  card.dataset.id = lead.id;
  card.draggable = true;
  const src = sourcesData.find(s => s.id === lead.source_id);
  card.innerHTML = `
    <div class="kc-name">${esc(lead.name)}${convertedLeadIds.has(lead.id) ? ' <span class="badge badge-green" style="font-size:10px;padding:1px 6px">已成交</span>' : ''}</div>
    ${lead.company ? `<div class="kc-company">👤 ${esc(lead.company)}</div>` : ''}
    ${lead.tax_id ? `<div style="font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">🏷 ${esc(lead.tax_id)}</div>` : ''}
    <div class="kc-meta">
      ${src ? `<div class="kc-tag">${esc(src.name)}</div>` : ''}
    </div>
    <div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:4px">
      ${ownerSelectHtml(lead)}
      <span style="font-size:10.5px;color:var(--text3)">${fmtDate(lead.created_at)}</span>
    </div>
  `;
  const ownSel = card.querySelector('.owner-sel');
  if (ownSel) { ownSel.draggable = false; ownSel.addEventListener('dragstart', e => { e.preventDefault(); e.stopPropagation(); }); }
  card.addEventListener('dragstart', e => {
    dragSrcId = lead.id;
    dragSrcEl = card;
    setTimeout(() => card.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    dragSrcId = null;
    dragSrcEl = null;
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    if (!dragSrcEl || dragSrcEl === card) return;
    const srcStage = dragSrcEl.closest('.kanban-col')?.dataset.stageId;
    const tgtStage = card.closest('.kanban-col')?.dataset.stageId;
    if (srcStage !== tgtStage) return;
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    const ph = document.createElement('div');
    ph.className = 'drag-placeholder';
    ph.style.cssText = 'height:3px;background:var(--accent);border-radius:2px;margin:2px 0;pointer-events:none';
    const rect = card.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) card.parentElement.insertBefore(ph, card);
    else card.parentElement.insertBefore(ph, card.nextSibling);
  });
  card.addEventListener('drop', async e => {
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    if (!dragSrcEl) return;
    const srcStage = dragSrcEl.closest('.kanban-col')?.dataset.stageId;
    const tgtStage = card.closest('.kanban-col')?.dataset.stageId;
    if (!tgtStage) return;
    if (srcStage === tgtStage && dragSrcEl !== card) {
      // Same col: insert based on mouse Y position
      const rect = card.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) card.parentElement.insertBefore(dragSrcEl, card);
      else card.parentElement.insertBefore(dragSrcEl, card.nextSibling);
      await saveColOrder(tgtStage);
    } else if (srcStage !== tgtStage) {
      // Cross-col: change stage
      const lead = leadsData.find(l => l.id === dragSrcId);
      if (lead) {
        lead.stage_id = tgtStage;
        await db.from('leads').update({ stage_id: tgtStage, updated_at: new Date().toISOString() }).eq('id', dragSrcId);
        toast('已移至「' + (stagesData.find(s=>s.id===tgtStage)?.name||'') + '」', 'success');
        afterStageChanged(lead.id, tgtStage);
        dragSrcId = null; dragSrcEl = null;
        renderKanban(document.getElementById('leadSearch')?.value || '');
        return;
      }
    }
    dragSrcId = null; dragSrcEl = null;
  });
  card.addEventListener('click', e => { if (e.target.closest('select,button,a,input')) return; openLeadDrawer(lead.id); });
  return card;
}

async function saveColOrder(stageId) {
  const colEl = document.getElementById('col-' + stageId);
  if (!colEl) return;
  const cards = colEl.querySelectorAll('.kanban-card');
  const updates = [];
  cards.forEach((c, i) => {
    const lead = leadsData.find(l => l.id === c.dataset.id);
    if (lead) { lead.sort_order = i; updates.push({id: c.dataset.id, sort_order: i}); }
  });
  for (const u of updates) {
    await db.from('leads').update({ sort_order: u.sort_order }).eq('id', u.id);
  }
}

  const userOpts = [{val:'all',label:'全部業務'}].concat(Object.entries(userMap2).map(function(e) { return {val:e[0], label:e[1]}; }));

  const sortOpts = [
    {val:'default',      label:'排序：看板順序'},

      <td onclick="event.stopPropagation()">

          ${stagesData.map(s=>`<option value="${s.id}"${s.id===l.stage_id?' selected':''}>${esc(s.name)}</option>`).join('')}

        <select class="form-select" style="padding:2px 4px;height:26px;font-size:11.5px;width:auto;max-width:100px" onchange="inlineUpdateLead('${l.id}','source_id',this.value)">

function toggleListSelect(id, checked) {

async function inlineUpdateLead(leadId, field, value) {
  const update = { updated_at: new Date().toISOString() };
  update[field] = value || null;
  await db.from('leads').update(update).eq('id', leadId);
  const lead = leadsData.find(l => l.id === leadId);
  if (lead) lead[field] = value || null;
  if (field === 'stage_id' && value) afterStageChanged(leadId, value);
}
async function batchUpdateField(field, selectId) {
  const val = document.getElementById(selectId)?.value;
  if (!val || !listSelectedIds.size) { toast('請先選擇選項', 'error'); return; }
  for (const id of listSelectedIds) {
    await db.from('leads').update({ [field]: val, updated_at: new Date().toISOString() }).eq('id', id);
    const l = leadsData.find(l=>l.id===id); if (l) l[field] = val;
  }
  toast('已批次更新 ' + listSelectedIds.size + ' 筆', 'success');
  listSelectedIds.clear();
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}


function colDragOver(e, el) {
  e.preventDefault();
  el.closest('.kanban-col').classList.add('drag-over-col');
}
function colDragLeave(e, el) {
  if (!el.contains(e.relatedTarget)) el.closest('.kanban-col').classList.remove('drag-over-col');
}
async function colDrop(e, stageId) {
  e.preventDefault();
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over-col'));
  if (!dragSrcId) return;
  const lead = leadsData.find(l => l.id == dragSrcId);
  if (!lead) return;
  const oldStage = stagesData.find(s => s.id === lead.stage_id);
  const newStage = stagesData.find(s => s.id === stageId);
  if (lead.stage_id === stageId) return;

  // Auto-convert check
  if (newStage?.name === '簽約進件' && !convertedLeadIds.has(lead.id)) {
    await updateLeadStage(lead, stageId);
    navigate('leads');
    openConvertModal(lead.id);
  } else {
    await updateLeadStage(lead, stageId);
    navigate('leads');
  }
}

async function updateLeadStage(lead, stageId) {
  await db.from('leads').update({ stage_id: stageId, updated_at: new Date().toISOString() }).eq('id', lead.id);
  lead.stage_id = stageId;
  toast(`已移至「${stagesData.find(s=>s.id===stageId)?.name}」`, 'success');
  if (getStageName(stageId) === '結案') setTimeout(function () { askLostReason(lead.id); }, 300);
}

async function convertToAccount(lead) {
  // 只負責建立 Account（不刪、不隱藏 Lead）；已存在就直接回傳既有的
  const { data: existing } = await db.from('accounts').select('*').eq('lead_id', lead.id).maybeSingle();
  if (existing) return existing;
  const { data: acc, error } = await db.from('accounts').insert({
    name: lead.name, company: lead.company || null, lead_id: lead.id,
    user_id: lead.user_id || currentUser.id,
    user_name: lead.user_name || currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '',
    created_at: new Date().toISOString()
  }).select().single();
  if (error) { toast('轉換失敗：' + error.message, 'error'); return null; }
  convertedLeadIds.add(lead.id);
  return acc;
}

const DEAL_CATEGORIES = ['主約', '加購專案', '客製案件', '續約', '其他'];
let _pendingAccountId = null;
let _dealBusy = false;
let _lastDealTpl = '';

function dealCatBadge(cat) {
  const c = cat || '主約';
  const cls = { '主約': 'badge-green', '加購專案': 'badge-blue', '客製案件': 'badge-purple', '續約': 'badge-yellow' }[c] || 'badge-gray';
  return '<span class="badge ' + cls + '">' + esc(c) + '</span>';
}
function addYearsToDateStr(ds, n) {
  if (!ds) return '';
  const p = ds.split('-').map(Number);
  let d = new Date(p[0] + n, p[1] - 1, p[2]);
  if (d.getMonth() !== p[1] - 1) d = new Date(p[0] + n, p[1], 0); // 2/29 → 2/28
  return d.getFullYear() + '-' + _pad2(d.getMonth() + 1) + '-' + _pad2(d.getDate());
}
function daysUntil(ds) {
  if (!ds) return null;
  const p = String(ds).slice(0, 10).split('-').map(Number);
  const t = new Date();
  const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((new Date(p[0], p[1] - 1, p[2]) - today) / 86400000);
}
function dealDate(c) { return c.signed_date || (c.created_at ? isoToLocalDate(c.created_at) : ''); }
function dealSalesName(c) {
  if (c.sales_user_name) return c.sales_user_name;
  const u = usersData.find(x => x.id === (c.sales_user_id || c.user_id));
  return u ? (u.full_name || u.email || '') : '';
}
// 找出下次續約：未到期中最近的；都過期就回傳最近一筆過期的
function pickNextRenewal(contracts) {
  const withEnd = (contracts || []).filter(c => c.end_date);
  const upcoming = withEnd.filter(c => daysUntil(c.end_date) >= 0).sort((a, b) => a.end_date.localeCompare(b.end_date));
  if (upcoming.length) return upcoming[0];
  return withEnd.sort((a, b) => b.end_date.localeCompare(a.end_date))[0] || null;
}
function renewalBadgeHtml(c) {
  if (!c || !c.end_date) return '—';
  const d = daysUntil(c.end_date);

  _df.items.forEach(function (it) { if (it.src === 'sub' && (it.bonus_type === 'standard' || it.bonus_type === 'renewal')) it.bonus_type = isRen ? 'renewal' : 'standard'; });
  renderDfItems();
}
function applyQuoteToDeal(noteId) {
  _df.quoteNoteId = noteId || null;
  renderDfQuotes();
  if (!noteId) return;
  const rec = _df.quotes.find(function (r) { return r.noteId === noteId; });
  if (!rec) return;
  const S = rec.snapshot || {}, sm = rec.summary || {};
  if (S.quote && S.quote.kind === 'renewal') document.getElementById('dfCat').value = '續約';
  _df.items = itemsFromQuote(rec, document.getElementById('dfCat').value === '續約');
  const total = _df.items.reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0);
  if (!_df.inst.some(function (p) { return p.paid_date; })) {
    _df.inst = [{ label: '全額', amount: total, due_date: document.getElementById('dfSigned').value || nowDateStr(), alloc: 'prorata', paid_date: null }];
  } else { toast('已有收款紀錄，付款排程未變動，請手動調整', 'error'); }
  const plan = dealTypesData.find(function (d) { return d.name === (sm.planName || (S.plan && S.plan.name)); });
  if (plan) { document.getElementById('dfPlan').value = plan.id; applyDealTemplate(false); }
  if (S.plan && S.plan.start && !document.getElementById('dfLive').value) document.getElementById('dfLive').value = S.plan.start;
  if (S.plan && S.plan.end && !document.getElementById('dfRenew').value) document.getElementById('dfRenew').value = S.plan.end;
  renderDfItems(); renderDfInst();
  const unset = _df.items.filter(function (it) { return !it.bonus_type; }).length;
  if (unset) toast('有 ' + unset + ' 項明細需要選擇獎金類別（標準／客製）', 'error');
}
function initDealForm(ct, quotes, preNoteId) {

    inst: ct ? JSON.parse(JSON.stringify(dealInstallments(ct))) : [],

  };

function afterDealFormOpen(preNoteId) {

function pickDefaultQuote(quotes) {
  const r = (quotes || []).find(function (q) { return !q.wonContractId && q.quoteStatus !== 'void'; });
  return r ? r.noteId : null;

function applyDealTemplate(force) {
  const planId = document.getElementById('dfPlan')?.value;
  const ta = document.getElementById('dfContent');
  if (!ta) return;
  const plan = dealTypesData.find(d => d.id === planId);
  const tpl = plan?.content_template || '';
  if (!tpl) { if (force) toast('此方案尚未設定模板（可到 設定 → 成交方案管理 設定）', 'error'); return; }
  const cur = ta.value.trim();
  if (force || !cur || cur === _lastDealTpl.trim()) {
    ta.value = tpl; _lastDealTpl = tpl;
  } else {
    toast('已保留你輸入的內容；要覆蓋請按「📋 套用方案模板」', 'error');

function autoFillRenewal() {
