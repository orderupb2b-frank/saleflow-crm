function numLoose(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = parseFloat(String(v).replace(/[^\d.-]/g, ''));
  return isNaN(n) ? null : n;
}
function dealItems(c) {
  if (Array.isArray(c.items) && c.items.length) return c.items;
  return [{ name: c.name || '成交', amount: c.amount || 0, bonus_type: bonusBucket(c.deal_category) }];
}
function dealInstallments(c) {
  if (Array.isArray(c.installments) && c.installments.length) return c.installments;
  return [{ label: '全額', amount: c.amount || 0, due_date: dealDate(c), alloc: 'prorata', paid_date: null }];
}
function instPaidAmt(p) { return p.paid_date ? (p.paid_amount != null ? Number(p.paid_amount) || 0 : Number(p.amount) || 0) : 0; }
// ── 客戶財務摘要：月費、合約期間、已收／未收 ──
// 月費：優先用欄位，其次從開通內容「月費：$3,680」解析
function ctMonthly(c) {
  if (c && c.monthly_fee != null && c.monthly_fee !== '') return Number(c.monthly_fee) || 0;
  const m = String((c && c.plan_content) || '').match(/月費[：:]\s*(?:NT)?\$?\s*([\d,]+)/);
  return m ? (parseInt(m[1].replace(/,/g, ''), 10) || 0) : 0;
}
function ctActive(c) { return !c.end_date || daysUntil(c.end_date) >= 0; }
// 合約進度：第幾個月／共幾個月
function ctTermInfo(c) {
  if (!c.start_date || !c.end_date) return null;
  const mv = function (d) { const p = String(d).slice(0, 10).split('-').map(Number); return p[0] * 12 + p[1] - 1 + (p[2] - 1) / 31; };
  const total = Math.max(1, Math.round(mv(c.end_date) - mv(c.start_date)));
  const t = new Date(); const cur = t.getFullYear() * 12 + t.getMonth() + (t.getDate() - 1) / 31;
  if (cur < mv(c.start_date)) return { total: total, done: 0, label: '尚未開始・共 ' + total + ' 個月' };
  const done = Math.min(total, Math.floor(cur - mv(c.start_date)) + 1);
  return { total: total, done: done, label: (cur > mv(c.end_date) ? '已到期' : '第 ' + done + ' / ' + total + ' 個月') };
}
function acctFin(contracts) {
  const f = { total: 0, paid: 0, unpaid: 0, monthly: 0, nextPay: null, start: '', end: '', count: (contracts || []).length };
  (contracts || []).forEach(function (c) {
    f.total += c.amount || dealItems(c).reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0);

function itemsFromQuote(rec, isRenewal) {
  const S = (rec && rec.snapshot) || {};
  const items = [];
  (S.prices || []).forEach(function (p) {
    const a = numLoose(p.amount), s = numLoose(p.sale);
    const qn = numLoose(p.qty); const q = Math.max(0, qn == null ? 1 : qn);
    const hasDisc = a != null && s != null && s < a;
    const unit = a != null ? a : s; const fin = hasDisc ? s : unit;
    if (fin == null) return;
    const total = Math.round(fin * q);
    let bt = '';
    if (total === 0) bt = 'none';
    else if (p.preset === 'sub') bt = isRenewal ? 'renewal' : 'standard';
    else if (['standard', 'custom', 'renewal', 'none'].indexOf(p.bonus) >= 0) bt = p.bonus;
    else if (p.preset === 'custom') bt = 'custom';
    else if (p.preset) bt = 'standard';
    items.push({ name: p.item || '項目', amount: total, bonus_type: bt, src: p.preset || '' });
  });
  return items;
}

function readDealForm() {
  const cat = document.getElementById('dfCat').value || '主約';
  const planId = document.getElementById('dfPlan').value;
  const plan = dealTypesData.find(d => d.id === planId);
  const salesId = document.getElementById('dfSales').value;
  const signed = document.getElementById('dfSigned').value;
  if (_df.isNew && !_df.quoteNoteId) { toast('成交要選一張報價單', 'error'); return null; }
  if (_df.isNew && !(_df.files || []).length) { const fe = document.getElementById('dfFile'); if (fe) fe.classList.add('err'); toast('請附上客戶簽回的報價單', 'error'); return null; }
  if (!salesId) { toast('請選擇業績歸屬業務', 'error'); return null; }
  if (!signed) { toast('請填寫簽約日', 'error'); return null; }
  const items = [];
  for (let i = 0; i < _df.items.length; i++) {
    const it = _df.items[i];
    const nm = String(it.name || '').trim(), amt = numLoose(it.amount);
    if (!nm && amt == null) continue;
    if (!nm) { toast('第 ' + (i + 1) + ' 項明細缺少名稱', 'error'); return null; }
    if (amt == null || amt < 0) { toast('「' + nm + '」請填金額（贈送填 0）', 'error'); return null; }
    if (!it.bonus_type) { toast('「' + nm + '」請選擇獎金類別', 'error'); return null; }
    const o = { name: nm, amount: amt, bonus_type: it.bonus_type }; if (it.src) o.src = it.src;
    items.push(o);
  }
  if (!items.length) { toast('請至少填一項成交明細', 'error'); return null; }
  const total = items.reduce(function (s, it) { return s + it.amount; }, 0);
  const inst = [];
  for (let i = 0; i < _df.inst.length; i++) {
    const p = Object.assign({}, _df.inst[i]);
    const amt = numLoose(p.amount);
    if (amt == null && !p.paid_date) continue;
    p.amount = amt || 0;
    p.label = String(p.label || '').trim() || ('第 ' + (inst.length + 1) + ' 期');
    p.due_date = p.due_date || signed;
    p.alloc = p.alloc || 'prorata';
    inst.push(p);
  }
  if (!inst.length) inst.push({ label: '全額', amount: total, due_date: signed, alloc: 'prorata', paid_date: null });
  const instTotal = inst.reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
  if (Math.abs(instTotal - total) > 0.5) { toast('付款合計 $' + fmtNum(instTotal) + ' ≠ 明細合計 $' + fmtNum(total) + '，請調整（可按「補到最後一期」）', 'error'); return null; }
  const salesSel = document.getElementById('dfSales');
  const remindRaw = document.getElementById('dfRemind').value;
  return {
    name: document.getElementById('dfName').value.trim() || (plan ? plan.name : '') || items[0].name || cat,
    deal_category: cat,
    plan_content: document.getElementById('dfContent').value.trim() || null,
    amount: total,
    monthly_fee: (function () { const v = numLoose(document.getElementById('dfMonthly')?.value); if (v != null) return v; return ctMonthly({ plan_content: document.getElementById('dfContent').value }) || null; })(),
    items: items,
    installments: inst,
    quote_note_id: _df.quoteNoteId || null,
    sales_user_id: salesId,
    sales_user_name: salesSel.options[salesSel.selectedIndex]?.text || '',
    signed_date: signed,
    start_date: document.getElementById('dfLive').value || null,
    end_date: document.getElementById('dfRenew').value || null,
    remind_days: remindRaw === '' ? 30 : (parseInt(remindRaw) || 0),
    note: document.getElementById('dfNote').value.trim() || null
  };
}

async function doConvertLead(lead, withDeal) {
  if (_dealBusy) return;
  let payload = null;
  if (withDeal) { payload = readDealForm(); if (!payload) return; }
  _dealBusy = true;
  try {
    const acc = await convertToAccount(lead);
    if (!acc) return;
    if (payload) {
      payload.account_id = acc.id;
      payload.user_id = currentUser.id;
      payload.created_at = new Date().toISOString();
      const files = (_df.files || []).slice();
      const { data: ctRow, error } = await db.from('contracts').insert(payload).select('id').single();
      if (error) { toast('客戶已建立，但成交紀錄儲存失敗：' + error.message, 'error'); }
      else if (files.length && !(await uploadDealFiles(ctRow.id, acc.id, files, lead.id, true))) toast('回簽檔上傳失敗，請到客戶頁補傳', 'error');
    }
    // 線索同步移到「簽約進件」（若有此階段），線索本身保留
    const wonStage = stagesData.find(s => s.name === '簽約進件');
    if (wonStage && lead.stage_id !== wonStage.id) {
      await db.from('leads').update({ stage_id: wonStage.id, updated_at: new Date().toISOString() }).eq('id', lead.id);
      const ld = leadsData.find(l => l.id === lead.id); if (ld) ld.stage_id = wonStage.id;
    }
    closeModal();
    toast('✅ 已轉為成交客戶：' + (lead.name || ''), 'success');
    goToAccount(acc.id);
  } finally { _dealBusy = false; }
}

function parseContactsText(text) {
  const rows = [];
  text.split('\n').forEach(line => {
    const sep = line.includes('\t') ? '\t' : ',';
    const cols = line.split(sep).map(s => s.trim());
    if (!cols[0]) return;
    rows.push({ name: cols[0], role: cols[1]||'', email: cols[2]||'', phone: cols[3]||'', line_id: cols[4]||'' });
  });
  return rows;
}

async function saveLead(andLog) {
  const name = document.getElementById('lName').value.trim();
  if (!name) { toast('先填公司名稱', 'error'); return; }
  const taxId = document.getElementById('lTaxId')?.value.trim() || null;
  // 統編唯一性驗證（只在有填寫時才檢查）

    if (taxId.length !== 8) { toast('統一編號須為 8 碼數字', 'error'); return; }
    const { data: dup } = await db.from('leads').select('id,name').eq('tax_id', taxId).limit(1);
    if (dup && dup.length > 0) { toast(`統編 ${taxId} 已存在於「${dup[0].name}」`, 'error'); return; }
  }
  const selectedNeedTypes = document.getElementById('lNeedTypes') ? getSelectedNeedTypes('lNeedTypes') : [];
  let userId = currentUser.id;
  let userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '';
  const userSelect = document.getElementById('lUserSelect');
  if (userSelect && userSelect.value) {
    const [selId, selName] = userSelect.value.split('|');
    userId = selId; userName = selName;
  } else {
    const nameInput = document.getElementById('lUserName');
    if (nameInput) userName = nameInput.value.trim() || userName;
  }
  const payload = {
    name,
    stage_id: document.getElementById('lStage')?.value || stagesData[0]?.id,
    source_id: document.getElementById('lSource')?.value || null,
    tax_id: taxId || null,
    need_types: selectedNeedTypes.length ? selectedNeedTypes : null,
    product_type: document.getElementById('lProductType')?.value.trim() || null,
    deal_type_id: document.getElementById('lDealType')?.value || null,
    user_id: userId, user_name: userName, created_at: new Date().toISOString()
  };
  const note = document.getElementById('lNote')?.value.trim() || '';
  const { data: lead, error } = await db.from('leads').insert(payload).select().single();
  if (error) {
    toast('建立失敗：' + error.message, 'error');
    console.error('saveLead error:', error);
    return;
  }
  if (note) await db.from('notes').insert({ content: note, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
  const contactsText = document.getElementById('lContactsText')?.value || '';
  const contacts = parseContactsText(contactsText);
  const phone = document.getElementById('lPhone')?.value.trim() || '';
  if (phone && !contacts.length) contacts.push({ name: '聯絡人', role: '', email: '', phone: phone });
  for (const c of contacts) {
    await db.from('contacts').insert({ name: c.name, role: c.role, email: c.email, phone: c.phone, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
  }
  lead.contacts = contacts.map(function (c) { return { name: c.name, phone: c.phone }; });
  leadsData.push(lead);
  closeModal();
  toast('已建立 ' + name, 'success');
  if (userId && userId !== currentUser.id) crmApi('POST', '/api/leads/' + lead.id + '/announce').catch(function () {});
  if (andLog) { openQuickLog(lead.id); return; }
  if (isLeadsPage()) { if (window.innerWidth <= 768) renderLeadsMobile(); else renderLeads(); } else navigate('leads');
}

        return '<button class="cp-tab' + (_cpTab === t[0] ? ' on' : '') + '" role="tab" data-tab="' + t[0] + '" onclick="setCpTab(\'' + t[0] + '\')">' + t[1] + (t[2] !== '' ? '<b>' + t[2] + '</b>' : '') + '</button>';
      }).join('') + '</div>'
    + pane('timeline', companyTimelineCardHtml(lead))
    + (acc ? pane('deals', companyDealsCardHtml(acc, contracts)) : '')
    + pane('quotes', '<div class="cp-card"><div id="drawerPanel-quotes"></div></div>')
    + pane('contacts', '<div class="cp-card"><div id="drawerPanel-contacts"></div></div>')

  ilRenderStage();

  renderDrawerContacts(leadId);
  renderDrawerQuotes(leadId);
}

async function renderCompanyTimeline(leadId) {
  const cp = window._cp || {};
  const acc = cp.acc, cts = cp.contracts || [];
  const [aR, nR, cR, anR] = await Promise.all([
    db.from('activities').select('*').eq('lead_id', leadId).order('created_at', { ascending: false }),
    db.from('notes').select('*').eq('lead_id', leadId),
    db.from('contacts').select('id,name').eq('lead_id', leadId),
    acc ? db.from('notes').select('*').eq('account_id', acc.id) : Promise.resolve({ data: [] })
  ]);
  if (currentPage !== 'company' || currentLeadId !== leadId) return;
  const el = document.getElementById('drawerPanel-activities'); if (!el) return;
  const contacts = cR.data || [];
  const who = function (uid) { const u = usersData.find(x => x.id === uid); return u ? (u.full_name || u.email || '') : ''; };
  const at = function (d) { return d && String(d).length <= 10 ? d + 'T12:00:00' : d; };
  const items = [];
  (aR.data || []).forEach(function (a) {
    const t = ACTIVITY_TYPES[a.type] || ACTIVITY_TYPES['note'];
    const ct = contacts.find(c => c.id === a.contact_id);
    items.push({ k: 'act', at: a.created_at, ico: t.icon, color: t.color, title: t.label + (ct ? ' · ' + esc(ct.name) : ''), text: a.content || '', who: who(a.user_id),
      acts: '<button class="btn btn-ghost btn-sm btn-icon" onclick="openEditActivity(\'' + a.id + '\',\'' + leadId + '\')">✏️</button><button class="btn btn-ghost btn-sm btn-icon" onclick="deleteActivity(\'' + a.id + '\',\'' + leadId + '\')">🗑</button>' });
  });
  const seen = {};
  (nR.data || []).concat(anR.data || []).forEach(function (n) {
    if (seen[n.id]) return; seen[n.id] = 1;
    const q = parseQuoteNote(n);
    if (q) {
      const sm = q.summary || {};
      const won = cts.some(c => String(c.quote_note_id) === String(n.id));
      items.push({ k: 'quote', at: n.created_at, ico: '🧾', color: '#6366f1', title: '儲存報價 ' + esc(sm.quoteNo || '') + (won ? ' <span class="badge badge-green">已成交</span>' : n.quote_status === 'sent' ? ' <span class="badge badge-blue">已送出</span>' : n.quote_status === 'void' ? ' <span class="badge badge-gray">作廢</span>' : ''),
        text: (sm.planName || '') + (sm.months ? '・' + sm.months + ' 個月' : '') + '・' + quoteMoney(sm.grand, sm.currency || 'TWD'), who: who(n.user_id),
        acts: '<button class="btn btn-ghost btn-sm" onclick="openQuoteForLead(\'' + leadId + '\',\'' + n.id + '\')">開啟</button>' });
    } else {
      items.push({ k: 'act', at: n.created_at, ico: '💬', color: '#94a3b8', title: '備註', text: n.content || '', who: who(n.user_id),
        acts: '<button class="btn btn-ghost btn-sm btn-icon" onclick="deleteNote(\'' + n.id + '\',\'' + leadId + '\',\'lead\')">🗑</button>' });
    }
  });
  if (acc) items.push({ k: 'deal', at: acc.created_at, ico: '🤝', color: '#10b981', title: '轉為成交客戶', text: '', who: '' });
  cts.forEach(function (c) {
    items.push({ k: 'deal', at: at(dealDate(c)), ico: '💰', color: '#10b981', title: '成交：' + esc(c.name || '') + '　<span style="font-family:var(--mono)">$' + fmtNum(c.amount || 0) + '</span>', text: dealItems(c).map(function (it) { return it.name + ' $' + fmtNum(it.amount); }).join('、'), who: dealSalesName(c) });
    dealInstallments(c).forEach(function (p) {
      if (p.paid_date) items.push({ k: 'deal', at: at(p.paid_date), ico: '💵', color: '#10b981', title: '收款：' + esc(p.label || '') + '　<span style="font-family:var(--mono)">$' + fmtNum(instPaidAmt(p)) + '</span>', text: '', who: p.paid_by || '' });
    });
  });
  const shown = items.filter(function (i) { return _cpFilter === 'all' || i.k === _cpFilter; }).sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
  if (!shown.length) { el.innerHTML = '<div class="empty-state" style="padding:18px"><div class="empty-text">還沒有紀錄。打完電話、拜訪完，記一筆吧！</div></div>'; return; }
  el.innerHTML = shown.map(function (i, idx) {
    return '<div class="tl-item"' + (idx >= 20 ? ' data-more="1" style="display:none"' : '') + '>'
      + '<div class="tl-ico" style="background:' + i.color + '22;color:' + i.color + '">' + i.ico + '</div>'
      + '<div class="tl-body"><div class="tl-title">' + i.title + '</div>'
      + (i.text ? '<div class="tl-text">' + esc(i.text) + '</div>' : '')
      + '<div class="tl-meta">' + fmtDate(i.at) + (i.who ? '・' + esc(i.who) : '') + '</div></div>'
      + (i.acts ? '<div style="display:flex;gap:2px;align-items:flex-start">' + i.acts + '</div>' : '')
      + '</div>';
  }).join('') + (shown.length > 20 ? '<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="this.parentElement.querySelectorAll(\'[data-more]\').forEach(function(e){e.style.display=\'\'});this.remove()">顯示全部 ' + shown.length + ' 筆</button>' : '');
}

async function companyStage(leadId, stageId) {
  await db.from('leads').update({ stage_id: stageId, updated_at: new Date().toISOString() }).eq('id', leadId);
  const l = leadsData.find(x => x.id === leadId); if (l) l.stage_id = stageId;
  const nm = getStageName(stageId);
  toast('階段：' + nm, 'success');
  await refreshCompany();
  afterStageChanged(leadId, stageId);
}
// 階段變更後的共用後續動作
function afterStageChanged(leadId, stageId) {
  const nm = getStageName(stageId);

  else if (nm === '簽約進件' && !convertedLeadIds.has(leadId)) openConvertModal(leadId);
}

}

let _histRouting = false;
function histPush(hash, opt) {
  if (_histRouting) return;
  try {
    const st = history.state && typeof history.state.sf === 'number' ? history.state.sf : 0;
    if (opt && opt.replace) history.replaceState({ sf: st }, '', hash);
    else if (location.hash !== hash) history.pushState({ sf: st + 1 }, '', hash);

}

const QL_RESULTS = [['call', '接通'], ['missed', '沒接'], ['visit', '拜訪'], ['msg', '訊息']];
const QL_NEXT = [[1, '明天'], [3, '3 天'], [7, '下週'], [14, '2 週'], ['pick', '選日期'], [null, '不用']];
let _ql = null;
function qlStageAfter(lead, result) {
  const order = stagesData.map(function (s) { return s.name; });
  const cur = getStageName(lead.stage_id) || '';
  const idx = function (n) { return order.indexOf(n); };
  const re = (result === 'call' || result === 'msg') ? /聯繫/ : result === 'visit' ? /拜訪/ : null;
  if (!re) return null;
  const target = order.find(function (n) { return re.test(n); });
  if (!target || idx(cur) < 0) return null;
  return idx(target) > idx(cur) ? stagesData[idx(target)] : null;
}

// 從一句話猜結果跟下次（只在使用者沒手動選過時套用）
function qlAutoPick(text) {
  if (!_ql) return;
  const t = String(text || '');
  if (!_ql.touchedResult) {
    let r = null;
    if (/沒接|未接|沒人接|無人接|不在|沒接通|掛掉|掛電話/.test(t)) r = 'missed';
    else if (/拜訪|到訪|見面|現場|去了|去過|碰面/.test(t)) r = 'visit';
    else if (/LINE|賴|訊息|簡訊|mail|Email|信件|傳了|回訊/i.test(t)) r = 'msg';
    else if (/接通|聊|講|說|電話/.test(t)) r = 'call';
    if (r && r !== _ql.result) { _ql.result = r; document.querySelectorAll('#qlRes .df-chip').forEach(function (b) { b.classList.toggle('on', b.dataset.v === r); }); qlRenderStage(); }
  }
  if (!_ql.touchedNext) {
    let n = null;
    if (/明天|明日/.test(t)) n = 1; else if (/後天|三天|3天|3 天/.test(t)) n = 3; else if (/下週|下星期|下禮拜|一週後|一周後/.test(t)) n = 7; else if (/兩週|二週|2週|2 週|兩星期|兩禮拜/.test(t)) n = 14; else if (/不用|不必|結案|沒興趣/.test(t)) n = 'null';
    if (n !== null && String(n) !== String(_ql.next)) { const tr = _ql.touchedNext; qlSet('next', String(n)); _ql.touchedNext = tr; }
  }
}
function qlSet(k, v) {
  if (!_ql) return;
  if (k === 'result') { _ql.touchedResult = true; _ql.result = v; document.querySelectorAll('#qlRes .df-chip').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); qlRenderStage(); return; }
  _ql.next = v === 'null' ? null : v; _ql.touchedNext = true;
  const dateEl = document.getElementById('qlDate');
  if (v === 'pick') { dateEl.style.display = ''; dateEl.focus(); }
  else { dateEl.style.display = 'none'; if (v === 'keep') _ql.nextDate = String(_ql.lead.next_contact_date).slice(0, 10); else if (v !== 'null') _ql.nextDate = addDaysStr(nowDateStr(), parseInt(v, 10)); }
  document.querySelectorAll('#qlNext .df-chip').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
}
function qlRenderStage() {
  const el = document.getElementById('qlStage'); if (!el || !_ql) return;
  const ns = qlStageAfter(_ql.lead, _ql.result);
  if (!ns) { el.innerHTML = ''; _ql.stageTo = null; return; }
  _ql.stageTo = ns;
  el.innerHTML = '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" ' + (_ql.stage ? 'checked' : '') + ' onchange="_ql.stage=this.checked">階段改成「' + esc(ns.name) + '」</label>';
}
function qlKey(e) {
  if (e.key === 'Enter' && !e.shiftKey && (e.metaKey || e.ctrlKey || window.innerWidth > 768)) { e.preventDefault(); saveQuickLog(); }
}
async function saveQuickLog() {

  if (q.next === 'pick' && !q.nextDate) { toast('選個日期', 'error'); return; }
  q.busy = true;

// ── Activity time helpers ──
function _pad2(n){ return String(n).padStart(2,'0'); }
function nowDateStr(){ const d=new Date(); return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function nowTimeStr(){ const d=new Date(); return _pad2(d.getHours())+':'+_pad2(d.getMinutes()); }
function isoToLocalDate(iso){ if(!iso) return nowDateStr(); const d=new Date(iso); if(isNaN(d.getTime())) return nowDateStr(); return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function isoToLocalTime(iso){ if(!iso) return nowTimeStr(); const d=new Date(iso); if(isNaN(d.getTime())) return nowTimeStr(); return _pad2(d.getHours())+':'+_pad2(d.getMinutes()); }
// Combine local date + time inputs into a correct UTC ISO timestamp
function localToISO(dateStr, timeStr){
  if(!dateStr) return new Date().toISOString();
  const t = timeStr || '00:00';
  const dt = new Date(dateStr + 'T' + t + ':00'); // parsed as local time
  if(isNaN(dt.getTime())) return new Date().toISOString();
  return dt.toISOString();
}

// ── Voice-to-text (mobile-friendly) ──
let _recognition = null;
function startVoiceInput(targetId, btnEl) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // Already recording → stop
  if (_recognition) { try { _recognition.stop(); } catch(e){} return; }
  if (!SR) {
    toast('這個瀏覽器沒有語音按鈕，用鍵盤上的 🎤 一樣能說', 'error');
    const t0 = document.getElementById(targetId); if (t0) t0.focus();
    return;
  }
  const ta = document.getElementById(targetId);
  if (!ta) return;
  const rec = new SR();
  rec.lang = 'zh-TW';
  rec.continuous = true;
  rec.interimResults = true;
  _recognition = rec;
  const baseText = ta.value ? (ta.value.endsWith('\n') ? ta.value : ta.value + '\n') : '';
  if (btnEl) { btnEl.textContent = '⏹ 說完了，按一下'; btnEl.classList.remove('btn-secondary'); btnEl.classList.add('btn-danger'); btnEl.classList.add('rec'); }
  rec.onresult = (e) => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    ta.value = baseText + txt;
    try { ta.dispatchEvent(new Event('input')); } catch (_) {}
  };
  rec.onerror = (e) => {
    if (e.error !== 'aborted' && e.error !== 'no-speech') toast('語音辨識錯誤：' + (e.error || ''), 'error');
  };
  rec.onend = () => {
    _recognition = null;
    if (btnEl) { btnEl.textContent = btnEl.id === 'qlVoice' ? '🎤 再說一段' : '🎤 語音輸入'; btnEl.classList.remove('btn-danger'); btnEl.classList.remove('rec'); btnEl.classList.add('btn-secondary'); }
  };
  try { rec.start(); } catch(e) { toast('無法啟動語音輸入', 'error'); _recognition = null; }
}

function isQuoteNote(note) {

}
function parseQuoteNote(note) {
  if (!isQuoteNote(note)) return null;
  try {
    const data = JSON.parse(note.content.slice(QUOTE_NOTE_PREFIX.length));
    return { ...data, noteId: note.id, savedAt: note.created_at, quoteStatus: note.quote_status || '' };
  } catch(e) { return null; }
}
function quoteMoney(n, currency='TWD') {

}
function quoteFrameWindow() {

}
function postToQuoteFrame(message) {
  const w = quoteFrameWindow();

function requestQuoteSnapshot() {
  return new Promise((resolve, reject) => {
    if (!quoteFrameReady || !quoteFrameWindow()) { reject(new Error('報價工具尚未載入完成')); return; }

    quoteSnapshotRequests.set(id, msg => { clearTimeout(timer); resolve(msg); });
    postToQuoteFrame({ type:'orderup-quote-request-snapshot', requestId:id });
  });
}

async function saveCurrentQuote(options={}) {
  if (!quoteSelectedLeadId) { toast('目前是手動客戶。若要存進 CRM，請先從上方搜尋並綁定既有 Lead。', 'error'); return false; }
  try {
    const msg = await requestQuoteSnapshot();
    const record = { version:1, kind:'orderup_quote', summary:msg.summary, snapshot:msg.snapshot };
    const existingQuotes = await loadQuoteNotesForLead(quoteSelectedLeadId);
    const latest = existingQuotes[0];
    if (latest?.snapshot && JSON.stringify(latest.snapshot) === JSON.stringify(msg.snapshot)) {
      if (!options.silent) toast('這份報價沒有變更，CRM 已有最新版本', 'success');
      return true;
    }
    const payload = {
      content: QUOTE_NOTE_PREFIX + JSON.stringify(record),
      lead_id: quoteSelectedLeadId,
      user_id: currentUser.id,
      created_at: new Date().toISOString()
    };
    try {
      const { data: acc } = await db.from('accounts').select('id').eq('lead_id', quoteSelectedLeadId).maybeSingle();
      if (acc?.id) payload.account_id = acc.id;
    } catch(e) {}
    const { error } = await db.from('notes').insert(payload);
    if (error) throw error;
    await refreshQuoteHistoryCount(quoteSelectedLeadId);
    if (!options.silent) toast('✅ 報價已儲存到客戶紀錄', 'success');
    return true;
  } catch(e) {
    toast('報價儲存失敗：' + (e.message || e), 'error');
    return false;
  }
}

      + '<td style="font-size:12.5px">' + onbCell(a) + '</td>'
      + '<td style="font-size:12.5px">' + payCell(f) + '</td>'
      + '<td style="font-size:12.5px">' + renewCell(f) + '</td>'
      + '<td style="font-size:12.5px">' + quoteCell(r) + '</td>'
      + '<td style="text-align:right;font-family:var(--mono);font-weight:600">' + (f.monthly ? '$' + fmtNum(f.monthly) : '—') + '</td>'

  html += '</tbody></table></div><div class="acc-cards">';
  shown.forEach(function (r) {

// ════════════════════════ 續約報價 ════════════════════════
// 以「快到期的那張成交單」為底：沿用原報價（方案、單價、優惠價），拿掉一次性費用，期間接在原合約後面
const RENEW_PLAN_KEYS = ['trial', 'light', 'basic', 'growth', 'pro', 'business', 'scale', 'enterprise'];
function ymdAdd(s, days, months) {
  const d = new Date(String(s).slice(0, 10) + 'T00:00:00');
  if (months) d.setMonth(d.getMonth() + months);
  if (days) d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + _pad2(d.getMonth() + 1) + '-' + _pad2(d.getDate());
}
function monthsBetween(a, b) {
  if (!a || !b) return 12;
  const x = new Date(a + 'T00:00:00'), y = new Date(ymdAdd(b, 1) + 'T00:00:00');
  return Math.max(1, Math.round((y.getFullYear() - x.getFullYear()) * 12 + (y.getMonth() - x.getMonth()) + (y.getDate() - x.getDate()) / 30));
}
function renewBtnHtml(a, f) {
  if (!a.lead_id || !f.count || f.renewDays == null || f.renewDays > 90 || a.status === 'terminated') return '';
  return '<div><button class="btn btn-secondary btn-sm" style="margin-top:4px;font-size:11px;padding:2px 8px" onclick="event.stopPropagation();openRenewalQuote(\'' + a.lead_id + '\')">🔄 續約報價</button></div>';
}
async function openRenewalQuote(leadId) {
  const accR = await db.from('accounts').select('*').eq('lead_id', leadId).maybeSingle();
  const acc = accR.data;
  if (!acc) { toast('這家還不是成交客戶，沒有可續約的合約', 'error'); return; }
  const { data: cts } = await db.from('contracts').select('*').eq('account_id', acc.id);
  const base = pickNextRenewal(cts || []) || (cts || []).slice().sort(function (a, b) { return dealDate(b).localeCompare(dealDate(a)); })[0];
  if (!base) { toast('這家還沒有成交單，無法帶出續約內容', 'error'); return; }
  if (!base.end_date) { toast('「' + (base.name || '成交單') + '」沒有填到期日，先在成交單補上到期日再做續約報價', 'error'); return; }

  // 原報價：成交單連到的那份；沒有就用這家最近一份新購報價
  const quotes = await loadQuoteNotesForLead(leadId);
  let src = quotes.find(function (r) { return String(r.noteId) === String(base.quote_note_id || ''); })
    || quotes.find(function (r) { return r.snapshot && !(r.snapshot.quote && r.snapshot.quote.kind === 'renewal') && r.quoteStatus !== 'void'; })
    || quotes.find(function (r) { return r.snapshot; });
  const S = src && src.snapshot ? JSON.parse(JSON.stringify(src.snapshot)) : {};

  const months = (S.plan && parseInt(S.plan.months)) || monthsBetween(base.start_date, base.end_date);
  const start = ymdAdd(base.end_date, 1);
  const end = ymdAdd(start, -1, months);
  const today = nowDateStr();
  const daysLeft = daysUntil(base.end_date);

  if (!S.plan || !S.plan.preset) {
    const mt = String((base.name || '') + ' ' + (base.plan_content || '')).match(/\b(Trial|Light|Basic|Growth|Pro|Business|Scale|Enterprise)\b/i);
    S.plan = { preset: mt ? mt[1].toLowerCase() : 'custom', name: base.name || '', monthly: ctMonthly(base) || '' };
    const mf = ctMonthly(base);
    S.prices = [{ preset: 'sub', item: '', type: '訂閱方案', amount: '', sale: mf || '', qty: months, note: '', lock: false }];
    if (!RENEW_PLAN_KEYS.includes(S.plan.preset)) S.prices[0] = { preset: 'sub', item: 'OrderUp B2B ' + (base.name || '訂閱方案') + '（續約）', type: '訂閱方案', amount: mf || '', sale: '', qty: months, note: mf ? '月費 $' + fmtNum(mf) + ' × ' + months + ' 個月' : '', lock: true };
  }
  Object.assign(S.plan, { months: months, bonus: 0, start: start, end: end });
  S.prices = (S.prices || []).filter(function (p) { return p.preset !== 'setup' && p.type !== '一次性費用'; });
  if (!S.prices.length) S.prices = [{ preset: 'sub', item: '', type: '訂閱方案', amount: '', sale: '', qty: months, note: '', lock: false }];
  S.service = Object.assign({}, S.service, { consultant: 'no' });
  S.promos = Object.assign({ on: true, heading: '續約優惠' }, S.promos || {}, { items: [] });
  S.doc = Object.assign({}, S.doc || {}, {
    eyebrow: 'RENEWAL PROPOSAL',
    title: 'OrderUp B2B 續約方案',
    subtitle: '感謝這段時間的合作。續約後系統、資料與設定全部沿用，服務不中斷。',
    closing: '續約後沿用目前的系統設定與資料，實際內容以本報價單為準。'
  });
  S.quote = {
    kind: 'renewal', no: '', currency: 'TWD', date: today,
    valid: daysLeft >= 7 ? base.end_date : ymdAdd(today, 14),
    ref: base.start_date ? fmtDateSlash(base.start_date) + ' – ' + fmtDateSlash(base.end_date) : '至 ' + fmtDateSlash(base.end_date)
  };
  const terms = Array.isArray(S.terms) && S.terms.length ? S.terms : [
    { k: '付款條件', v: '簽約後 7 日內完成方案費用。' },
    { k: '續約方式', v: '' },
    { k: '使用條款', v: 'www.orderupb2b.com/terms-and-conditions' }

    return '<div class="merge-row"><div style="flex:1;min-width:0"><b>' + esc(l.name) + '</b> <span style="font-size:11px;color:var(--text3)">' + esc(l.tax_id || '無統編') + '・' + esc(l.user_name || '—') + '・建立 ' + fmtDate(l.created_at) + convertedTag(l.id) + '</span></div>'
      + '<button class="btn btn-primary btn-sm" onclick="confirmMergeLead(\'' + leadId + '\',' + i + ')">併入這家</button></div>';
  }).join('') : '<div style="font-size:12px;color:var(--text3)">找不到符合的公司</div>';
}
function convertedTag(id) { return convertedLeadIds && convertedLeadIds.has(id) ? '・<span style="color:var(--green)">成交客戶</span>' : ''; }
function confirmMergeLead(keepId, i) {
  const d = _mergeLeads[i]; if (!d) return;
  const keepName = (leadsData.find(function (l) { return l.id === keepId; }) || (window._cp && window._cp.lead) || {}).name || '目前這家';
  openConfirm('確定合併？', '把「<b>' + esc(d.name) + '</b>」的所有紀錄併入「<b>' + esc(keepName) + '</b>」，然後刪除「' + esc(d.name) + '」。<br>此操作無法復原。', async function () {
    closeModal();
    const { error } = await db.rpc('merge_leads', { keep_id: keepId, dup_id: d.id });
    if (error) { toast('合併失敗：' + error.message, 'error'); return; }
    toast('已合併：' + d.name + ' → ' + keepName, 'success');
    leadsData = leadsData.filter(function (l) { return l.id !== d.id; });
    if (currentPage === 'company') refreshCompany(); else openCompany(keepId);
  }, function () { openMergeLead(keepId); }, '確定合併', '取消');
}

    db.from('contracts').select('*').eq('account_id', accId).order('created_at', {ascending:false}),
    db.from('notes').select('*').eq('account_id', accId).order('created_at', {ascending:false}),

      db.from('contacts').select('*').eq('lead_id', acc.lead_id),
      db.from('activities').select('*').eq('lead_id', acc.lead_id).order('created_at', {ascending:false}),

    ]);

    leadContacts = lcRes.data || [];

      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">

          <div style="font-weight:600;margin-bottom:4px">${esc(c.name)}${c.role?` <span style="color:var(--text3);font-weight:400">· ${esc(c.role)}</span>`:''}
          </div>

    <div class="chart-card" style="margin-bottom:14px">

function renderContractList(contracts, accId) {
  if (!contracts.length) return '<div class="empty-state" style="padding:16px"><div class="empty-text">尚無成交紀錄</div></div>';
  return contracts.map(function (c) {
    const sales = dealSalesName(c);
    const items = dealItems(c), inst = dealInstallments(c);
    const paid = inst.reduce(function (s, p) { return s + instPaidAmt(p); }, 0);
    const total = c.amount || items.reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0);
    let meta = '<span class="badge badge-green" style="font-family:var(--mono)">$ ' + fmtNum(total) + '</span>';
    const pct = total > 0 ? Math.min(100, Math.round(paid / total * 100)) : 0;
    const nextP = inst.find(function (p) { return !p.paid_date; });
    meta += '<span style="display:inline-flex;align-items:center;gap:6px"><span class="df-bar"><div style="width:' + pct + '%"></div></span>'
      + '<span style="font-size:11px;color:' + (pct >= 100 ? 'var(--green)' : 'var(--text3)') + '">' + (pct >= 100 ? '已收齊' : '已收 $' + fmtNum(paid)) + '</span></span>';
    if (nextP) { const dd = daysUntil(nextP.due_date); meta += '<span style="font-size:11px;color:' + (dd != null && dd < 0 ? 'var(--red)' : 'var(--text3)') + '">下期 $' + fmtNum(nextP.amount) + '・' + esc(nextP.due_date || '') + (dd != null && dd < 0 ? '（逾期）' : '') + '</span>'; }
    const mf = ctMonthly(c);
    if (mf) meta += '<span class="badge badge-blue" style="font-family:var(--mono)">月費 $' + fmtNum(mf) + '</span>';
    if (sales) meta += '<span style="font-size:11px;color:var(--text3)">👤 ' + esc(sales) + '</span>';
    meta += dealFilesBadge(c.id);
    let dates = '';
    const sd = dealDate(c);
    if (sd) dates += '<span>簽約 ' + sd + '</span>';
    const ti = ctTermInfo(c);
    if (c.start_date || c.end_date) dates += '<span>合約 ' + esc(c.start_date || '?') + ' ~ ' + (c.end_date ? renewalBadgeHtml(c) : '?') + (ti ? '・' + ti.label : '') + '</span>';
    let itemsHtml = '<div class="form-label">成交明細</div><table class="data-table" style="margin-bottom:10px"><tbody>';
    items.forEach(function (it) {
      itemsHtml += '<tr><td style="font-size:12.5px">' + esc(it.name || '') + '</td><td>' + bonusTypeBadge(it.bonus_type) + '</td><td style="text-align:right;font-family:var(--mono);font-size:12.5px">' + (Number(it.amount) === 0 ? '贈送' : fmtNum(it.amount)) + '</td></tr>';
    });
    itemsHtml += '</tbody></table>';
    let instHtml = '<div class="form-label">付款排程</div><table class="data-table" style="margin-bottom:10px"><tbody>';
    inst.forEach(function (p, i) {
      const d = p.paid_date ? null : daysUntil(p.due_date);
      const due = p.paid_date ? '<span class="badge badge-green">已收 ' + esc(p.paid_date) + '</span>'
        : '<span style="font-size:11.5px;color:' + (d != null && d < 0 ? 'var(--red)' : 'var(--text3)') + '">預計 ' + esc(p.due_date || '—') + (d != null && d < 0 ? '（逾期）' : '') + '</span>';
      const alloc = (p.alloc && p.alloc !== 'prorata') ? ' <span style="font-size:10.5px;color:var(--text3)">' + (ALLOC_OPTS.find(o => o[0] === p.alloc) || ['', ''])[1] + '</span>' : '';
      let act = '';
      if (window.isAdmin) act = p.paid_date
        ? '<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="undoPayment(\'' + c.id + '\',' + i + ',\'' + accId + '\')">取消收款</button>'
        : '<button class="btn btn-primary btn-sm" style="font-size:11px" onclick="confirmPayment(\'' + c.id + '\',' + i + ',\'' + accId + '\')">確認收款</button>';
      instHtml += '<tr><td style="font-size:12.5px">' + esc(p.label || '') + alloc + '</td><td style="text-align:right;font-family:var(--mono);font-size:12.5px">' + fmtNum(p.paid_date ? instPaidAmt(p) : p.amount) + '</td><td>' + due + '</td><td style="text-align:right">' + act + '</td></tr>';
    });
    instHtml += '</tbody></table>';
    return ''
      + '<div class="contract-card">'
      +   '<div class="contract-card-header" onclick="toggleContractCard(\'' + c.id + '\')">'
      +     '<div style="flex:1;min-width:0">'
      +       '<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap">' + dealCatBadge(c.deal_category) + '<span style="font-weight:500;font-size:13px">' + esc(c.name || '成交') + '</span>' + (c.quote_note_id ? '<span style="font-size:10.5px;color:var(--text3)">📄 來自報價</span>' : '') + '</div>'
      +       '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:3px">' + meta + '</div>'
      +       (dates ? '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text3)">' + dates + '</div>' : '')
      +     '</div>'
      +     '<div style="display:flex;align-items:center;gap:2px">'
      +       '<button class="btn btn-ghost btn-sm" title="上傳回簽檔" onclick="event.stopPropagation();pickDealFiles(\'' + c.id + '\',\'' + accId + '\')">📎</button>'
      +       '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditContract(\'' + c.id + '\',\'' + accId + '\')">✏️</button>'
      +       (window.isAdmin ? '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteContract(\'' + c.id + '\',\'' + accId + '\')">🗑</button>' : '')
      +     '</div>'
      +   '</div>'
      +   '<div class="contract-card-body" id="ct-body-' + c.id + '" style="display:none">'
      +     '<div class="form-label" style="display:flex;align-items:center;justify-content:space-between">回簽檔<button class="btn btn-ghost btn-sm" style="font-size:11px" onclick="pickDealFiles(\'' + c.id + '\',\'' + accId + '\')">＋ 上傳</button></div>'
      +     '<div class="df-files" id="ct-files-' + c.id + '">' + dealFilesListHtml(c.id, accId) + '</div>'
      +     itemsHtml + instHtml

// 客戶頁：原始線索的開發紀錄（活動 + 備註），唯讀時間軸
function buildLeadHistoryHtml(acts, notes, contacts, acc) {
  const items = [];
  (acts || []).forEach(function (a) { items.push({ kind: 'act', at: a.created_at, row: a }); });
  (notes || []).forEach(function (n) { items.push({ kind: 'note', at: n.created_at, row: n }); });
  items.sort(function (x, y) { return new Date(y.at) - new Date(x.at); });
  const convertedAt = acc.created_at ? new Date(acc.created_at) : null;
  let html = '', dividerDone = false;
  items.forEach(function (it, idx) {
    if (!dividerDone && convertedAt && new Date(it.at) < convertedAt) {
      dividerDone = true;
      if (idx > 0) html += '<div' + (idx >= 5 ? ' data-more="1" style="display:none;' : ' style="') + 'text-align:center;font-size:11px;color:var(--green);margin:8px 0">── 🤝 轉為成交客戶 ' + isoToLocalDate(acc.created_at) + ' ── 以下為簽約前 ──</div>';
    }
    const hidden = idx >= 5 ? ' data-more="1" style="display:none"' : '';
    const r = it.row;
    let label, icon, color;
    if (it.kind === 'act') {
      const t = ACTIVITY_TYPES[r.type] || ACTIVITY_TYPES['note'];
      label = t.label; icon = t.icon; color = t.color;
      const ct = (contacts || []).find(function (c) { return c.id === r.contact_id; });
      if (ct) label += ' · ' + esc(ct.name);
    } else { label = '備註'; icon = '📝'; color = '#94a3b8'; }
    const u = usersData.find(function (x) { return x.id === r.user_id; });
    const who = u ? (u.full_name || u.email || '') : '';
    html += '<div class="activity-item"' + hidden + '>'
      + '<div class="activity-icon" style="background:' + color + '20;color:' + color + '">' + icon + '</div>'
      + '<div class="activity-content">'
      +   '<div class="activity-type">' + label + '</div>'
      +   '<div class="activity-note" style="white-space:pre-wrap">' + esc(r.content || '') + '</div>'
      +   '<div class="activity-meta">' + fmtDate(it.at) + (who ? ' · ' + esc(who) : '') + '</div>'
      + '</div></div>';
  });
  const more = items.length > 5
    ? '<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="this.parentElement.querySelectorAll(\'[data-more]\').forEach(function(e){e.style.display=\'\'});this.remove()">顯示全部 ' + items.length + ' 筆</button>'
    : '';
  return '<div class="chart-card" style="margin-bottom:14px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    +   '<div class="chart-title">🕘 開發紀錄（來自原始線索，' + items.length + ' 筆）</div>'
    +   '<button class="btn btn-ghost btn-sm" onclick="openLeadDrawerFromAccount(\'' + acc.lead_id + '\')">開啟線索 ↗</button>'
    + '</div>'
    + (items.length ? '<div class="activity-list">' + html + more + '</div>' : '<div class="empty-state" style="padding:16px"><div class="empty-text">此線索沒有開發紀錄</div></div>')
    + '</div>';
}

function setSalesReportRange(kind) {
  const t = new Date(); const y = t.getFullYear(); const m = t.getMonth();
  let a, b;
  if (kind === 'month') { a = b = y + '-' + _pad2(m + 1); }
  else if (kind === 'lastmonth') { const d = new Date(y, m - 1, 1); a = b = d.getFullYear() + '-' + _pad2(d.getMonth() + 1); }
  else if (kind === 'quarter') { const qs = Math.floor(m / 3) * 3; a = y + '-' + _pad2(qs + 1); b = y + '-' + _pad2(qs + 3); }
  else { a = y + '-01'; b = y + '-12'; }
  document.getElementById('srFrom').value = a;
  document.getElementById('srTo').value = b;
  runSalesReport();
}

  });

  rows.forEach(function (r) { const k = r.業務; if (!by[k]) by[k] = { n: 0, total: 0, cat: {} }; by[k].n++; by[k].total += r.金額; by[k].cat[r.類型] = (by[k].cat[r.類型] || 0) + r.金額; grand += r.金額; });
  const period = from === to ? from.replace('-', '/') : from.replace('-', '/') + '–' + to.replace('-', '/');
  let h = '<div style="font-size:12.5px;color:var(--text3);margin-bottom:8px">' + period + '・依簽約日' + (window.isAdmin ? '' : '・只看你自己') + '</div>';
  Object.keys(by).sort(function (a, b) { return by[b].total - by[a].total; }).forEach(function (k) {
    const s = by[k];
    h += '<div class="perf-card"><div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-weight:600">' + esc(k) + '</div><div class="pc-n">$' + fmtNum(s.total) + '</div></div>'
      + '<div style="font-size:12.5px;color:var(--text3);margin-top:4px">' + s.n + ' 筆・' + Object.keys(s.cat).map(function (c) { return c + ' $' + fmtNum(s.cat[c]); }).join('・') + '</div></div>';
  });
  if (window.isAdmin && Object.keys(by).length > 1) h += '<div style="display:flex;justify-content:space-between;padding:6px 4px 10px;font-weight:700"><span>合計</span><span style="font-family:var(--mono)">$' + fmtNum(grand) + '</span></div>';
  h += '<div class="form-label" style="margin:6px 0 2px">明細</div>';

  });
  return h;

// ── 業績獎金（依 V3 制度，只算業績獎金；不含底薪與 KPI）──
// 規則集中在這裡，制度改版時只要改這個物件
const BONUS_RULES = {
  tiers: [ { upTo: 200000, rate: 0.10 }, { upTo: 500000, rate: 0.12 }, { upTo: Infinity, rate: 0.15 } ], // 當月累積標準業績，超額累進
  customRate: 0.05,   // 客製案件：整包成交價 × 5%，獨立計算
  renewalRate: 0.10   // 首次續約：純軟體續約金額 × 10%，限親自開發客戶、只發第一次
};
function bonusBucket(cat) {
  const c = cat || '主約';
  if (c === '主約' || c === '加購專案') return 'standard';
  if (c === '客製案件') return 'custom';
  if (c === '續約') return 'renewal';
  return 'none';
}
function pct(r) { return Math.round(r * 1000) / 10 + '%'; }
function calcTiered(amount) {
  const lines = []; let prev = 0, total = 0;
  BONUS_RULES.tiers.forEach(function (t) {
    if (amount <= prev) return;
    const portion = Math.min(amount, t.upTo) - prev;
    const b = Math.round(portion * t.rate);
    lines.push({ portion: portion, rate: t.rate, bonus: b });
    total += b; prev = t.upTo;
  });
  return { lines: lines, total: total };
}
function nextTierHint(amount) {
  let prev = 0;
  for (let i = 0; i < BONUS_RULES.tiers.length - 1; i++) {
    const t = BONUS_RULES.tiers[i];
    if (amount < t.upTo) return '再 $' + fmtNum(t.upTo - amount) + ' 標準業績，超出部分改抽 ' + pct(BONUS_RULES.tiers[i + 1].rate);
    prev = t.upTo;
  }
  return '';
}
function userNameById(uid, fallback) {
  const u = usersData.find(function (x) { return x.id === uid; });
  return u ? (u.full_name || u.email || '') : (fallback || '（未指定）');
}

// 把每筆成交轉成獎金項目：決定類別、歸屬業務、是否計獎
function buildBonusEntries(contracts, accounts) {
  const accMap = {}; (accounts || []).forEach(function (a) { accMap[a.id] = a; });
  const byAcc = {};
  contracts.forEach(function (c) { (byAcc[c.account_id] = byAcc[c.account_id] || []).push(c); });
  const sortFn = function (a, b) { return dealDate(a).localeCompare(dealDate(b)) || String(a.created_at || '').localeCompare(String(b.created_at || '')); };
  const firstRenewal = new Set(), devOf = {};
  Object.keys(byAcc).forEach(function (aid) {
    const list = byAcc[aid].slice().sort(sortFn);
    const firstMain = list.find(function (c) { return (c.deal_category || '主約') === '主約'; });
    devOf[aid] = (firstMain && (firstMain.sales_user_id || firstMain.user_id)) || (accMap[aid] && accMap[aid].user_id) || null;
    const fr = list.find(function (c) { return dealItems(c).some(function (it) { return it.bonus_type === 'renewal' && Number(it.amount) > 0; }); });
    if (fr) firstRenewal.add(fr.id);
  });
  const out = [];
  contracts.forEach(function (c) {
    const tot = {}; let all = 0;
    dealItems(c).forEach(function (it) { const a = Number(it.amount) || 0; if (a <= 0) return; const t = it.bonus_type || 'none'; tot[t] = (tot[t] || 0) + a; all += a; });
    const salesUid = c.sales_user_id || c.user_id;
    // 「依比例」的期數，只分攤「扣掉指定類別期數之後」剩下的部分
    const spec = {};
    dealInstallments(c).forEach(function (p) { if (p.alloc && p.alloc !== 'prorata') spec[p.alloc] = (spec[p.alloc] || 0) + (Number(p.amount) || 0); });
    const rem = {}; let remAll = 0;
    Object.keys(tot).forEach(function (t) { rem[t] = Math.max(0, tot[t] - (spec[t] || 0)); remAll += rem[t]; });
    const base = remAll > 0 ? rem : tot, baseAll = remAll > 0 ? remAll : all;
    dealInstallments(c).forEach(function (p, idx) {
      const paid = !!p.paid_date;
      const amt = paid ? instPaidAmt(p) : (Number(p.amount) || 0);
      if (!amt) return;
      const ym = String(paid ? p.paid_date : (p.due_date || dealDate(c))).slice(0, 7);
      const parts = {};
      if (p.alloc && p.alloc !== 'prorata') parts[p.alloc] = amt;
      else if (baseAll > 0) Object.keys(base).forEach(function (t) { if (base[t]) parts[t] = amt * base[t] / baseAll; });
      else parts.none = amt;
      Object.keys(parts).forEach(function (t) {
        let type = t, uid = salesUid, reason = '';
        if (t === 'renewal') {
          if (!firstRenewal.has(c.id)) { type = 'none'; reason = '非首次續約，不發放'; }
          else if (devOf[c.account_id]) { uid = devOf[c.account_id]; if (uid !== salesUid) reason = '歸屬原開發業務'; }
        }
        if (type === 'none' && !reason) reason = '不計獎金';
        out.push({ c: c, p: p, idx: idx, paid: paid, ym: ym, type: type, uid: uid, uname: userNameById(uid, c.sales_user_name),
                   amt: Math.round(parts[t]), reason: reason, acc: (accMap[c.account_id] || {}).name || '' });
      });
    });
  });
  return out;
}
function sumBonus(entries) {
  let std = 0, cus = 0, ren = 0;
  entries.forEach(function (e) {
    if (e.type === 'standard') std += e.amt; else if (e.type === 'custom') cus += e.amt; else if (e.type === 'renewal') ren += e.amt;
  });
  const tier = calcTiered(std);
  const cusB = Math.round(cus * BONUS_RULES.customRate), renB = Math.round(ren * BONUS_RULES.renewalRate);
  return { std: std, cus: cus, ren: ren, tier: tier, cusB: cusB, renB: renB, total: tier.total + cusB + renB };
}
function bonusBreakdownHtml(r) {
  const row = function (label, calc, val) {
    return '<tr><td style="font-weight:500;white-space:nowrap">' + label + '</td><td style="font-size:12.5px;color:var(--text2)">' + calc + '</td><td style="text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap">' + fmtNum(val) + ' 元</td></tr>';
  };
  const tierCalc = r.tier.lines.length
    ? r.tier.lines.map(function (l) { return fmtNum(l.portion) + ' × ' + pct(l.rate); }).join(' ＋ ') + ' ＝ ' + fmtNum(r.tier.total)
    : '標準業績 0';
  const hint = nextTierHint(r.std);
  return '<table class="data-table" style="margin-bottom:6px"><tbody>'
    + row('① 標準業績抽成', '標準業績 $' + fmtNum(r.std) + '：' + tierCalc, r.tier.total)
    + row('② 客製案件獎金', fmtNum(r.cus) + ' × ' + pct(BONUS_RULES.customRate), r.cusB)
    + row('③ 首次續約獎金', fmtNum(r.ren) + ' × ' + pct(BONUS_RULES.renewalRate), r.renB)
    + '<tr style="border-top:2px solid var(--border)"><td style="font-weight:700">業績獎金合計</td><td></td><td style="text-align:right;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent)">' + fmtNum(r.total) + ' 元</td></tr>'
    + '</tbody></table>'
    + (hint ? '<div style="font-size:12px;color:var(--text3);margin-bottom:12px">📈 ' + hint + '</div>' : '');
}

async function runBonusCalc() {
  const el = document.getElementById('bcResult');
  if (!el) return;
  if (!window._bcData) {
    el.innerHTML = '<div class="loading"><span class="dot-pulse">載入中</span></div>';
    const [ctRes, accRes] = await Promise.all([db.from('contracts').select('*'), db.from('accounts').select('id,name,user_id')]);
    if (ctRes.error) { el.innerHTML = '<div style="color:var(--red);font-size:13px">讀取失敗：' + esc(ctRes.error.message) + '</div>'; return; }
    window._bcData = buildBonusEntries(ctRes.data || [], accRes.data || []);
  }
  const ym = document.getElementById('bcMonth').value;
  const uid = document.getElementById('bcUser').value;
  const monthE = window._bcData.filter(function (e) { return e.ym === ym; });

  if (uid === 'all') {
    const groups = {};
    monthE.forEach(function (e) { (groups[e.uid || '_'] = groups[e.uid || '_'] || []).push(e); });
    const keys = Object.keys(groups);
    if (!keys.length) { el.innerHTML = '<div class="empty-state" style="padding:24px"><div class="empty-text">' + ym + ' 沒有收款或預計收款</div></div>'; return; }
    const rs = keys.map(function (k) {
      const g = groups[k];
      const paidR = sumBonus(g.filter(function (e) { return e.paid; }));
      const allR = sumBonus(g);
      return { uid: k, name: g[0].uname, r: paidR, pend: allR.total - paidR.total };
    }).sort(function (a, b) { return b.r.total - a.r.total; });
    const R = 'style="text-align:right;font-family:var(--mono)"';
    let h = '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>業務</th><th style="text-align:right">入帳標準業績</th><th style="text-align:right">標準抽成</th><th style="text-align:right">客製</th><th style="text-align:right">續約</th><th style="text-align:right">已入帳獎金</th><th style="text-align:right">待收預估</th></tr></thead><tbody>';
    let grand = 0, gp = 0;
    rs.forEach(function (x) {
      grand += x.r.total; gp += x.pend;
      h += '<tr style="cursor:pointer" onclick="document.getElementById(\'bcUser\').value=\'' + x.uid + '\';runBonusCalc()"><td style="font-weight:500">' + esc(x.name) + '</td>'
        + '<td ' + R + '>' + fmtNum(x.r.std) + '</td><td ' + R + '>' + fmtNum(x.r.tier.total) + '</td><td ' + R + '>' + fmtNum(x.r.cusB) + '</td><td ' + R + '>' + fmtNum(x.r.renB) + '</td>'
        + '<td style="text-align:right;font-family:var(--mono);font-weight:700">' + fmtNum(x.r.total) + '</td>'
        + '<td style="text-align:right;font-family:var(--mono);color:var(--text3)">' + (x.pend ? '+' + fmtNum(x.pend) : '—') + '</td></tr>';
    });
    h += '<tr style="border-top:2px solid var(--border)"><td style="font-weight:600">合計</td><td colspan="4"></td><td style="text-align:right;font-family:var(--mono);font-weight:700">' + fmtNum(grand) + '</td><td style="text-align:right;font-family:var(--mono);color:var(--text3)">' + (gp ? '+' + fmtNum(gp) : '—') + '</td></tr></tbody></table></div>'
      + '<div style="font-size:12px;color:var(--text3);margin-top:6px">「待收預估」＝本月預計收款但還沒收到的部分，全部收到後會增加的獎金。點一位業務可看明細。</div>';
    el.innerHTML = h;
    return;
  }

  const mine = monthE.filter(function (e) { return e.uid === uid; });
  const paidE = mine.filter(function (e) { return e.paid; });
  const r = sumBonus(paidE);
  const allR = sumBonus(mine);
  const pendAmt = mine.filter(function (e) { return !e.paid && e.type !== 'none'; }).reduce(function (s, e) { return s + e.amt; }, 0);
  let head = '<div style="font-size:12.5px;color:var(--text2);margin-bottom:6px">✅ 已入帳獎金（' + ym + ' 實際收到的款項）</div>' + bonusBreakdownHtml(r);
  if (pendAmt) head += '<div style="font-size:12.5px;padding:8px 10px;background:var(--bg3);border-radius:6px;margin-bottom:12px">⏳ 本月還有 <b style="font-family:var(--mono)">$' + fmtNum(pendAmt) + '</b> 預計收款尚未入帳；全部收到後本月獎金約 <b style="font-family:var(--mono)">' + fmtNum(allR.total) + '</b> 元（+' + fmtNum(allR.total - r.total) + '）</div>';
  let det = '';
  if (mine.length) {
    det = '<div class="form-label" style="margin:4px 0 6px">本月明細</div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>日期</th><th>客戶</th><th>期別</th><th>類別</th><th style="text-align:right">金額</th><th>狀態</th></tr></thead><tbody>';
    mine.sort(function (a, b) { return String(a.paid ? a.p.paid_date : a.p.due_date).localeCompare(String(b.paid ? b.p.paid_date : b.p.due_date)); }).forEach(function (e) {
      det += '<tr style="cursor:pointer;' + (e.type === 'none' ? 'opacity:0.55' : '') + '" onclick="closeModal();goToAccount(\'' + e.c.account_id + '\')">'
        + '<td style="font-size:12px">' + esc(e.paid ? e.p.paid_date : (e.p.due_date || '')) + '</td><td>' + esc(e.acc) + '</td>'
        + '<td style="font-size:12px">' + esc(e.p.label || '') + '</td><td>' + bonusTypeBadge(e.type) + '</td>'
        + '<td style="text-align:right;font-family:var(--mono)">' + fmtNum(e.amt) + '</td>'
        + '<td style="font-size:11.5px">' + (e.paid ? '<span style="color:var(--green)">已收</span>' : '<span style="color:var(--yellow)">未收</span>') + (e.reason ? ' <span style="color:var(--text3)">' + esc(e.reason) + '</span>' : '') + '</td></tr>';
    });
    det += '</tbody></table></div>';
  } else {
    det = '<div class="empty-state" style="padding:16px"><div class="empty-text">' + ym + ' 沒有收款或預計收款</div></div>';
  }
  el.innerHTML = head + det;
  const t1 = document.getElementById('bcT1'), t2 = document.getElementById('bcT2'), t3 = document.getElementById('bcT3');
  if (t1) { t1.value = r.std || ''; t2.value = r.cus || ''; t3.value = r.ren || ''; renderBonusTrial(); }
}

function renderBonusTrial() {

function exportSalesReport() {
  const rows = window._srRows || [];
  if (!rows.length) { toast('沒有可匯出的資料', 'error'); return; }
  const detail = rows.map(function (r) { const o = Object.assign({}, r); delete o._acc; return o; });
  const bySales = {};
  rows.forEach(function (r) {
    if (!bySales[r.業務]) { bySales[r.業務] = { 業務: r.業務 }; DEAL_CATEGORIES.forEach(function (c) { bySales[r.業務][c] = 0; }); bySales[r.業務].合計 = 0; bySales[r.業務].筆數 = 0; }
    const cat = DEAL_CATEGORIES.indexOf(r.類型) >= 0 ? r.類型 : '其他';
    bySales[r.業務][cat] += r.金額; bySales[r.業務].合計 += r.金額; bySales[r.業務].筆數 += 1;
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(Object.values(bySales)), '業務彙總');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detail), '成交明細');
  XLSX.writeFile(wb, 'saleflow_業績_' + (window._srRange || '') + '.xlsx');
}

const BACKUP_TABLES = ['leads','contacts','activities','notes','accounts','contracts','stages','sources','need_types','deal_types','activity_templates','user_profiles','cold_calls','call_logs'];
let _backupBusy = false;

function backupSectionHtml() {
  return '<div class="settings-section">'
    + '<div class="settings-title">💾 資料備份</div>'
    + '<div class="card">'
    +   '<div style="font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:10px">一鍵下載所有資料表。只讀取、不會修改任何資料。<br>會下載兩個檔：<b>.xlsx</b> 方便用 Excel 查看；<b>.json</b> 是完整原始資料（長內容不截斷），日後要還原請保留這個。</div>'
    +   '<button class="btn btn-primary btn-sm" id="backupBtn" onclick="backupAllData()">💾 下載完整備份</button>'
    +   '<div id="backupStatus" style="font-size:12px;color:var(--text3);margin-top:8px"></div>'
    + '</div></div>';
}

async function fetchAllRows(table) {
  const PAGE = 1000; let from = 0; const all = [];
  while (true) {
    const { data, error } = await db.from(table).select('*').range(from, from + PAGE - 1);
    if (error) throw new Error(table + '：' + error.message);
    all.push.apply(all, data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

async function backupAllData() {
  if (_backupBusy) return;
  _backupBusy = true;
  const btn = document.getElementById('backupBtn');
  const st = document.getElementById('backupStatus');
  if (btn) btn.disabled = true;
  const result = {}, counts = [], failed = [];
  try {
    for (const t of BACKUP_TABLES) {
      if (st) st.textContent = '讀取中：' + t + '…';
      try { result[t] = await fetchAllRows(t); counts.push(t + ' ' + result[t].length); }
      catch (e) { failed.push(e.message); }
    }
    const stamp = nowDateStr() + '_' + nowTimeStr().replace(':', '');
    const meta = { exported_at: new Date().toISOString(), exported_by: currentUser?.email || '', tables: {} };
    Object.keys(result).forEach(function (t) { meta.tables[t] = result[t].length; });
    // 1) JSON：完整原始資料
    const blob = new Blob([JSON.stringify({ meta: meta, data: result }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'saleflow_backup_' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    // 2) Excel：方便查看（陣列/物件轉成文字；超過 Excel 單格上限的內容會截斷，完整版請看 JSON）
    const wb = XLSX.utils.book_new();
    Object.keys(result).forEach(function (t) {
      const rows = result[t].map(function (r) {
        const o = {};
        Object.keys(r).forEach(function (k) {
          let v = r[k];
          if (v !== null && typeof v === 'object') v = JSON.stringify(v);
          if (typeof v === 'string' && v.length > 32000) v = v.slice(0, 32000) + '…(已截斷，完整內容見 JSON)';
          o[k] = v;
        });
        return o;
      });
      XLSX.utils.book_append_sheet(wb, rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['(無資料)']]), t.slice(0, 31));
    });
    setTimeout(function () { XLSX.writeFile(wb, 'saleflow_backup_' + stamp + '.xlsx'); }, 600);
    if (st) st.innerHTML = '✅ 完成：' + esc(counts.join('、')) + (failed.length ? '<br><span style="color:var(--red)">⚠️ 讀取失敗：' + esc(failed.join('；')) + '</span>' : '');
    toast(failed.length ? '備份完成，但有資料表讀取失敗' : '備份已下載', failed.length ? 'error' : 'success');
  } catch (e) {
    if (st) st.innerHTML = '<span style="color:var(--red)">備份失敗：' + esc(e.message) + '</span>';
    toast('備份失敗：' + e.message, 'error');
  } finally {
    _backupBusy = false;
    if (btn) btn.disabled = false;
  }
}

let stageDragSrc = null;
function stageDragStart(e, el) {
  stageDragSrc = el;
  el.style.opacity = '0.4';
  e.dataTransfer.effectAllowed = 'move';
}
function stageDragOver(e, el) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (el !== stageDragSrc) {
    el.style.borderTop = '2px solid var(--accent)';
  }
}
function stageDrop(e, el) {
  e.stopPropagation(); e.preventDefault();
  document.querySelectorAll('.stage-drag-item').forEach(i => i.style.borderTop = '');
  if (stageDragSrc && el !== stageDragSrc) {
    const list = document.getElementById('stagesDragList');
    const items = [...list.querySelectorAll('.stage-drag-item')];
    const srcIdx = items.indexOf(stageDragSrc);
    const tgtIdx = items.indexOf(el);
    if (srcIdx < tgtIdx) list.insertBefore(stageDragSrc, el.nextSibling);
    else list.insertBefore(stageDragSrc, el);
    saveStageOrder();
  }
}
function stageDragEnd() {
  document.querySelectorAll('.stage-drag-item').forEach(i => {
    i.style.opacity = '';
    i.style.borderTop = '';
  });
  stageDragSrc = null;
}
async function saveStageOrder() {
  const items = document.querySelectorAll('#stagesDragList .stage-drag-item');
  for (let i = 0; i < items.length; i++) {
    const id = items[i].dataset.id;
    await db.from('stages').update({ order_index: i }).eq('id', id);
    const stage = stagesData.find(s => s.id === id);
    if (stage) stage.order_index = i;
  }
  stagesData.sort((a,b) => (a.order_index||0) - (b.order_index||0));
  toast('階段順序已儲存', 'success');
}

async function createUser() {
  const name  = document.getElementById('newUserName')?.value.trim();
  const email = document.getElementById('newUserEmail')?.value.trim();
  const pass  = document.getElementById('newUserPass')?.value;
  const role  = document.getElementById('newUserRole')?.value || 'sales';
  if (!name || !email || !pass) { toast('請填寫姓名、Email 和密碼', 'error'); return; }
  if (pass.length < 6) { toast('密碼至少 6 碼', 'error'); return; }

  // Save admin session BEFORE signUp (signUp may overwrite current session)
  let adminSession = null;
  try {
    const { data: sd } = await db.auth.getSession();
    adminSession = sd?.session;
  } catch(e) {}

  // Disable button to show it's working
  const createBtn = document.querySelector('button[onclick="createUser()"]');
  if (createBtn) { createBtn.disabled = true; createBtn.textContent = '建立中...'; }

  // Create new auth user
  const { data, error } = await db.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });

  // Re-enable button
  if (createBtn) { createBtn.disabled = false; createBtn.textContent = '＋ 建立帳號'; }

  // Always restore admin session first
  if (adminSession) {
    try { await db.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token }); currentUser = adminSession.user; } catch(e) {}
  }

  if (error) { toast('建立失敗：' + error.message, 'error'); return; }

  const userId = data.user?.id;
  if (!userId) {
    // Supabase email confirmation is ON - user created but needs email confirm
    toast('✅ 帳號已建立！對方需點擊確認信才能登入。（如要關閉此限制，請至 Supabase → Auth → Email → 關閉 Confirm email）', 'success');
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserEmail').value = '';
    document.getElementById('newUserPass').value = '';
    return;
  }

  // Insert profile
  const { error: profileErr } = await db.from('user_profiles').insert({ id: userId, full_name: name, role, created_at: new Date().toISOString() });
  if (profileErr) { toast('帳號建立成功但 profile 寫入失敗：' + profileErr.message, 'error'); return; }

  document.getElementById('newUserName').value = '';
  document.getElementById('newUserEmail').value = '';
  document.getElementById('newUserPass').value = '';
  toast('✅ 帳號建立成功：' + name + ' (' + email + ')', 'success');
  renderUsersList();
}

  ]);

  const acts = (actsRes.data || []).map(a => ({...a, _type: 'activity'}));
  const notes = (notesRes.data || []).filter(n => n.lead_id).map(n => ({...n, _type: 'note'}));
  const combined = [...acts, ...notes].sort((a,b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 200);

  document.getElementById('topbarActions').innerHTML = `
    <div class="action-bar">
      <button class="btn btn-secondary btn-sm feed-filter-btn active" data-filter="all" onclick="setFeedFilter('all',this)">全部</button>
      <button class="btn btn-secondary btn-sm feed-filter-btn" data-filter="activity" onclick="setFeedFilter('activity',this)">活動</button>
      <button class="btn btn-secondary btn-sm feed-filter-btn" data-filter="note" onclick="setFeedFilter('note',this)">備註</button>
    </div>
  `;

  window._feedItems = combined;
  renderFeedList(combined);
}

function setFeedFilter(filter, btn) {
  document.querySelectorAll('.feed-filter-btn').forEach(b => { b.classList.remove('active'); });
  btn.classList.add('active');
  const items = filter === 'all' ? window._feedItems : window._feedItems.filter(i => i._type === filter);
  renderFeedList(items);
}

function renderFeedList(items) {
  const content = document.getElementById('content');
  if (!items.length) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">📰</div><div class="empty-text">尚無動態</div></div>';
    return;
  }
  const rows = items.map(item => {
    const isAct = item._type === 'activity';
    const t = isAct ? (ACTIVITY_TYPES[item.type] || ACTIVITY_TYPES['note']) : null;
    const icon = isAct ? t.icon : '📝';
    const iconColor = isAct ? t.color : '#6b7280';
    const typeLabel = isAct ? t.label : '備註';
    const lead = item.leads;
    const contact = item.contacts;
    const leadInfo = lead ? `<span style="color:var(--accent);cursor:pointer;font-size:11.5px" onclick="event.stopPropagation();openLeadFromFeed('${lead.id}')">${esc(lead.name)}${lead.company?' · '+esc(lead.company):''}</span>` : '';
    const contactInfo = contact ? `<span style="font-size:11px;color:var(--text3)"> · ${esc(contact.name)}</span>` : '';
    return `
      <div style="display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s" onmouseenter="this.style.background='var(--bg3)'" onmouseleave="this.style.background=''" onclick="openLeadFromFeed('${item.lead_id}')">
        <div style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:${iconColor}20;color:${iconColor}">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;flex-wrap:wrap">
            <span style="font-size:12px;font-weight:600;color:var(--text2)">${typeLabel}</span>
            ${leadInfo}${contactInfo}
          </div>
          <div style="font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word">${esc(item.content||'')}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${fmtDate(item.created_at)}</div>
        </div>
      </div>`;
  }).join('');
  content.innerHTML = `<div class="panel">${rows}</div>`;
}

async function exportLeadsExcel() {
  const { data: leads } = await db.from('leads').select('*, stages(name), sources(name)');
  const { data: contacts } = await db.from('contacts').select('*');
  const prioLabel = {high:'高', mid:'中', low:'低'};

  // Sheet1: Leads 總覽（含 ID 供更新用）
  const leadRows = (leads||[]).map(l => ({
    'Lead_ID':        l.id,
    '公司名稱':       l.name,
    '統一編號':       l.tax_id || '',
    '階段':           l.stages?.name || '',
    '來源':           l.sources?.name || '',
    '負責業務':       l.user_name || '',
    '產業（產品類型）': l.product_type || '',
    '需求類型':       (l.need_types||[]).map(id => needTypesData.find(n=>n.id===id)?.name||id).join(';'),
    '預估金額':       l.amount || '',
    '優先級':         prioLabel[l.priority] || '',
    '建立時間':       fmtDate(l.created_at),
  }));

  // Sheet2: 可重新匯入格式（聯絡人為主體）
  const importRows = (leads||[]).flatMap(l => {
    const lcs = (contacts||[]).filter(c => c.lead_id === l.id);
    const base = {
      'Lead_ID': l.id,
      '公司名稱': l.name,
      '負責業務': l.user_name || '',
      '階段': l.stages?.name || '',
      '來源': l.sources?.name || '',
      '產業（產品類型）': l.product_type || '',
      '需求類型': (l.need_types||[]).map(id => needTypesData.find(n=>n.id===id)?.name||id).join(';'),
      '預估金額': l.amount || '',
      '優先級': prioLabel[l.priority] || '',
    };
    if (!lcs.length) return [{ ...base, '聯絡人_姓名':'', '聯絡人_職稱':'', '聯絡人_Email':'', '聯絡人_電話':'', '聯絡人_LINE':'' }];
    return lcs.map(c => ({ ...base, '聯絡人_姓名':c.name, '聯絡人_職稱':c.role||'', '聯絡人_Email':c.email||'', '聯絡人_電話':c.phone||'', '聯絡人_LINE':c.line_id||'' }));
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(leadRows),   'Leads 總覽');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(importRows), '可重新匯入格式');

}

// ── Import / Export ──
function importLeadsExcel() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheetName = wb.SheetNames.find(n => !n.includes('說明') && !n.includes('欄位')) || wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName]);
    if (!rows.length) { toast('檔案無資料', 'error'); return; }
    const prioMap = {'高':'high','中':'mid','低':'low','high':'high','mid':'mid','low':'low'};
    const leadMap = {};
    let addCount = 0, updateCount = 0, contactCount = 0, skipCount = 0;
    const userName = document.getElementById('lUserName')?.value.trim() || currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '';
    for (const row of rows) {
      const leadName = String(row['公司名稱'] || row['名稱'] || row['name'] || '').trim();
      if (!leadName) continue;
      const rawId = String(row['Lead_ID'] || row['lead_id'] || '').trim();
      const leadId = (rawId && !rawId.includes('留空') && !rawId.includes('取得') && rawId.length > 10) ? rawId : '';
      const key = leadId || leadName;
      if (!leadMap[key]) {
        if (leadId) {
          const updates = {};
          const stageName = String(row['階段'] || '').trim();
          const srcName = String(row['來源'] || '').trim();
          const prio = String(row['優先級'] || '').trim();
          const amt = row['預估金額'];
          const pt = String(row['產業（產品類型）'] || row['產業'] || '').trim();
          if (stageName) { const s = stagesData.find(s => s.name === stageName); if (s) updates.stage_id = s.id; }
          if (srcName)   { const s = sourcesData.find(s => s.name === srcName);  if (s) updates.source_id = s.id; }
          if (prio)      updates.priority = prioMap[prio] || null;
          if (amt)       updates.amount = parseFloat(amt) || null;
          if (pt)        updates.product_type = pt;
          const updNeedNames = String(row['需求類型'] || '').split(';').map(s=>s.trim()).filter(Boolean);
          const updNeedIds = updNeedNames.map(n => needTypesData.find(t=>t.name===n)?.id).filter(Boolean);
          if (updNeedIds.length) updates.need_types = updNeedIds;
          const rowUser = String(row['負責業務'] || '').trim();
          if (rowUser) updates.user_name = rowUser;
          updates.updated_at = new Date().toISOString();
          const { error } = await db.from('leads').update(updates).eq('id', leadId);
          if (error) { skipCount++; continue; }
          const note = String(row['備註'] || '').trim();
          if (note) await db.from('notes').insert({ content: '[匯入更新] ' + note, lead_id: leadId, user_id: currentUser.id, created_at: new Date().toISOString() });
          leadMap[key] = { id: leadId };
          updateCount++;
        } else {
          const stageName = String(row['階段'] || '').trim();
          const srcName = String(row['來源'] || '').trim();
          const stage = stagesData.find(s => s.name === stageName) || stagesData[0];
          const src = sourcesData.find(s => s.name === srcName);
          const pt = String(row['產業（產品類型）'] || row['產業'] || '').trim();
          // 需求類型：分號分隔，對應 needTypesData
          const needTypeNames = String(row['需求類型'] || '').split(';').map(s=>s.trim()).filter(Boolean);
          const needTypeIds = needTypeNames.map(n => needTypesData.find(t=>t.name===n)?.id).filter(Boolean);
          // 負責業務：優先用欄位，否則用匯入者
          const rowUserName = String(row['負責業務'] || '').trim() || userName;
          const { data: lead, error } = await db.from('leads').insert({
            name: leadName,
            amount: parseFloat(row['預估金額'] || '') || null,
            priority: prioMap[String(row['優先級']||'').trim()] || null,
            stage_id: stage?.id,
            source_id: src?.id || null,
            product_type: pt || null,
            need_types: needTypeIds.length ? needTypeIds : null,
            user_id: currentUser.id, user_name: rowUserName, created_at: new Date().toISOString()
          }).select().single();
          if (error || !lead) { skipCount++; continue; }
          const note = String(row['備註'] || '').trim();
          if (note) await db.from('notes').insert({ content: note, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
          leadMap[key] = lead;
          addCount++;
        }
      }
      const cName = String(row['聯絡人_姓名'] || '').trim();
      if (cName && leadMap[key]?.id) {
        await db.from('contacts').insert({
          name: cName,
          role:    String(row['聯絡人_職稱'] || '').trim(),
          email:   String(row['聯絡人_Email'] || '').trim(),
          phone:   String(row['聯絡人_電話'] || '').trim(),
          line_id: String(row['聯絡人_LINE']  || '').trim() || null,
          lead_id: leadMap[key].id, user_id: currentUser.id, created_at: new Date().toISOString()
        });
        contactCount++;
      }
    }
    toast('匯入完成：新增 ' + addCount + ' 筆、更新 ' + updateCount + ' 筆' + (contactCount ? '，聯絡人 ' + contactCount + ' 位' : '') + (skipCount ? '，跳過 ' + skipCount + ' 筆' : ''), 'success');
    navigate('leads');
  };
  input.click();
}

async function clearNextContact(leadId) {
  await db.from('leads').update({ next_contact_date: null, updated_at: new Date().toISOString() }).eq('id', leadId);

  closeModal();
  toast('已清除下次聯絡日期', 'success');
  refreshCurrentView(leadId);
}

// ── Utility Functions ──
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtDate(d) {
  if (!d) return '—';
  try {
    return new Date(d).toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
  } catch { return d; }
}

function fmtNum(n) {
  if (!n) return '0';
  return Number(n).toLocaleString();
}

function getStageName(stageId) {
  return stagesData.find(s => s.id === stageId)?.name || '';
}

function openModal(title, bodyHTML, buttons) {
  document.getElementById('modalBox').style.maxWidth = '';
  document.getElementById('modalFooter').style.display = '';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  const footer = document.getElementById('modalFooter');
  footer.innerHTML = '';
  (buttons||[]).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'btn-secondary');
    btn.textContent = b.label;
    btn.onclick = b.action;
    footer.appendChild(btn);
  });
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
  if (typeof _recognition !== 'undefined' && _recognition) { try { _recognition.stop(); } catch(e){} _recognition = null; }
  document.getElementById('modalOverlay').style.display = 'none';
}

let _modalMouseDownOnBg = false;
function modalBgMouseDown(e) {
  // 只有 mousedown 真的發生在背景上才算數（在輸入框內選字、拖曳到外面放開，不會被誤判成點背景）
  _modalMouseDownOnBg = (e.target === document.getElementById('modalOverlay'));
}
function closeModalOnBg(e) {
  if (e.target !== document.getElementById('modalOverlay')) return;
  if (!_modalMouseDownOnBg) return;
  _modalMouseDownOnBg = false;
  if (containerHasTypedContent(document.getElementById('modalBody'))) {
    toast('有尚未儲存的輸入內容，為避免遺失請用「取消」或 ✕ 關閉', 'error');
    return;
  }
  closeModal();
}

function openConfirm(title, msg, onConfirm, onCancel, confirmLabel, cancelLabel) {
  openModal(title, '<div style="font-size:14px;line-height:1.6;color:var(--text2)">' + msg + '</div>', [
    { label: cancelLabel||'取消', cls: 'btn-secondary', action: onCancel||closeModal },
    { label: confirmLabel||'確認', cls: 'btn-danger', action: onConfirm }
  ]);
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast toast-' + (type||'success');
  t.innerHTML = (type==='error'?'✕ ':'✓ ') + esc(msg);
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

async function quickStageChange(leadId, stageId) {
  await db.from('leads').update({ stage_id: stageId, updated_at: new Date().toISOString() }).eq('id', leadId);
  // Update local data
  const lead = leadsData.find(l => l.id === leadId);
  if (lead) lead.stage_id = stageId;
  const stageName = stagesData.find(s=>s.id===stageId)?.name||'';
  toast('階段已更新：' + stageName, 'success');
  // Re-render kanban in background so it reflects the change
  renderKanban(document.getElementById('leadSearch')?.value || '');
  // Re-render drawer info with fresh data
  const { data: updatedLead } = await db.from('leads').select('*').eq('id', leadId).single();
  if (updatedLead) renderDrawerInfo(updatedLead);
  // Check for 簽約進件 auto-convert
  if (stageName === '簽約進件' && !convertedLeadIds.has(leadId)) {
    openConvertModal(leadId);
  }
}

// ── Auto session restore on page load ──
let _appBooted = false;

// Listen for auth changes FIRST before checking session
db.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_OUT') {
    _appBooted = false;
    currentUser = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-page').style.display = 'flex';
  } else if (event === 'TOKEN_REFRESHED' && session) {
    currentUser = session.user;
  }
  // SIGNED_IN is intentionally NOT handled here - handled by doLogin/bootApp directly
});

// Check for existing session on load
(async () => {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (session?.user && !_appBooted) {
      currentUser = session.user;
      _appBooted = true;
      await bootApp();
    } else if (!session) {
      document.getElementById('login-page').style.display = 'flex';
    }
  } catch(e) {
    document.getElementById('login-page').style.display = 'flex';
  }
})();
