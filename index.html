<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaleFlow CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11;
  --bg2: #16181c;
  --bg3: #1e2026;
  --bg4: #252830;
  --border: #2e3138;
  --border2: #3a3d46;
  --text: #e8eaf0;
  --text2: #9ca3af;
  --text3: #6b7280;
  --accent: #6c8cff;
  --accent2: #4d6ef5;
  --accent-glow: rgba(108,140,255,0.15);
  --green: #34d399;
  --green-bg: rgba(52,211,153,0.1);
  --yellow: #fbbf24;
  --yellow-bg: rgba(251,191,36,0.1);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.1);
  --cyan: #22d3ee;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── Layout ── */
#app { display: flex; height: 100vh; }
#sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s; }
#sidebar.collapsed { width: 60px; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar { height: 56px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
#content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Sidebar ── */
.sidebar-logo { padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.logo-text { font-weight: 600; font-size: 15px; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; }
.sidebar-nav { flex: 1; padding: 8px; overflow-y: auto; }
.nav-section { margin-bottom: 4px; }
.nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); padding: 8px 8px 4px; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); transition: all 0.15s; white-space: nowrap; overflow: hidden; font-size: 13.5px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--accent-glow); color: var(--accent); }
.nav-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-text { overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer { padding: 12px 8px; border-top: 1px solid var(--border); }
.user-card { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.user-card:hover { background: var(--bg3); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.user-info { overflow: hidden; }
.user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-email { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Topbar ── */
.topbar-title { font-size: 16px; font-weight: 600; flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg4); border-color: var(--border2); }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--bg3); color: var(--text); }
.btn-danger { background: var(--red-bg); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
.btn-danger:hover { background: rgba(248,113,113,0.2); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 7px; }

/* ── Cards & Panels ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* ── Page header ── */
.page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.4px; }
.page-subtitle { font-size: 13px; color: var(--text3); margin-left: 4px; }

/* ── Badge ── */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-blue { background: var(--accent-glow); color: var(--accent); }
.badge-green { background: var(--green-bg); color: var(--green); }
.badge-yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge-red { background: var(--red-bg); color: var(--red); }
.badge-purple { background: var(--purple-bg); color: var(--purple); }
.badge-gray { background: var(--bg4); color: var(--text3); }

/* ── Forms ── */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
.form-input, .form-select, .form-textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 11px; color: var(--text); font-family: var(--font); font-size: 13px; outline: none; transition: border-color 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--bg3); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }
.modal-lg { max-width: 720px; }
.modal-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 18px 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* ── Drawer ── */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; background: var(--bg2); border-left: 1px solid var(--border); z-index: 151; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s ease; box-shadow: -8px 0 40px rgba(0,0,0,0.4); }
.drawer.open { transform: translateX(0); }
.drawer-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.drawer-title { font-size: 15px; font-weight: 600; flex: 1; }
.drawer-body { flex: 1; overflow-y: auto; }
.drawer-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 20px; flex-shrink: 0; }
.drawer-tab { padding: 10px 14px; font-size: 13px; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.drawer-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.drawer-tab:hover:not(.active) { color: var(--text); }
.drawer-panel { padding: 16px 20px; display: none; }
.drawer-panel.active { display: block; }

/* ── Kanban ── */
#kanban-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; min-height: calc(100vh - 160px); }
.kanban-col { flex-shrink: 0; width: 240px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); display: flex; flex-direction: column; max-height: calc(100vh - 160px); }
.kanban-col-header { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.kanban-col-title { font-size: 12.5px; font-weight: 600; }
.kanban-col-count { font-size: 11px; color: var(--text3); background: var(--bg4); padding: 1px 7px; border-radius: 10px; }
.kanban-cards { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
.kanban-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px; cursor: grab; transition: all 0.15s; position: relative; }
.kanban-card:hover { border-color: var(--border2); box-shadow: 0 2px 12px rgba(0,0,0,0.3); transform: translateY(-1px); }
.kanban-card.dragging { opacity: 0.4; }
.kanban-card.drag-over { border-color: var(--accent); background: var(--accent-glow); }
.kanban-col.drag-over-col .kanban-cards { background: var(--accent-glow); border-radius: 6px; }
.kc-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.kc-company { font-size: 11.5px; color: var(--text3); margin-bottom: 6px; }
.kc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kc-tag { font-size: 10.5px; color: var(--text3); background: var(--bg4); padding: 1px 6px; border-radius: 4px; }
.kc-prio { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.prio-high { background: var(--red); }
.prio-mid { background: var(--yellow); }
.prio-low { background: var(--green); }
.add-card-btn { margin: 6px 8px 8px; padding: 6px; border-radius: 6px; border: 1px dashed var(--border); background: transparent; color: var(--text3); cursor: pointer; font-size: 12px; text-align: center; transition: all 0.15s; }
.add-card-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Dashboard ── */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.stat-label { font-size: 11.5px; color: var(--text3); margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; line-height: 1; margin-bottom: 4px; }
.stat-sub { font-size: 12px; color: var(--text3); }
.stat-green { color: var(--green); }
.stat-yellow { color: var(--yellow); }
.stat-red { color: var(--red); }
.stat-accent { color: var(--accent); }
.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.chart-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; }

/* Funnel chart */
.funnel { display: flex; flex-direction: column; gap: 4px; }
.funnel-row { display: flex; align-items: center; gap: 10px; }
.funnel-label { font-size: 11.5px; color: var(--text2); width: 110px; flex-shrink: 0; text-align: right; }
.funnel-bar-wrap { flex: 1; background: var(--bg3); border-radius: 4px; height: 22px; overflow: hidden; }
.funnel-bar { height: 100%; background: var(--accent); border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 11px; font-weight: 600; color: #fff; min-width: 30px; transition: width 0.6s ease; }

/* Contract reminders */
.reminder-list { display: flex; flex-direction: column; gap: 8px; }
.reminder-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg3); border-radius: 8px; }
.reminder-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.reminder-name { font-size: 13px; font-weight: 500; flex: 1; }
.reminder-date { font-size: 11.5px; color: var(--text3); }
.reminder-days { font-size: 11px; font-weight: 600; }

/* ── Accounts table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; padding: 10px 12px; font-size: 11.5px; font-weight: 600; color: var(--text3); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.04em; }
.data-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg3); }
.data-table tr { cursor: pointer; }

/* ── Activity ── */
.activity-list { display: flex; flex-direction: column; gap: 0; }
.activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.activity-content { flex: 1; }
.activity-type { font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.activity-note { font-size: 12.5px; color: var(--text2); margin-bottom: 4px; }
.activity-meta { font-size: 11px; color: var(--text3); }

/* ── Notes ── */
.note-item { padding: 12px; background: var(--bg3); border-radius: 8px; margin-bottom: 8px; }
.note-text { font-size: 13px; color: var(--text2); margin-bottom: 6px; white-space: pre-wrap; }
.note-meta { font-size: 11px; color: var(--text3); }

/* ── Contacts ── */
.contact-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg3); border-radius: 8px; margin-bottom: 6px; }
.contact-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.contact-info { flex: 1; }
.contact-name { font-size: 13px; font-weight: 500; }
.contact-role { font-size: 11.5px; color: var(--text3); }
.contact-actions { display: flex; gap: 4px; }

/* ── Login ── */
#login-page { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 300; }
.login-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; width: 360px; box-shadow: var(--shadow); }
.login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.login-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.login-sub { font-size: 13px; color: var(--text3); margin-top: 2px; }
.login-error { background: var(--red-bg); border: 1px solid rgba(248,113,113,0.2); color: var(--red); padding: 8px 12px; border-radius: 6px; font-size: 12.5px; margin-bottom: 14px; display: none; }

/* ── Settings ── */
.settings-section { margin-bottom: 28px; }
.settings-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-item { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; font-size: 12.5px; }
.tag-del { color: var(--text3); cursor: pointer; font-size: 14px; line-height: 1; }
.tag-del:hover { color: var(--red); }
.tag-add { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: transparent; border: 1px dashed var(--border2); border-radius: 20px; font-size: 12.5px; color: var(--text3); cursor: pointer; }
.tag-add:hover { border-color: var(--accent); color: var(--accent); }

/* ── Misc ── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-text { font-size: 14px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.items-center { align-items: center; }
.gap-2 { gap: 8px; }
.mt-1 { margin-top: 4px; }
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text3); font-size: 13px; }
.dot-pulse::after { content: '...'; animation: dots 1.2s infinite; }
@keyframes dots { 0%,20% { content: '.'; } 40%,60% { content: '..'; } 80%,100% { content: '...'; } }

/* search bar */
.search-wrap { position: relative; }
.search-wrap input { padding-left: 32px; width: 220px; }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; pointer-events: none; }

/* tooltip */
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--bg4); color: var(--text); font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none; z-index: 999; border: 1px solid var(--border); }

/* import/export bar */
.action-bar { display: flex; align-items: center; gap: 8px; }

/* col stage color accent */
.col-accent { width: 3px; border-radius: 2px; height: 14px; flex-shrink: 0; }

/* Notification */
.toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow); pointer-events: all; animation: slideUp 0.2s ease; max-width: 300px; display: flex; align-items: center; gap: 8px; }
@keyframes slideUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
.toast.success { border-color: rgba(52,211,153,0.3); }
.toast.error { border-color: rgba(248,113,113,0.3); }

/* Confirm dialog */
.confirm-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 380px; text-align: center; box-shadow: var(--shadow); }
.confirm-icon { font-size: 36px; margin-bottom: 12px; }
.confirm-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.confirm-desc { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
.confirm-btns { display: flex; justify-content: center; gap: 10px; }


/* ── List View ── */
.leads-list-table { width: 100%; border-collapse: collapse; }
.list-row-selected td { background: var(--accent-glow) !important; }
.leads-list-table th { text-align:left; padding:9px 12px; font-size:11px; font-weight:600; color:var(--text3); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap; }
.leads-list-table td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.leads-list-table tr:last-child td { border-bottom:none; }
.leads-list-table tr:hover td { background:var(--bg3); cursor:pointer; }
.view-toggle { display:flex; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px; gap:2px; }
.view-toggle-btn { padding:4px 10px; border-radius:4px; font-size:12px; cursor:pointer; color:var(--text3); transition:all 0.15s; border:none; background:transparent; }
.view-toggle-btn.active { background:var(--bg4); color:var(--text); }

/* ── Kanban filter bar ── */
.kanban-filters { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:0 0 12px 0; }
.filter-chip { padding:3px 10px; border-radius:20px; font-size:12px; cursor:pointer; color:var(--text3); background:var(--bg3); border:1px solid var(--border); transition:all 0.15s; white-space:nowrap; }
.filter-chip.active { background:var(--accent-glow); color:var(--accent); border-color:var(--accent); }
.filter-chip:hover:not(.active) { border-color:var(--border2); color:var(--text); }

/* ── Activity Feed ── */
.feed-item { display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); transition:background 0.1s; }
.feed-item:hover { background:var(--bg3); }
.feed-item:last-child { border-bottom:none; }
.feed-lead-link { font-size:11.5px; color:var(--accent); cursor:pointer; }
.feed-lead-link:hover { text-decoration:underline; }

/* ── Contract Notes ── */
.contract-card { background:var(--bg3); border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden; }
.contract-card-header { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.contract-card-header:hover { background:var(--bg4); }
.contract-card-body { padding:10px 14px; border-top:1px solid var(--border); }
.contract-note-item { padding:8px 10px; background:var(--bg2); border-radius:6px; margin-bottom:6px; font-size:12.5px; color:var(--text2); }
.contract-note-meta { font-size:11px; color:var(--text3); margin-top:3px; }

/* ── Template chips ── */
.tpl-chip { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:var(--bg3); border:1px solid var(--border); border-radius:20px; font-size:12px; cursor:pointer; transition:all 0.15s; margin:2px; }
.tpl-chip:hover { border-color:var(--accent); color:var(--accent); }

/* ── Stage drag item ── */
.stage-drag-item { user-select:none; transition:border 0.1s; }
.stage-drag-item:active { cursor:grabbing; }

/* ── Need type tags ── */
.need-tag { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; background:var(--purple-bg); border:1px solid rgba(167,139,250,0.3); border-radius:20px; font-size:11.5px; color:var(--purple); margin:2px; cursor:pointer; transition:all 0.15s; }
.need-tag.selected { background:var(--purple); color:#fff; border-color:var(--purple); }
.need-tag:hover:not(.selected) { border-color:var(--purple); }

/* ── Bottom nav (mobile) ── */
#bottom-nav { display:none; position:fixed; bottom:0; left:0; right:0; height:60px; background:var(--bg2); border-top:1px solid var(--border); z-index:100; align-items:center; justify-content:space-around; padding:0 4px; }
.bnav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 10px; cursor:pointer; color:var(--text3); border-radius:8px; min-width:52px; transition:all 0.15s; }
.bnav-item.active { color:var(--accent); }
.bnav-icon { font-size:20px; line-height:1; }
.bnav-label { font-size:10px; font-weight:500; white-space:nowrap; }

/* ── FAB (mobile) ── */
#fab { display:none; position:fixed; bottom:72px; right:16px; width:52px; height:52px; background:var(--accent); border-radius:50%; border:none; cursor:pointer; z-index:101; font-size:24px; color:#fff; box-shadow:0 4px 16px rgba(108,140,255,0.4); align-items:center; justify-content:center; transition:transform 0.15s; }
#fab:hover { transform:scale(1.08); }

/* ── Mobile drawer full-screen ── */
@media (max-width: 768px) {
  html, body { overflow:hidden; }
  #app { flex-direction:column; }
  #sidebar { display:none !important; }
  #main { flex:1; overflow:hidden; padding-bottom:60px; }
  #topbar { height:52px; padding:0 14px; }
  .topbar-title { font-size:15px; }
  #topbarActions { display:none; }
  #content { padding:14px; }
  #bottom-nav { display:flex; }
  #fab { display:flex; }
  .drawer { width:100% !important; }
  .modal { max-width:100% !important; margin:0; border-radius:16px 16px 0 0; position:fixed; bottom:0; left:0; right:0; max-height:92vh; }
  .modal-overlay { align-items:flex-end; padding:0; }
  #kanban-board { gap:8px; }
  .kanban-col { width:220px; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .charts-grid { grid-template-columns:1fr; }
  .form-row { grid-template-columns:1fr; gap:0; }
  .login-card { width:100%; max-width:360px; padding:28px 20px; }
  .action-bar { flex-wrap:wrap; gap:6px; }
}

/* ── Tablet ── */
@media (max-width: 900px) and (min-width: 769px) {
  #sidebar { width:60px; }
  .nav-text, .logo-text, .user-info, .nav-label { display:none; }
  .stats-grid { grid-template-columns:1fr 1fr; }
  .charts-grid { grid-template-columns:1fr; }
}

.stage-0 { background: #4b5563; }
.stage-1 { background: #3b82f6; }
.stage-2 { background: #8b5cf6; }
.stage-3 { background: #ec4899; }

// ── DB Setup ──
async function initDB() {
  // Create tables if not exist via RPC or just catch errors
  // We rely on Supabase auto-handling; tables should be created via SQL migration
  // But for demo, we try to seed default stages if empty
  try {
    const { data } = await db.from('stages').select('id').limit(1);
    if (!data || data.length === 0) {
      for (let i = 0; i < DEFAULT_STAGES.length; i++) {
        await db.from('stages').insert({ name: DEFAULT_STAGES[i], order_index: i, color: STAGE_COLORS[i] });
      }
    }
  } catch(e) {}
}

// ── Auth ──
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!email || !pass) { showLoginError('請填寫帳號和密碼'); return; }
  try {
    const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
    if (error) { showLoginError(error.message); return; }
    currentUser = data.user;
    _appBooted = true;
    await bootApp();
  } catch(e) { showLoginError('登入失敗，請稍後再試'); }
}

function toggleRegister(show) {
  document.getElementById('loginForm').style.display = show ? 'none' : 'block';
  document.getElementById('registerForm').style.display = show ? 'block' : 'none';
  document.getElementById('loginError').style.display = 'none';
}

async function doRegister() {
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const name = document.getElementById('regName').value.trim();
  const errEl = document.getElementById('loginError');
  if (!email || !pass) { errEl.textContent = '請填寫 Email 和密碼'; errEl.style.display = 'block'; return; }
  const { error } = await db.auth.signUp({ email, password: pass, options: { data: { full_name: name } } });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  // Auto login after register
  const { data, error: loginErr } = await db.auth.signInWithPassword({ email, password: pass });
  if (loginErr) { toggleRegister(false); errEl.textContent = '帳號建立成功！請登入'; errEl.style.display = 'block'; return; }
  currentUser = data.user;
  _appBooted = true;
  await bootApp();
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLogout() {
  _appBooted = false;
  await db.auth.signOut();
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
}

async function bootApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  // Load user profile and role (safe - .maybeSingle() won't throw if no row)
  let profile = null;
  try {
    const { data } = await db.from('user_profiles').select('*').eq('id', currentUser.id).maybeSingle();
    profile = data;
  } catch(e) { profile = null; }
  window.userProfile = profile;
  window.isAdmin = !profile || profile.role === 'admin'; // if no profile, default to admin
  const name = profile?.full_name || currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || 'User';

  document.getElementById('sidebarName').textContent = name + (window.isAdmin ? ' 👑' : '');
  document.getElementById('sidebarEmail').textContent = currentUser.email || '';
  document.getElementById('sidebarAvatar').textContent = name[0].toUpperCase();
  const mobileUser = document.getElementById('mobileUserAvatar');
  if (mobileUser) mobileUser.textContent = name[0].toUpperCase();

  // Hide settings for sales role (or keep but restricted - we restrict inside settings)
  await initDB();
  await loadGlobalData();
  // 若網址帶有 #lead=xxx，登入後直接開啟該 Lead
  const hashLead = location.hash.match(/^#lead=([0-9a-fA-F\-]+)/);
  if (hashLead) {
    navigate('leads');
    setTimeout(() => openLeadDrawer(hashLead[1]), 400);
  } else {
    navigate('dashboard');
  }
}

async function loadGlobalData() {
  const [s, src] = await Promise.all([
    db.from('stages').select('*').order('order_index'),
    db.from('sources').select('*').order('name')
  ]);
  stagesData = s.data || [];
  sourcesData = src.data || [];
  try {
    const { data: tpl } = await db.from('activity_templates').select('*').order('name');
    activityTemplates = tpl || [];
  } catch(e) { activityTemplates = []; }
  try {
    const { data: nt } = await db.from('need_types').select('*').order('name');
    needTypesData = nt || [];
  } catch(e) { needTypesData = []; }
  try {
    const { data: dt } = await db.from('deal_types').select('*').order('name');
    dealTypesData = dt || [];
  } catch(e) { dealTypesData = []; }
  try {
    // Try to fetch all user profiles; RLS may limit results
    const { data: up, error: upErr } = await db.from('user_profiles').select('id,full_name,role,email').order('created_at');
    if (upErr) throw upErr;
    usersData = (up || []).filter(u => u.full_name || u.email); // only include users with a name
    console.log('usersData loaded:', JSON.stringify(usersData));
    // If RLS only returned 1 row (ourselves), also pull unique users from leads as fallback
    if (usersData.length <= 1) {
      const { data: leadUsers } = await db.from('leads').select('user_id,user_name').not('user_id','is',null);
      if (leadUsers) {
        const seen = new Set(usersData.map(u=>u.id));
        leadUsers.forEach(l => {
          if (l.user_id && l.user_name && !seen.has(l.user_id)) {
            seen.add(l.user_id);
            usersData.push({ id: l.user_id, full_name: l.user_name, role: 'sales', email: '' });
          }
        });
      }
    }
    console.log('usersData final:', JSON.stringify(usersData));
  } catch(e) { console.error('usersData load failed:', e); usersData = []; }
}

// ── Navigation ──
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(n => n.classList.remove('active'));
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');
  const bnav = document.getElementById('bnav-' + page);
  if (bnav) bnav.classList.add('active');
  document.getElementById('topbarTitle').textContent = {
    dashboard: 'Dashboard', leads: 'Leads', quotes: '報價單', accounts: '客戶', contacts: '聯絡人', settings: '設定', feed: '動態總覽'
  }[page] || page;
  document.getElementById('topbarActions').innerHTML = '';
  closeDrawer();
  renderPage(page);
}

function onFabClick() {
  if (currentPage === 'leads') openNewLeadModal();
  else if (currentPage === 'accounts') openNewAccountModal();
  else if (currentPage === 'quotes') saveCurrentQuote();
  else navigate('leads');
}

async function renderPage(page) {
  const content = document.getElementById('content');
  content.classList.toggle('quote-mode', page === 'quotes');
  content.innerHTML = '<div class="loading"><span class="dot-pulse">載入中</span></div>';
  switch(page) {
    case 'dashboard': await renderDashboard(); break;
    case 'leads': await renderLeads(); break;
    case 'quotes': await renderQuotes(); break;
    case 'accounts': await renderAccounts(); break;
    case 'contacts': await renderContacts(); break;
    case 'settings': await renderSettings(); break;
    case 'feed': await renderFeed(); break;
  }
}

async function renderDashboard() {
  const [leadsRes, accsRes, contractsRes, activitiesRes] = await Promise.all([
    db.from('leads').select('*'),
    db.from('accounts').select('*'),
    db.from('contracts').select('*'),
    db.from('activities').select('id,created_at,lead_id')
  ]);
  leadsData = leadsRes.data || [];
  accountsData = accsRes.data || [];
  const contracts = contractsRes.data || [];
  const allActivities = activitiesRes.data || [];

  // Build user filter options
  const userMap3 = {};
  leadsData.forEach(l => { if (l.user_id && l.user_name) userMap3[l.user_id] = l.user_name; });
  const dashUserOpts = [{val:'all',label:'全部業務'}, ...Object.entries(userMap3).map(([id,nm])=>({val:id,label:nm}))];
  let dashSelHtml = '<select class="form-select" style="width:auto;height:32px;font-size:13px" onchange="dashFilterUser=this.value;renderDashboard()">';
  dashUserOpts.forEach(function(o) { dashSelHtml += '<option value="' + o.val + '"' + (o.val === dashFilterUser ? ' selected' : '') + '>' + o.label + '</option>'; });
  dashSelHtml += '</select>';
  document.getElementById('topbarActions').innerHTML = '<div class="action-bar">' + dashSelHtml + '</div>';

  // Filter data by selected user
  const filtLeads = dashFilterUser==='all' ? leadsData : leadsData.filter(l=>l.user_id===dashFilterUser);
  const filtAccounts = dashFilterUser==='all' ? accountsData : accountsData.filter(a=>a.user_id===dashFilterUser);
  const filtLeadIds = new Set(filtLeads.map(l=>l.id));
  const filtActivities = dashFilterUser==='all' ? allActivities : allActivities.filter(a=>filtLeadIds.has(a.lead_id));

  const today = new Date();
  const in30 = new Date(today); in30.setDate(today.getDate() + 30);

  // 本月統計 (use filtered data)
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const thisMonthLeads = filtLeads.filter(l => new Date(l.created_at) >= monthStart);
  const thisMonthActivities = filtActivities.filter(a => new Date(a.created_at) >= monthStart);
  const thisMonthAccounts = filtAccounts.filter(a => new Date(a.created_at) >= monthStart);

  // 今年至今統計
  const yearStart = new Date(today.getFullYear(), 0, 1);
  const thisYearLeads = filtLeads.filter(l => new Date(l.created_at) >= yearStart);
  const thisYearActivities = filtActivities.filter(a => new Date(a.created_at) >= yearStart);
  const thisYearAccounts = filtAccounts.filter(a => new Date(a.created_at) >= yearStart);
  const thisYearContracts = contracts.filter(c => new Date(c.created_at) >= yearStart);
  const thisYearRevenue = thisYearContracts.reduce((s,c) => s+(c.amount||0), 0);

  const activeLeads = filtLeads.filter(l => !['暫停','結案'].includes(getStageName(l.stage_id)));
  const wonLeads = filtLeads.filter(l => getStageName(l.stage_id) === '簽約進件');
  const expiring = contracts.filter(c => {
    const end = new Date(c.end_date);
    return end >= today && end <= in30;
  }).sort((a,b) => new Date(a.end_date) - new Date(b.end_date));

  // Stage funnel
  const funnelStages = stagesData.filter(s => !['暫停','結案'].includes(s.name));
  const funnelData = funnelStages.map(s => ({
    name: s.name,
    count: filtLeads.filter(l => l.stage_id === s.id).length
  }));
  const maxCount = Math.max(...funnelData.map(f => f.count), 1);

  const content = document.getElementById('content');
  content.innerHTML = `
    <div style="margin-bottom:8px;font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.05em">本月動態</div>
    <div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-card" style="border-left:3px solid var(--accent)">
        <div class="stat-label">本月新增 Leads</div>
        <div class="stat-value stat-accent">${thisMonthLeads.length}</div>
        <div class="stat-sub">共 ${leadsData.length} 筆</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--green)">
        <div class="stat-label">本月聯繫活動</div>
        <div class="stat-value stat-green">${thisMonthActivities.length}</div>
        <div class="stat-sub">活動記錄次數</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--yellow)">
        <div class="stat-label">本月新進件</div>
        <div class="stat-value" style="color:var(--yellow)">${thisMonthAccounts.length}</div>
        <div class="stat-sub">轉換為客戶</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--red)">
        <div class="stat-label">30天內到期</div>
        <div class="stat-value stat-${expiring.length>0?'red':'green'}">${expiring.length}</div>
        <div class="stat-sub">需要續約</div>
      </div>
    </div>
    <div style="margin-bottom:8px;font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.05em">今年至今（${today.getFullYear()}）</div>
    <div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-card" style="border-left:3px solid var(--accent)">
        <div class="stat-label">新增 Leads</div>
        <div class="stat-value stat-accent">${thisYearLeads.length}</div>
        <div class="stat-sub">今年共開發</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--green)">
        <div class="stat-label">聯繫活動</div>
        <div class="stat-value stat-green">${thisYearActivities.length}</div>
        <div class="stat-sub">今年活動次數</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--yellow)">
        <div class="stat-label">新進件</div>
        <div class="stat-value" style="color:var(--yellow)">${thisYearAccounts.length}</div>
        <div class="stat-sub">今年轉換客戶</div>
      </div>
      <div class="stat-card" style="border-left:3px solid var(--purple,#a78bfa)">
        <div class="stat-label">合約金額</div>
        <div class="stat-value" style="color:var(--purple,#a78bfa);font-size:18px">${thisYearRevenue>0?'$'+fmtNum(thisYearRevenue):'—'}</div>
        <div class="stat-sub">今年新簽合約總額</div>
      </div>
    </div>
    <div style="margin-bottom:8px;font-size:12px;color:var(--text3);font-weight:600;letter-spacing:0.05em">累積總覽</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">進行中 Leads</div>
        <div class="stat-value stat-accent">${activeLeads.length}</div>
        <div class="stat-sub">共 ${filtLeads.length} 筆</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">轉換客戶</div>
        <div class="stat-value stat-green">${filtAccounts.length}</div>
        <div class="stat-sub">累積成交</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">合約總數</div>
        <div class="stat-value">${contracts.length}</div>
        <div class="stat-sub">合約管理</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">進行中 / 總 Lead</div>
        <div class="stat-value">${filtLeads.length?Math.round(activeLeads.length/filtLeads.length*100):0}%</div>
        <div class="stat-sub">活躍比例</div>
      </div>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">📊 開發漏斗</div>
        <div class="funnel" id="funnelChart"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">⏰ 合約到期提醒</div>
        <div class="reminder-list" id="reminderList"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">📅 近期需聯絡</div>
        <div id="nextContactList"></div>
      </div>
    </div>
  `;

  // Render funnel
  const funnelEl = document.getElementById('funnelChart');
  if (funnelData.every(f => f.count === 0)) {
    funnelEl.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-text">尚無 Leads 資料</div></div>';
  } else {
    funnelEl.innerHTML = funnelData.map((f,i) => `
      <div class="funnel-row">
        <div class="funnel-label">${f.name}</div>
        <div class="funnel-bar-wrap">
          <div class="funnel-bar" style="width:${Math.max(f.count/maxCount*100,4)}%;background:${stagesData[i]?.color||'var(--accent)'}">
            ${f.count > 0 ? f.count : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  // Render reminders
  const reminderEl = document.getElementById('reminderList');
  if (expiring.length === 0) {
    reminderEl.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-icon">✅</div><div class="empty-text">近期無到期合約</div></div>';
  } else {
    reminderEl.innerHTML = expiring.slice(0,6).map(c => {
      const days = Math.ceil((new Date(c.end_date) - today) / 86400000);
      const color = days <= 7 ? 'var(--red)' : days <= 14 ? 'var(--yellow)' : 'var(--green)';
      return `
        <div class="reminder-item">
          <div class="reminder-dot" style="background:${color}"></div>
          <div class="reminder-name">${c.name || '合約'}</div>
          <div class="reminder-date">${c.end_date}</div>
          <div class="reminder-days" style="color:${color}">${days}天</div>
        </div>
      `;
    }).join('');
  }

  // Render next contact list
  const nextContactEl = document.getElementById('nextContactList');
  if (nextContactEl) {
    const upcoming = filtLeads
      .filter(l => l.next_contact_date)
      .sort((a,b) => new Date(a.next_contact_date) - new Date(b.next_contact_date))
      .slice(0, 10);
    if (!upcoming.length) {
      nextContactEl.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:8px 0">無待聯絡的 Lead</div>';
    } else {
      nextContactEl.innerHTML = upcoming.map(l => {
        const d = new Date(l.next_contact_date);
        const isOverdue = d < today;
        const diffDays = Math.ceil((d - today) / 86400000);
        const label = isOverdue ? '已過期 '+Math.abs(diffDays)+'天' : diffDays === 0 ? '今天' : diffDays+'天後';
        const color = isOverdue ? 'var(--red)' : diffDays <= 3 ? 'var(--yellow)' : 'var(--text3)';
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="navigate(\'leads\');setTimeout(()=>openLeadDrawer(\''+l.id+'\'),400)">'
          + '<div><div style="font-size:13px;font-weight:500">'+esc(l.name)+'</div>'
          + '<div style="font-size:11.5px;color:var(--text3)">'+new Date(l.next_contact_date).toLocaleDateString('zh-TW')+(l.user_name?' · '+esc(l.user_name):'')+'</div></div>'
          + '<div style="font-size:12px;font-weight:600;color:'+color+'">'+label+'</div>'
          + '</div>';
      }).join('');
    }
  }
}

// ── LEADS KANBAN ──
async function renderLeads() {
  await loadGlobalData();
  // Fetch leads without sort_order dependency (sort in JS to avoid NULL issues)
  const { data } = await db.from('leads').select('*, contacts(id)').order('created_at', {ascending:true});
  leadsData = (data || []).sort((a,b) => (a.sort_order ?? 999999) - (b.sort_order ?? 999999));

  // Load which leads have been converted to accounts
  const { data: accounts } = await db.from('accounts').select('lead_id').not('lead_id', 'is', null);
  convertedLeadIds = new Set((accounts||[]).map(a => a.lead_id));

  // usersData already loaded from loadGlobalData() above - don't overwrite!
  // But add any users from leads that aren't in usersData yet (edge case)
  const seenIds = new Set(usersData.map(u => u.id));
  leadsData.filter(l=>l.user_id&&l.user_name&&!seenIds.has(l.user_id)).forEach(l => {
    usersData.push({ id: l.user_id, full_name: l.user_name, role: 'sales', email: '' });
    seenIds.add(l.user_id);
  });

  document.getElementById('topbarActions').innerHTML = `
    <div class="action-bar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="form-input search-input" id="leadSearch" placeholder="搜尋..." style="width:150px" oninput="filterLeads()">
      </div>
      <div class="view-toggle">
        <button class="view-toggle-btn ${leadsViewMode==='kanban'?'active':''}" onclick="setLeadsView('kanban')">🗂</button>
        <button class="view-toggle-btn ${leadsViewMode==='list'?'active':''}" onclick="setLeadsView('list')">☰</button>
      </div>
      <button class="btn btn-secondary btn-sm ${showConvertedLeads?'btn-primary':''}" onclick="toggleShowConverted()" data-tip="顯示/隱藏已轉客戶的 Lead" style="font-size:11px">🏢 ${showConvertedLeads?'含已轉':'僅進行中'}</button>
      <button class="btn btn-secondary btn-sm" onclick="downloadImportTemplate()">📋</button>
      <button class="btn btn-secondary btn-sm" onclick="importLeadsExcel()">📥</button>
      <button class="btn btn-secondary btn-sm" onclick="exportLeadsExcel()">📤</button>
      <button class="btn btn-primary btn-sm" onclick="openNewLeadModal()">＋ Lead</button>
    </div>
  `;

  // Auto list-mode on mobile
  const isMobile = window.innerWidth <= 768;
  if (isMobile) { renderLeadsList(); return; }
  if (leadsViewMode === 'list') renderLeadsList();
  else renderKanban();
}

function renderKanban(searchStr = '') {
  const content = document.getElementById('content');
  content.style.padding = '16px';
  content.style.overflowX = 'auto';

  // Build filter bar
  const srcOptions = [{val:'all', label:'全部來源'}, ...sourcesData.map(s=>({val:s.id, label:s.name}))];
  const stageOptions = [{val:'all', label:'全部階段'}, ...stagesData.map(s=>({val:s.id, label:s.name}))];

  // Build user options from leads data
  const userMap = {};
  leadsData.forEach(l => { if (l.user_id && l.user_name) userMap[l.user_id] = l.user_name; });
  const userOptions = [{val:'all', label:'全部業務'}, ...Object.entries(userMap).map(([id,name])=>({val:id, label:name}))];

  content.innerHTML = `
    <div class="kanban-filters">
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('stage',this.value)">
        ${stageOptions.map(o=>`<option value="${o.val}"${kanbanFilterStage===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('user',this.value)">
        ${userOptions.map(o=>`<option value="${o.val}"${kanbanFilterUser===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="setKanbanFilter('src',this.value)">
        ${srcOptions.map(o=>`<option value="${o.val}"${kanbanFilterSrc===o.val?' selected':''}>${o.label}</option>`).join('')}
      </select>
    </div>
    <div id="kanban-board"></div>`;

  const board = document.getElementById('kanban-board');
  if (stagesData.length === 0) {
    board.innerHTML = '<div class="empty-state"><div>請先在設定中建立階段</div></div>';
    return;
  }

  const stagesToShow = kanbanFilterStage === 'all' ? stagesData : stagesData.filter(s => s.id === kanbanFilterStage);
  stagesToShow.forEach((stage, si) => {
    const stageIdx = stagesData.indexOf(stage);
    const stageleads = leadsData.filter(l => {
      if (l.stage_id !== stage.id) return false;
      if (!showConvertedLeads && convertedLeadIds.has(l.id)) return false;
      if (searchStr && !l.name?.toLowerCase().includes(searchStr.toLowerCase()) && !l.company?.toLowerCase().includes(searchStr.toLowerCase())) return false;
      if (kanbanFilterSrc !== 'all' && (l.source_id||'') !== kanbanFilterSrc) return false;
      if (kanbanFilterUser !== 'all' && (l.user_id||'') !== kanbanFilterUser) return false;
      return true;
    }).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    si = stageIdx;

    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.dataset.stageId = stage.id;
    col.innerHTML = `
      <div class="kanban-col-header">
        <div style="display:flex;align-items:center;gap:7px">
          <div class="col-accent" style="background:${stage.color||STAGE_COLORS[stageIdx]||'var(--accent)'}"></div>
          <div class="kanban-col-title">${stage.name}</div>
        </div>
        <div class="kanban-col-count">${stageleads.length}</div>
      </div>
      <div class="kanban-cards" id="col-${stage.id}"
        ondragover="colDragOver(event,this)"
        ondrop="colDrop(event,'${stage.id}')"
        ondragleave="colDragLeave(event,this)">
      </div>
      <button class="add-card-btn" onclick="openNewLeadModal('${stage.id}')">＋ 新增</button>
    `;
    board.appendChild(col);

    const cardsEl = col.querySelector('.kanban-cards');
    if (stageleads.length === 0) {
      cardsEl.innerHTML = '<div style="height:40px"></div>';
    } else {
      stageleads.forEach(lead => {
        const card = createKanbanCard(lead);
        cardsEl.appendChild(card);
      });
    }
  });
}

function setKanbanFilter(type, val) {
  if (type === 'prio') kanbanFilterPrio = val;
  else if (type === 'src') kanbanFilterSrc = val;
  else if (type === 'stage') kanbanFilterStage = val;
  else if (type === 'user') kanbanFilterUser = val;
  renderKanban(document.getElementById('leadSearch')?.value || '');
}

function createKanbanCard(lead) {
  const card = document.createElement('div');
  card.className = 'kanban-card';
  card.dataset.id = lead.id;
  card.draggable = true;
  const src = sourcesData.find(s => s.id === lead.source_id);
  card.innerHTML = `
    <div class="kc-name">${esc(lead.name)}</div>
    ${lead.company ? `<div class="kc-company">👤 ${esc(lead.company)}</div>` : ''}
    ${lead.tax_id ? `<div style="font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-bottom:4px">🏷 ${esc(lead.tax_id)}</div>` : ''}
    <div class="kc-meta">
      ${src ? `<div class="kc-tag">${esc(src.name)}</div>` : ''}
    </div>
    <div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:4px">
      ${usersData.length > 0
        ? '<select class="kc-user-select" data-lead-id="'+lead.id+'" style="font-size:11px;background:var(--bg4);border:1px solid var(--border);border-radius:4px;color:var(--text2);padding:2px 4px;cursor:pointer;max-width:120px;outline:none">'
          + '<option value="">👤 未指派</option>'
          + usersData.map(u => { const n=u.full_name||u.email||''; return '<option value="'+u.id+'|'+n+'"'+(u.id===lead.user_id?' selected':'')+'>'+n+'</option>'; }).join('')
          + '</select>'
        : '<span style="font-size:11px;color:var(--text3)">👤 '+(lead.user_name||'未指派')+'</span>'
      }
      <span style="font-size:10.5px;color:var(--text3)">${fmtDate(lead.created_at)}</span>
    </div>
  `;
  // Inline user assign
  const userSel = card.querySelector('.kc-user-select');
  if (userSel) {
    userSel.addEventListener('mousedown', e => e.stopPropagation());
    userSel.addEventListener('change', async e => {
      e.stopPropagation();
      const val = e.target.value;
      const [uid, uname] = val ? val.split('|') : ['', ''];
      await db.from('leads').update({ user_id: uid||null, user_name: uname||null, updated_at: new Date().toISOString() }).eq('id', lead.id);
      const ld = leadsData.find(l => l.id === lead.id);
      if (ld) { ld.user_id = uid||null; ld.user_name = uname||null; }
      toast((uname||'未指派') + ' 已接手 ' + esc(lead.name), 'success');
    });
  }
  card.addEventListener('dragstart', e => {
    dragSrcId = lead.id;
    dragSrcEl = card;
    setTimeout(() => card.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    dragSrcId = null;
    dragSrcEl = null;
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    if (!dragSrcEl || dragSrcEl === card) return;
    const srcStage = dragSrcEl.closest('.kanban-col')?.dataset.stageId;
    const tgtStage = card.closest('.kanban-col')?.dataset.stageId;
    if (srcStage !== tgtStage) return;
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    const ph = document.createElement('div');
    ph.className = 'drag-placeholder';
    ph.style.cssText = 'height:3px;background:var(--accent);border-radius:2px;margin:2px 0;pointer-events:none';
    const rect = card.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) card.parentElement.insertBefore(ph, card);
    else card.parentElement.insertBefore(ph, card.nextSibling);
  });
  card.addEventListener('drop', async e => {
    e.preventDefault();
    e.stopPropagation();
    document.querySelectorAll('.drag-placeholder').forEach(p => p.remove());
    if (!dragSrcEl) return;
    const srcStage = dragSrcEl.closest('.kanban-col')?.dataset.stageId;
    const tgtStage = card.closest('.kanban-col')?.dataset.stageId;
    if (!tgtStage) return;
    if (srcStage === tgtStage && dragSrcEl !== card) {
      // Same col: insert based on mouse Y position
      const rect = card.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) card.parentElement.insertBefore(dragSrcEl, card);
      else card.parentElement.insertBefore(dragSrcEl, card.nextSibling);
      await saveColOrder(tgtStage);
    } else if (srcStage !== tgtStage) {
      // Cross-col: change stage
      const lead = leadsData.find(l => l.id === dragSrcId);
      if (lead) {
        lead.stage_id = tgtStage;
        await db.from('leads').update({ stage_id: tgtStage, updated_at: new Date().toISOString() }).eq('id', dragSrcId);
        toast('已移至「' + (stagesData.find(s=>s.id===tgtStage)?.name||'') + '」', 'success');
        dragSrcId = null; dragSrcEl = null;
        renderKanban(document.getElementById('leadSearch')?.value || '');
        return;
      }
    }
    dragSrcId = null; dragSrcEl = null;
  });
  card.addEventListener('click', () => openLeadDrawer(lead.id));
  return card;
}

async function saveColOrder(stageId) {
  const colEl = document.getElementById('col-' + stageId);
  if (!colEl) return;
  const cards = colEl.querySelectorAll('.kanban-card');
  const updates = [];
  cards.forEach((c, i) => {
    const lead = leadsData.find(l => l.id === c.dataset.id);
    if (lead) { lead.sort_order = i; updates.push({id: c.dataset.id, sort_order: i}); }
  });
  for (const u of updates) {

}

let listSelectedIds = new Set();

function buildSelectHtml(opts, currentVal, onchangeFn) {
  let s = '<select class="form-select" style="width:auto;padding:3px 8px;font-size:12px;height:28px" onchange="' + onchangeFn + '">';
  opts.forEach(o => { s += '<option value="' + o.val + '"' + (o.val === currentVal ? ' selected' : '') + '>' + o.label + '</option>'; });
  s += '</select>';
  return s;
}

function renderLeadsList(searchStr) {
  if (searchStr === undefined) searchStr = '';
  const content = document.getElementById('content');
  content.style.padding = '16px';
  content.style.overflowX = 'auto';

  // Build filter options
  const srcOpts = [{val:'all',label:'全部來源'}].concat(sourcesData.map(s => ({val:s.id, label:s.name})));
  const stageOpts = [{val:'all',label:'全部階段'}].concat(stagesData.map(s => ({val:s.id, label:s.name})));
  const userMap2 = {};
  leadsData.forEach(function(l) { if (l.user_id && l.user_name) userMap2[l.user_id] = l.user_name; });
  const userOpts = [{val:'all',label:'全部業務'}].concat(Object.entries(userMap2).map(function(e) { return {val:e[0], label:e[1]}; }));

  // Always rebuild the full content (filter bar + table)
  const sortOpts = [
    {val:'default',      label:'排序：看板順序'},
    {val:'updated_desc', label:'最近更新（新→舊）'},
    {val:'created_desc', label:'建立日（新→舊）'},
    {val:'created_asc',  label:'建立日（舊→新）'},
  ];
  const stageSelectHtml = buildSelectHtml(stageOpts, listFilterStage, "setListFilter('stage',this.value)");
  const userSelectHtml  = buildSelectHtml(userOpts,  listFilterUser,  "setListFilter('user',this.value)");
  const srcSelectHtml   = buildSelectHtml(srcOpts,   listFilterSrc,   "setListFilter('src',this.value)");
  const sortSelectHtml  = buildSelectHtml(sortOpts,  listSortMode,    "setListSort(this.value)");

  const filtered = leadsData.filter(function(l) {
    if (!showConvertedLeads && convertedLeadIds.has(l.id)) return false;
    if (listFilterStage !== 'all' && l.stage_id !== listFilterStage) return false;
    if (listFilterSrc   !== 'all' && (l.source_id||'') !== listFilterSrc) return false;
    if (listFilterUser  !== 'all' && (l.user_id||'')   !== listFilterUser) return false;
    if (searchStr) {
      const q = searchStr.toLowerCase();
      return (l.name||'').toLowerCase().includes(q) || (l.company||'').toLowerCase().includes(q);
    }
    return true;
  });
  if (listSortMode === 'updated_desc') filtered.sort(function(a,b){ return new Date(b.updated_at||b.created_at) - new Date(a.updated_at||a.created_at); });
  else if (listSortMode === 'created_desc') filtered.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });
  else if (listSortMode === 'created_asc') filtered.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });
  window._listFiltered = filtered;
  const rows = filtered.map(l => {
    const stage = stagesData.find(s => s.id === l.stage_id);
    const src = sourcesData.find(s => s.id === l.source_id);
    const checked = listSelectedIds.has(l.id) ? 'checked' : '';
    return `<tr data-id="${l.id}" class="${listSelectedIds.has(l.id)?'list-row-selected':''}">
      <td onclick="event.stopPropagation()" style="width:36px;text-align:center;padding:0 8px">
        <input type="checkbox" ${checked} onchange="toggleListSelect('${l.id}',this.checked)" style="width:15px;height:15px;cursor:pointer">
      </td>
      <td style="cursor:pointer;font-weight:500" onclick="openLeadDrawer('${l.id}')">${esc(l.name)}</td>
      <td style="font-size:12px;color:var(--text3)">${esc(l.company||'—')}</td>
      <td style="font-size:12px;font-family:var(--mono);color:var(--text3)">${esc(l.tax_id||'—')}</td>
      <td onclick="event.stopPropagation()">
        <select class="form-select" style="padding:2px 4px;height:26px;font-size:11.5px;width:auto;max-width:120px" onchange="inlineUpdateLead('${l.id}','stage_id',this.value)">
          ${stagesData.map(s=>`<option value="${s.id}"${s.id===l.stage_id?' selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </td>
      <td onclick="event.stopPropagation()">
        <select class="form-select" style="padding:2px 4px;height:26px;font-size:11.5px;width:auto;max-width:100px" onchange="inlineUpdateLead('${l.id}','source_id',this.value)">
          <option value="">—</option>
          ${sourcesData.map(s=>`<option value="${s.id}"${s.id===l.source_id?' selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </td>
      <td style="font-size:12px;color:var(--text3)">${esc(l.user_name||'—')}</td>
      <td style="font-size:12px;color:var(--text3);cursor:pointer" onclick="openSetNextContact('${l.id}','${l.next_contact_date||''}')">${l.next_contact_date?new Date(l.next_contact_date).toLocaleDateString('zh-TW'):'<span style=\'color:var(--text3);font-size:11px\'>設定</span>'}</td>
      <td style="font-size:11px;color:var(--text3)">${fmtDate(l.updated_at || l.created_at)}</td>
      <td style="font-size:11px;color:var(--text3)">${fmtDate(l.created_at)}</td>
    </tr>`;
  });

  const batchBar = listSelectedIds.size ? `
    <div id="listBatchBar" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--accent-glow);border-radius:8px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:13px;font-weight:500">已選 ${listSelectedIds.size} 筆</span>
      <select class="form-select" id="batchStageSelect" style="width:auto;height:28px;font-size:12px">
        <option value="">批次改階段...</option>
        ${stagesData.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" onclick="batchUpdateField('stage_id','batchStageSelect')">套用</button>
      <select class="form-select" id="batchSrcSelect" style="width:auto;height:28px;font-size:12px">
        <option value="">批次改來源...</option>
        ${sourcesData.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
      <button class="btn btn-primary btn-sm" onclick="batchUpdateField('source_id','batchSrcSelect')">套用</button>
      <button class="btn btn-secondary btn-sm" onclick="listSelectedIds.clear();renderLeadsList(document.getElementById('leadSearch')?.value||'')">取消</button>
    </div>` : '';

  const filterBar = '<div class="kanban-filters" style="margin-bottom:10px">' + stageSelectHtml + userSelectHtml + srcSelectHtml + sortSelectHtml + '</div>';
  if (filtered.length === 0) {
    content.innerHTML = filterBar + '<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">沒有符合的 Lead</div></div>';
    return;
  }
  content.innerHTML = filterBar + batchBar + '<div class="panel" style="overflow:auto"><table class="leads-list-table" style="min-width:860px"><thead><tr><th style="width:36px"><input type="checkbox" onchange="toggleSelectAll(this)" style="width:15px;height:15px;cursor:pointer"></th><th>公司名稱</th><th>聯絡人</th><th>統編</th><th>階段</th><th>來源</th><th>業務</th><th>下次聯絡</th><th>最後更新</th><th>建立時間</th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';

function setListFilter(type, val) {
  if (type === 'src') listFilterSrc = val;
  else if (type === 'stage') listFilterStage = val;
  else if (type === 'user') listFilterUser = val;
  // Clear the filter bar so it re-renders with correct selections
  const bar = document.getElementById('listFilterBar');
  if (bar) bar.remove();
  const tbl = document.getElementById('listTableContainer');
  if (tbl) tbl.remove();
  renderLeadsList(document.getElementById('leadSearch')?.value || '');
}

function setListSort(val) {
  listSortMode = val;
  renderLeadsList(document.getElementById('leadSearch')?.value || '');
}

function toggleListSelect(id, checked) {
  if (checked) listSelectedIds.add(id); else listSelectedIds.delete(id);
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}
function toggleSelectAll(cb) {
  const filtered = window._listFiltered || [];
  if (cb.checked) filtered.forEach(l => listSelectedIds.add(l.id));
  else listSelectedIds.clear();
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}
async function inlineUpdateLead(leadId, field, value) {
  const update = { updated_at: new Date().toISOString() };
  update[field] = value || null;
  await db.from('leads').update(update).eq('id', leadId);
  const lead = leadsData.find(l => l.id === leadId);
  if (lead) lead[field] = value || null;
}
async function batchUpdateField(field, selectId) {
  const val = document.getElementById(selectId)?.value;
  if (!val || !listSelectedIds.size) { toast('請先選擇選項', 'error'); return; }
  for (const id of listSelectedIds) {
    await db.from('leads').update({ [field]: val, updated_at: new Date().toISOString() }).eq('id', id);
    const l = leadsData.find(l=>l.id===id); if (l) l[field] = val;
  }
  toast('已批次更新 ' + listSelectedIds.size + ' 筆', 'success');
  listSelectedIds.clear();
  renderLeadsList(document.getElementById('leadSearch')?.value||'');
}


function colDragOver(e, el) {
  e.preventDefault();
  el.closest('.kanban-col').classList.add('drag-over-col');
}
function colDragLeave(e, el) {
  if (!el.contains(e.relatedTarget)) el.closest('.kanban-col').classList.remove('drag-over-col');
}
async function colDrop(e, stageId) {
  e.preventDefault();
  document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over-col'));
  if (!dragSrcId) return;
  const lead = leadsData.find(l => l.id == dragSrcId);
  if (!lead) return;
  const oldStage = stagesData.find(s => s.id === lead.stage_id);
  const newStage = stagesData.find(s => s.id === stageId);
  if (lead.stage_id === stageId) return;

  // Auto-convert check
  if (newStage?.name === '簽約進件') {
    openConfirm('🎉 轉換為客戶', `「${lead.name}」即將進入簽約進件，是否同步轉換為 Account？`,
      async () => {
        await updateLeadStage(lead, stageId);
        await convertToAccount(lead);
        closeModal();
        navigate('leads');
      },
      async () => {
        await updateLeadStage(lead, stageId);
        navigate('leads');
      },
      '轉換 + 建立 Account', '僅移動'
    );
  } else {
    await updateLeadStage(lead, stageId);
    navigate('leads');
  }
}

async function updateLeadStage(lead, stageId) {
  await db.from('leads').update({ stage_id: stageId, updated_at: new Date().toISOString() }).eq('id', lead.id);
  lead.stage_id = stageId;
  toast(`已移至「${stagesData.find(s=>s.id===stageId)?.name}」`, 'success');
}

async function convertToAccount(lead) {
  const { data: existing } = await db.from('accounts').select('id').eq('lead_id', lead.id).single();
  if (existing) { toast('此 Lead 已有對應 Account', 'error'); return; }
  const { data: acc, error } = await db.from('accounts').insert({
    name: lead.name, company: lead.company, lead_id: lead.id,
    user_id: currentUser.id, created_at: new Date().toISOString()
  }).select().single();
  if (!error) toast(`✅ 已建立 Account：${lead.name}`, 'success');
}

function parseContactsText(text) {
  const rows = [];
  text.split('\n').forEach(line => {
    const sep = line.includes('\t') ? '\t' : ',';
    const cols = line.split(sep).map(s => s.trim());
    if (!cols[0]) return;
    rows.push({ name: cols[0], role: cols[1]||'', email: cols[2]||'', phone: cols[3]||'', line_id: cols[4]||'' });
  });
  return rows;
}

function previewNewLeadContacts() {
  const text = document.getElementById('lContactsText')?.value || '';
  const rows = parseContactsText(text);
  const el = document.getElementById('lContactsPreview');
  if (!el) return;
  if (!rows.length) { el.innerHTML = ''; return; }
  el.innerHTML = '已解析 ' + rows.length + ' 位：' + rows.map(r => '<strong>' + esc(r.name) + '</strong>' + (r.email ? ' (' + esc(r.email) + ')' : '')).join('、');
}

function toggleNeedTag(el) {
  el.classList.toggle('selected');
}

function getSelectedNeedTypes(containerId) {
  return [...document.querySelectorAll(`#${containerId} .need-tag.selected`)].map(el => el.dataset.id);
}

async function checkTaxIdDuplicate() {
  const taxId = document.getElementById('lTaxId')?.value.trim();
  const hint = document.getElementById('lTaxIdHint');
  if (!hint) return;
  if (!taxId || taxId.length < 8) { hint.innerHTML = ''; return; }

  if (data && data.length > 0) {
    hint.innerHTML = `<span style="color:var(--red)">⚠️ 統編已存在：${esc(data[0].name)}</span>`;
  } else {
    hint.innerHTML = '<span style="color:var(--green)">✓ 統編可用</span>';
  }
}

async function checkEditTaxIdDuplicate(leadId) {
  const taxId = document.getElementById('elTaxId')?.value.trim();
  const hint = document.getElementById('elTaxIdHint');
  if (!hint) return;
  if (!taxId || taxId.length < 8) { hint.innerHTML = ''; return; }
  const { data } = await db.from('leads').select('id,name').eq('tax_id', taxId).neq('id', leadId).limit(1);
  if (data && data.length > 0) {

  } else {
    hint.innerHTML = '<span style="color:var(--green)">✓ 統編可用</span>';

}

async function saveLead() {
  const name = document.getElementById('lName').value.trim();
  if (!name) { toast('請填寫名稱', 'error'); return; }
  const taxId = document.getElementById('lTaxId')?.value.trim() || null;
  // 統編唯一性驗證（只在有填寫時才檢查）
  if (taxId) {
    if (taxId.length !== 8) { toast('統一編號須為 8 碼數字', 'error'); return; }
    const { data: dup } = await db.from('leads').select('id,name').eq('tax_id', taxId).limit(1);
    if (dup && dup.length > 0) { toast(`統編 ${taxId} 已存在於「${dup[0].name}」`, 'error'); return; }
  }
  const selectedNeedTypes = getSelectedNeedTypes('lNeedTypes');
  let userId = currentUser.id;
  let userName = currentUser.user_metadata?.full_name || currentUser.email?.split('@')[0] || '';
  const userSelect = document.getElementById('lUserSelect');
  if (userSelect && userSelect.value) {
    const [selId, selName] = userSelect.value.split('|');
    userId = selId; userName = selName;
  } else {
    const nameInput = document.getElementById('lUserName');
    if (nameInput) userName = nameInput.value.trim() || userName;
  }
  const payload = {
    name,
    stage_id: document.getElementById('lStage').value || stagesData[0]?.id,
    source_id: document.getElementById('lSource').value || null,
    tax_id: taxId || null,
    need_types: selectedNeedTypes.length ? selectedNeedTypes : null,
    product_type: document.getElementById('lProductType')?.value.trim() || null,
    deal_type_id: document.getElementById('lDealType')?.value || null,
    user_id: userId, user_name: userName, created_at: new Date().toISOString()
  };
  const note = document.getElementById('lNote').value.trim();
  const { data: lead, error } = await db.from('leads').insert(payload).select().single();
  if (error) {
    toast('建立失敗：' + error.message, 'error');
    console.error('saveLead error:', error);
    return;
  }
  if (note) await db.from('notes').insert({ content: note, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
  const contactsText = document.getElementById('lContactsText')?.value || '';
  const contacts = parseContactsText(contactsText);
  for (const c of contacts) {
    await db.from('contacts').insert({ name: c.name, role: c.role, email: c.email, phone: c.phone, lead_id: lead.id, user_id: currentUser.id, created_at: new Date().toISOString() });
  }
  closeModal();
  toast('Lead 建立成功' + (contacts.length ? '，已新增 ' + contacts.length + ' 位聯絡人' : ''), 'success');
  navigate('leads');
}

async function openLeadDrawer(leadId) {
  currentLeadId = leadId;

  document.querySelectorAll('.drawer-panel').forEach((p,i) => p.classList.toggle('active', i===0));

  renderDrawerInfo(lead);
  renderDrawerContacts(leadId);
  renderDrawerActivities(leadId);
  renderDrawerNotes(leadId);
  renderDrawerQuotes(leadId);
}

function closeDrawer() {
  document.getElementById('leadDrawer').classList.remove('open');

  currentLeadId = null;
  setLeadHash(null);
}

// ── Lead 專屬連結（#lead=xxx）──
function leadUrl(leadId) {
  return location.origin + location.pathname + '#lead=' + leadId;
}
function setLeadHash(leadId) {
  try {
    if (leadId) history.replaceState(null, '', '#lead=' + leadId);
    else history.replaceState(null, '', location.pathname + location.search);
  } catch(e) {}
}
async function copyLeadLink(leadId) {
  const url = leadUrl(leadId);
  try {
    await navigator.clipboard.writeText(url);
    toast('Lead 連結已複製', 'success');
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = url;
    ta.style.cssText = 'position:fixed;left:-9999px';

function containerHasTypedContent(rootEl) {
  if (!rootEl) return false;
  const els = rootEl.querySelectorAll('input:not([type=checkbox]):not([type=radio]):not([type=date]):not([type=time]):not([type=color]), textarea');
  for (const el of els) {
    const v = (el.value || '').trim();
    const dv = (el.defaultValue || '').trim();
    if (v && v !== dv) return true;
  }
  return false;
}

function parseBatchContacts() {
  const text = document.getElementById('batchContactsText')?.value || '';
  const rows = [];
  text.split('\n').forEach(line => {
    const parts = line.split('\t').map(s => s.trim());
    const cols = parts.length >= 2 ? parts : line.split(',').map(s => s.trim());
    const name = cols[0];
    if (!name) return;
    rows.push({ name, role: cols[1]||'', email: cols[2]||'', phone: cols[3]||'' });
  });
  return rows;
}

function previewBatchContacts() {
  const rows = parseBatchContacts();
  const el = document.getElementById('batchPreview');
  if (!el) return;
  if (!rows.length) { el.innerHTML = ''; return; }
  let html2 = '<div style="margin-bottom:4px;font-weight:500">預覽（共 ' + rows.length + ' 筆）：</div>';
  rows.forEach(r => {
    html2 += '<div style="padding:3px 0;border-bottom:1px solid var(--border)">';
    html2 += '<span style="font-weight:500">' + esc(r.name) + '</span>';
    if (r.role)  html2 += ' · ' + esc(r.role);
    if (r.email) html2 += ' · ' + esc(r.email);
    if (r.phone) html2 += ' · ' + esc(r.phone);
    html2 += '</div>';
  });
  el.innerHTML = html2;
}

// ── Activity time helpers ──
function _pad2(n){ return String(n).padStart(2,'0'); }
function nowDateStr(){ const d=new Date(); return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function nowTimeStr(){ const d=new Date(); return _pad2(d.getHours())+':'+_pad2(d.getMinutes()); }
function isoToLocalDate(iso){ if(!iso) return nowDateStr(); const d=new Date(iso); if(isNaN(d.getTime())) return nowDateStr(); return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate()); }
function isoToLocalTime(iso){ if(!iso) return nowTimeStr(); const d=new Date(iso); if(isNaN(d.getTime())) return nowTimeStr(); return _pad2(d.getHours())+':'+_pad2(d.getMinutes()); }
// Combine local date + time inputs into a correct UTC ISO timestamp
function localToISO(dateStr, timeStr){
  if(!dateStr) return new Date().toISOString();
  const t = timeStr || '00:00';
  const dt = new Date(dateStr + 'T' + t + ':00'); // parsed as local time
  if(isNaN(dt.getTime())) return new Date().toISOString();
  return dt.toISOString();
}

// ── Voice-to-text (mobile-friendly) ──
let _recognition = null;
function startVoiceInput(targetId, btnEl) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // Already recording → stop
  if (_recognition) { try { _recognition.stop(); } catch(e){} return; }
  if (!SR) {
    toast('此瀏覽器不支援語音按鈕，請改用手機鍵盤上的麥克風圖示', 'error');
    return;
  }
  const ta = document.getElementById(targetId);
  if (!ta) return;
  const rec = new SR();
  rec.lang = 'zh-TW';
  rec.continuous = true;
  rec.interimResults = true;
  _recognition = rec;
  const baseText = ta.value ? (ta.value.endsWith('\n') ? ta.value : ta.value + '\n') : '';
  if (btnEl) { btnEl.textContent = '⏹ 停止錄音'; btnEl.classList.remove('btn-secondary'); btnEl.classList.add('btn-danger'); }
  rec.onresult = (e) => {
    let txt = '';
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    ta.value = baseText + txt;
  };
  rec.onerror = (e) => {
    if (e.error !== 'aborted' && e.error !== 'no-speech') toast('語音辨識錯誤：' + (e.error || ''), 'error');
  };
  rec.onend = () => {
    _recognition = null;
    if (btnEl) { btnEl.textContent = '🎤 語音輸入'; btnEl.classList.remove('btn-danger'); btnEl.classList.add('btn-secondary'); }
  };
  try { rec.start(); } catch(e) { toast('無法啟動語音輸入', 'error'); _recognition = null; }
}

// ── QUOTES ──
function isQuoteNote(note) {
  return !!(note && typeof note.content === 'string' && note.content.startsWith(QUOTE_NOTE_PREFIX));
}
function parseQuoteNote(note) {
  if (!isQuoteNote(note)) return null;
  try {
    const data = JSON.parse(note.content.slice(QUOTE_NOTE_PREFIX.length));
    return { ...data, noteId: note.id, savedAt: note.created_at };
  } catch(e) { return null; }
}
function quoteMoney(n, currency='TWD') {
  const v = Number(n);
  return Number.isFinite(v) ? `${currency} ${Math.round(v).toLocaleString('en-US')}` : '—';
}
function quoteFrameWindow() {
  return document.getElementById('quoteFrame')?.contentWindow || null;
}
function postToQuoteFrame(message) {
  const w = quoteFrameWindow();
  if (w) w.postMessage(message, '*');
}
function requestQuoteSnapshot() {
  return new Promise((resolve, reject) => {
    if (!quoteFrameReady || !quoteFrameWindow()) { reject(new Error('報價工具尚未載入完成')); return; }
    const id = 'qreq-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    const timer = setTimeout(() => { quoteSnapshotRequests.delete(id); reject(new Error('取得報價資料逾時')); }, 5000);
    quoteSnapshotRequests.set(id, msg => { clearTimeout(timer); resolve(msg); });
    postToQuoteFrame({ type:'orderup-quote-request-snapshot', requestId:id });
  });
}
async function getLeadClientPayload(leadId) {
  const lead = (window._quoteActiveLeads || []).find(l => l.id === leadId) || leadsData.find(l => l.id === leadId);
  if (!lead) return null;
  let contact = lead.company || '', phone = '';
  try {
    const { data } = await db.from('contacts').select('name,phone').eq('lead_id', leadId).limit(1);
    if (data?.[0]) { contact = data[0].name || contact; phone = data[0].phone || ''; }
  } catch(e) {}
  return { name: lead.name || '', taxId: lead.tax_id || '', contact, phone };
}
function quoteLeadSearchText(lead) {
  return [lead.name, lead.company, lead.tax_id, lead.user_name, getStageName(lead.stage_id)].filter(Boolean).join(' ').toLowerCase();
}
function quoteSelectedLead() {
  return (window._quoteActiveLeads || []).find(l => l.id === quoteSelectedLeadId) || null;
}
function updateQuoteToolbarState() {
  const input = document.getElementById('quoteLeadSearch');
  const clear = document.getElementById('quoteSearchClear');
  const pill = document.getElementById('quoteBoundPill');
  const histBtn = document.getElementById('quoteHistoryBtn');
  const lead = quoteSelectedLead();
  if (input && lead && document.activeElement !== input) input.value = lead.name || '';
  if (clear) clear.style.display = (input?.value || quoteSelectedLeadId) ? 'flex' : 'none';
  if (pill) {
    pill.style.display = lead ? 'inline-flex' : 'none';
    pill.textContent = lead ? `已綁定 · ${lead.name}` : '';
  }
  if (histBtn) histBtn.disabled = !lead;
}
function closeQuoteSearchResults(delay=0) {
  setTimeout(() => document.getElementById('quoteSearchResults')?.classList.remove('open'), delay);
}
function renderQuoteSearchResults(query='') {
  const box = document.getElementById('quoteSearchResults');
  if (!box) return;
  const q = query.trim().toLowerCase();
  const all = window._quoteActiveLeads || [];
  const matches = (q ? all.filter(l => quoteLeadSearchText(l).includes(q)) : all).slice(0, 10);
  let html = '';
  if (query.trim()) {
    html += `<div class="quote-search-item quote-search-manual" onmousedown="event.preventDefault()" onclick="quoteUseManualClientFromSearch()">
      <div style="font-size:16px">✍️</div><div class="quote-search-main"><div class="quote-search-name">使用「${esc(query.trim())}」作為新客戶</div><div class="quote-search-meta">不綁定 CRM，可直接在下方繼續補資料與列印</div></div>
    </div>`;
  } else {
    html += `<div class="quote-search-item quote-search-manual" onmousedown="event.preventDefault()" onclick="quoteUseManualClient('')">
      <div style="font-size:16px">✍️</div><div class="quote-search-main"><div class="quote-search-name">手動輸入新客戶</div><div class="quote-search-meta">不綁定 CRM，直接使用下方報價單欄位</div></div>
